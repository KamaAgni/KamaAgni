ence about what you'll do when you're back."}, {"c": "between", "t": "The Quiet Nap", "h": 1, "n": "A weekend afternoon.", "a": "Lie down together for a nap. Lie facing each other and breathe slowly.", "b": "Roll into each other's arms. Take turns being the big spoon for three minutes.", "g": "Drift off or get up, whichever you like."}, {"c": "between", "t": "Lunch Break Dessert", "h": 2, "n": "A lunch hour at home.", "a": "Make dessert and feed each other the first bites.", "b": "Stay in the kitchen. One of you wears an apron and not much else. The other gets a private show.", "g": "Wash the plates together, slowly."}, {"c": "between", "t": "Baby's Asleep Window", "h": 2, "n": "A nap-time or bedtime window.", "a": "Whisper, so nobody wakes. Kiss slowly with your eyes open.", "b": "Keep everything silent. The quieter you are, the longer each touch can last.", "g": "Hold hands on the way out. Keep the door shut and the night open."}, {"c": "between", "t": "Phone Free Sixty", "h": 1, "n": "Phones in another room.", "a": "Put the phones away, face each other and breathe in together for a full minute.", "b": "Each of you tells the other three things you've noticed about them today. Add a touch for every compliment.", "g": "End with a hug, and say thank you."}, {"c": "between", "t": "Foot Rub Trade", "h": 1, "n": "Two comfortable seats and lotion.", "a": "Take your socks off. Decide who goes first.", "b": "Give a slow six-minute foot rub, three minutes each, listening to how they react.", "g": "Wrap their feet in a warm blanket and hold them."}, {"c": "between", "t": "The Compliment Challenge", "h": 1, "n": "A timer.", "a": "Stand face to face. Take turns giving a sincere compliment every 20 seconds for two minutes.", "b": "Move closer after each one. By the end, no more than a hand's width apart.", "g": "Finish with a long, tender kiss."}, {"c": "between", "t": "Edge of the Bed", "h": 3, "n": "A bed and some music.", "a": "Sit on the edge of the bed. One of you stands,
