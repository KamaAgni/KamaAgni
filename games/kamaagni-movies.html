  const L=list();
  h+='<input class="mv-s" id="q" placeholder="Search a title" value="'+esc(f.q)+'" aria-label="Search a title"/>'+chips(MOODS,'m')+chips(HEAT,'h')+chips(LEN,'l')+
  '<button class="kx-btn gold" id="rnd" style="display:block;width:100%;margin:8px 0">🎲 Pick one for us ('+L.length+' match)</button>';
  if(pick){const x=pick;h+='<div class="mv-pick"><div class="mv-meta">Tonight’s pick</div><div class="mv-t" style="font-size:22px;margin:4px 0">'+esc(x.t)+'</div><div class="mv-meta">'+x.y+' · '+x.m+' min · '+HL[x.h]+'</div><p class="mv-b">'+esc(x.b)+'</p><p class="mv-b"><b>While you watch:</b> '+esc(ADD[Math.floor(Math.random()*ADD.length)])+'</p><div class="mv-act" style="justify-content:center"><button data-w="'+esc(x.t)+'" class="'+(inW(x.t)?'on':'')+'">'+(inW(x.t)?'♥ On our list':'♡ Save')+'</button><button id="rnd2">Another</button></div></div>';}
  h+=L.slice(0,60).map(card).join('')||'<p class="kx-muted kx-center">Nothing matches. Try another mood or length.</p>';
  if(L.length>60)h+='<p class="kx-muted kx-center">Showing 60 of '+L.length+'. Narrow with a mood or search.</p>';
 }else if(f.tab==='pick'){
  const both=D.filter(x=>st.p[x.t]&&st.p[x.t][0]&&st.p[x.t][1]&&!seen(x.t)), one=D.filter(x=>st.p[x.t]&&(st.p[x.t][0]!==st.p[x.t][1])&&!seen(x.t));
  h+='<div class="g-note">Each of you tap ☆ on films you would watch (on any card in Find). Films you both starred show here.</div>';
  h+=both.length?'<h4 style="margin:10px 0 4px">⭐ You both want these</h4>'+both.map(card).join('')+'<button class="kx-btn gold" id="rb" style="display:block;width:100%;margin:8px 0">🎲 Choose one of these</button>':'<div class="kx-card kx-center"><p>No overlap yet. Star a few films each.</p></div>';
  if(pick&&both.includes(pick))h+='<div class="mv-pick"><div class="mv-t" style="font-size:22px">'+esc(pick.t)+'</div><p class="mv-b">'+esc(pick.b)+'</p></div>';
  if(one.length)h+='<h4 style="margin:14px 0 4px">One of you wants these</h4>'+one.map(card).join('');
 }else if(f.tab==='list'){
  const L=st.w.map(t=>D.find(x=>x.t===t)).filter(Boolean);
  h+=L.length?L.map(card).join('')+'<button class="kx-btn gold" id="rl" style="display:block;width:100%;margin:8px 0">🎲 Choose from our list</button>':'<div class="kx-card kx-center"><p>Your list is empty. Tap ♡ on a film in Find.</p></div>';
  if(pick&&f.tab==='list')h+='<div class="mv-pick"><div class="mv-t" style="font-size:22px">'+esc(pick.t)+'</div><p class="mv-b">'+esc(pick.b)+'</p></div>';
 }else{
  const L=Object.keys(st.s).map(t=>D.find(x=>x.t===t)).filter(Boolean);
  h+=L.length?L.map(x=>{const r=st.s[x.t].r||[0,0];const avg=(r[0]&&r[1])?((r[0]+r[1])/2).toFixed(1):'';const k=x.k.find(z=>TALK[z])||'romantic';
   return '<div class="mv-card"><div class="mv-h"><span class="mv-t">'+esc(x.t)+'</span><span class="mv-meta">'+(avg?'Our score '+avg+' / 5':'Rate it')+'</span></div>'+[0,1].map(p=>'<div class="mv-rate"><span class="mv-meta" style="display:inline-block;min-width:70px">'+esc(names[p])+'</span>'+[1,2,3,4,5].map(n=>'<button data-r="'+esc(x.t)+'|'+p+'|'+n+'" class="'+(r[p]>=n?'on':'')+'" aria-label="'+n+' of 5">♥</button>').join('')+'</div>').join('')+
   '<details style="margin-top:6px"><summary class="mv-meta" style="cursor:pointer;min-height:36px">Talk about it</summary><ul>'+TALK[k].map(q=>'<li style="margin:4px 0">'+esc(q)+'</li>').join('')+'</ul></details><div class="mv-act"><button data-u="'+esc(x.t)+'">Remove</button></div></div>';}).join(''):'<div class="kx-card kx-center"><p>Nothing watched yet. Mark a film watched to rate it together.</p></div>';
 }
 app.innerHTML=h; bind();
}
function bind(){
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{f.tab=b.dataset.tab;pick=null;view();});
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{f[b.dataset.k]=isNaN(b.dataset.v)||b.dataset.k==='m'?b.dataset.v:+b.dataset.v;pick=null;view();});
 const q=document.getElementById('q'); if(q) q.oninput=()=>{f.q=q.value;const p=q.selectionStart;view();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};
 const r1=document.getElementById('rnd'), r2=document.getElementById('rnd2'), rl=document.getElementById('rl');
 const go=()=>{const L=list();if(L.length){pick=L[Math.floor(Math.random()*L.length)];view();}};
 if(r1)r1.onclick=go; if(r2)r2.onclick=go;
 if(rl)rl.onclick=()=>{const L=st.w.map(t=>D.find(x=>x.t===t)).filter(Boolean);pick=L[Math.floor(Math.random()*L.length)];view();};
 app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const t=b.dataset.w;st.w=inW(t)?st.w.filter(x=>x!==t):st.w.concat(t);save();view();});
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const t=b.dataset.s;if(st.s[t])delete st.s[t];else{st.s[t]={r:[0,0]};st.w=st.w.filter(x=>x!==t);}save();view();});
 app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const [t,p,n]=b.dataset.r.split('|');st.s[t].r[+p]=st.s[t].r[+p]===+n?0:+n;save();view();});
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const [t,p]=b.dataset.p.split('|');const a=st.p[t]||[0,0];a[+p]=a[+p]?0:1;st.p[t]=a;save();view();});
 const rb=document.getElementById('rb'); if(rb)rb.onclick=()=>{const B=D.filter(x=>st.p[x.t]&&st.p[x.t][0]&&st.p[x.t][1]&&!seen(x.t));pick=B[Math.floor(Math.random()*B.length)];view();};
 app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{delete st.s[b.dataset.u];save();view();});
}
view();
})();
</script>
