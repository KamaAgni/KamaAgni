<script>
/* ---------------- Embers background ---------------- */
(function(){
  const wrap = document.getElementById('embers');
  const n = 26;
  for(let i=0;i<n;i++){
    const e = document.createElement('div');
    e.className='ember-particle';
    const left = Math.random()*100;
    const dur = 6 + Math.random()*8;
    const delay = Math.random()*10;
    const drift = (Math.random()*60-30)+'px';
    e.style.left = left+'%';
    e.style.animationDuration = dur+'s';
    e.style.animationDelay = delay+'s';
    e.style.setProperty('--drift', drift);
    e.style.width = e.style.height = (2+Math.random()*3)+'px';
    wrap.appendChild(e);
  }
})();

/* ---------------- Deck & Poker evaluation ---------------- */
const SUITS = ['♠','♥','♦','♣'];
const REDS = new Set(['♥','♦']);
function rankLabel(r){ return r<=10 ? String(r) : {11:'J',12:'Q',13:'K',14:'A'}[r]; }

function freshDeck(){
  const d = [];
  for(const s of SUITS) for(let r=2;r<=14;r++) d.push({r,s});
  return d;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const HAND_NAMES = {10:'Royal Flush',9:'Straight Flush',8:'Four of a Kind',7:'Full House',6:'Flush',5:'Straight',4:'Three of a Kind',3:'Two Pair',2:'Pair',1:'High Card'};

function evaluateHand(cards){
  const counts = {};
  cards.forEach(c=> counts[c.r]=(counts[c.r]||0)+1);
  const groups = Object.entries(counts).map(([r,c])=>({r:+r,c})).sort((a,b)=> b.c-a.c || b.r-a.r);
  const ranksSorted = cards.map(c=>c.r).sort((a,b)=>b-a);
  const isFlush = cards.every(c=>c.s===cards[0].s);
  const uniq = [...new Set(ranksSorted)];
  let isStraight=false, high=null;
  if(uniq.length===5){
    if(uniq[0]-uniq[4]===4){ isStraight=true; high=uniq[0]; }
    else if(uniq[0]===14 && uniq[1]===5 && uniq[2]===4 && uniq[3]===3 && uniq[4]===2){ isStraight=true; high=5; }
  }
  let cat, tie;
  if(isStraight && isFlush){ cat = high===14?10:9; tie=[high]; }
  else if(groups[0].c===4){ cat=8; tie=[groups[0].r, groups[1].r]; }
  else if(groups[0].c===3 && groups[1] && groups[1].c===2){ cat=7; tie=[groups[0].r, groups[1].r]; }
  else if(isFlush){ cat=6; tie=ranksSorted; }
  else if(isStraight){ cat=5; tie=[high]; }
  else if(groups[0].c===3){ cat=4; tie=[groups[0].r, ...groups.slice(1).map(g=>g.r)]; }
  else if(groups[0].c===2 && groups[1] && groups[1].c===2){ cat=3; tie=[groups[0].r, groups[1].r, groups[2].r]; }
  else if(groups[0].c===2){ cat=2; tie=[groups[0].r, ...groups.slice(1).map(g=>g.r)]; }
  else { cat=1; tie=ranksSorted; }
  return {cat, name:HAND_NAMES[cat], tie};
}
function compareHands(a,b){
  if(a.cat!==b.cat) return a.cat-b.cat;
  for(let i=0;i<a.tie.length;i++){
    if(a.tie[i]!==b.tie[i]) return a.tie[i]-b.tie[i];
  }
  return 0;
}

/* ---------------- Reward content ---------------- */
const PK = {bet: true, strip: true, heat: (window.KX && KX.heat) ? KX.heat() : 2};
const pkEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const REWARD_ORDER = ['strip','strip','cuddle','nude','hot','hot','lust','climax'];

  strip:{label:'Strip', desc:'One item comes off.'},

function markerPool(){
  let pool = MARKERS.filter(m => m.h <= PK.heat);
  if (window.KA_FILTER && KA_FILTER.keep) { try { const keep = KA_FILTER.keep(pool.map(m => m.t)); if (keep && keep.length) pool = pool.filter(m => keep.includes(m.t)); } catch (e) {} }
  return pool.length ? pool : MARKERS.filter(m => m.h === 1);
}
function randomOptions(type){ return shuffle(REWARD_CONTENT[type]).slice(0, type==='climax'?4:3); }

/* ---------------- helpers: timers that clean up, sound, motion ---------------- */
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let RENDERED_PHASE = null, TMS = [], STOP = [], LAST = {chips: [50, 50], pot: 0};
const later = (fn, ms) => { if (RM) ms = Math.min(ms, 60); const id = setTimeout(fn, ms); TMS.push(id); return id; };
function clearAll(){ TMS.forEach(clearTimeout); TMS = []; STOP.forEach(f => { try { f(); } catch (e) {} }); STOP = []; }
const sfx = n => { try { if (!window.KA_FX) return; if (n === 'shuffle') KA_FX.shuffle(); else KA_FX.clack(n || 2); } catch (e) {} };
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const drive = idx => { const m = (typeof PK_ME === 'function') ? PK_ME() : null; return m == null || m === idx; };
/* progress bar that continues by itself unless the person taps the button */
function autoNext(host, secs, label, fn, allowed){
  const wrap = el('div', 'center'); wrap.style.marginTop = '14px';
  wrap.innerHTML = '<div class="kauto-next" style="margin:0 auto 10px"><i></i></div>';
  const btn = el('button', 'btn-ghost', label); btn.style.width = '100%'; wrap.appendChild(btn); host.appendChild(wrap);
  const bar = wrap.querySelector('i'); let done = false; const go = () => { if (done) return; done = true; fn(); };
  btn.onclick = go;
  if (allowed === false) { btn.textContent = 'Waiting for your partner…'; btn.disabled = true; }
  const t0 = Date.now(), iv = setInterval(() => { const f = Math.min(1, (Date.now() - t0) / (secs * 1000)); bar.style.width = f * 100 + '%'; if (f >= 1) { clearInterval(iv); if (allowed !== false) go(); } }, 100);
  STOP.push(() => { done = true; clearInterval(iv); });
}

/* ---------------- Game State ---------------- */
let S = null;
function newPlayer(name){ return { name, hand:[], deckIndex:0, bails:2, clothes:5, chips:50, freshN:0 }; }

function initGame(nameA, nameB, finale){
  S = {
    phase:'deal-p1', round:1, dealer:0,
    players:[newPlayer(nameA), newPlayer(nameB)],
    pack:[], selected:[], revealed:false, rewardQueue:[], currentReward:null, lastRoundResult:null, winner:null, log:[],
    pot:0, bet:null, markerDue:null, markerOpts:null, finale: finale || '', bustMsg:'', foldMsg:'', potWon:null, cfgBet: PK.bet, cfgStrip: PK.strip
  };
  startRound();
}
function startRound(){
  const deck = shuffle(freshDeck());
  S.players[0].hand = deck.splice(0,5);
  S.players[1].hand = deck.splice(0,5);
  S.players.forEach(p => p.freshN = 5);
  S.pack = deck; S.selected = [[], []]; S.revealed = false;
  S.pot = 0; S.bet = null; S.markerDue = null; S.markerOpts = null; S.potWon = null;
  if (S.cfgBet) S.players.forEach(p => { const a = Math.min(5, p.chips); p.chips -= a; S.pot += a; });
  S.phase = 'exchange1-nondealer-gate';
}
function nonDealer(){ return 1 - S.dealer; }
function actorOf(ph){ if (!S) return null; if (ph === 'stakeA') return nonDealer(); if (ph === 'stakeB') return S.dealer; if (ph === 'stakeR' && S.bet) return 1 - S.bet.by; return null; }

function drawReplacements(playerIdx){
  const p = S.players[playerIdx], sel = S.selected[playerIdx];
  if (sel.length){
    const kept = p.hand.filter((_,i)=> !sel.includes(i));
    const drawn = S.pack.splice(0, sel.length);
    p.hand = kept.concat(drawn); p.freshN = drawn.length;
  } else p.freshN = 0;
  S.selected[playerIdx] = [];
}
function afterExchange(){ S.phase = S.cfgBet ? 'stakeA' : 'showdown-gate'; }

function resolveShowdown(){
  const evalA = evaluateHand(S.players[0].hand), evalB = evaluateHand(S.players[1].hand);
  const cmp = compareHands(evalA, evalB);
  let winnerIdx = null; if (cmp > 0) winnerIdx = 0; else if (cmp < 0) winnerIdx = 1;
  S.lastRoundResult = {evalA, evalB, winnerIdx};
  if (winnerIdx === null){
    if (S.cfgBet && S.pot){ const h = Math.floor(S.pot / 2); S.players[0].chips += h; S.players[1].chips += S.pot - h; S.pot = 0; }
    S.phase = 'tie'; return;
  }
  if (S.cfgBet && S.pot){ S.players[winnerIdx].chips += S.pot; S.potWon = {to: winnerIdx, n: S.pot}; S.pot = 0; }
  const wp = S.players[winnerIdx];
  const type = REWARD_ORDER[Math.min(wp.deckIndex, REWARD_ORDER.length - 1)];
  wp.deckIndex++;
  S.currentReward = {who:winnerIdx, type, options: randomOptions(type), chosenIdx:0, picked:null};
  S.markerDue = (S.bet && S.bet.kind === 'marker' && S.bet.called) ? {loser: 1 - winnerIdx, m: S.bet.m} : null;
  S.phase = 'showdown';
}
function applyClothing(playerIdx, type){
  const p = S.players[playerIdx];
  if (type === 'strip') p.clothes = Math.max(0, p.clothes-1);
  if (type === 'nude') p.clothes = 0;
}
function nextRound(){ S.dealer = 1 - S.dealer; S.round++; S.currentReward = null; startRound(); }
function endHand(){
  S.currentReward = null; S.bet = null; S.markerDue = null;
  if (S.cfgBet){
    const b = S.players.findIndex(p => p.chips <= 0);
    if (b >= 0){
      const p = S.players[b]; S.players.forEach(x => x.chips = 50);
      if (S.cfgStrip){
        if (p.clothes > 0){ p.clothes--; S.bustMsg = p.name + ' is out of chips and removes one item. Chips reset to 50 each.'; S.phase = 'bust'; return; }
        S.winner = 1 - b; S.phase = 'final'; return;
      }
      const m = shuffle(markerPool())[0];
      S.bustMsg = p.name + ' is out of chips and owes a forfeit: ' + m.t + '. Chips reset to 50 each.'; S.phase = 'bust'; return;
    }
  }
  nextRound();
}
function finishReward(){
  const r = S.currentReward;
  applyClothing(r.who, r.type);
  if (r.type === 'climax'){ S.winner = r.who; S.phase = 'final'; return; }
  endHand();
}

/* ---------------- Rendering ---------------- */
const app = document.getElementById('app');
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
const go = ph => { S.phase = ph; render(); };

function render(){
  clearAll(); app.innerHTML = '';
  if (S && S.phase !== RENDERED_PHASE) { try { scrollTo(0, 0); } catch (e) {} } RENDERED_PHASE = S ? S.phase : null;
  app.appendChild(logo());
  if (!S){ app.appendChild(setupScreen()); return; }
  app.appendChild(agniTrack());
  const ph = S.phase;
  if (ph === 'exchange1-nondealer-gate') app.appendChild(privacyGate(nonDealer(), () => go('exchange1-nondealer'), 'First Exchange'));
  else if (ph === 'exchange1-nondealer') app.appendChild(exchangeScreen(nonDealer(), () => { drawReplacements(nonDealer()); go('exchange1-dealer-gate'); }, 'First exchange'));
  else if (ph === 'exchange1-dealer-gate') app.appendChild(privacyGate(S.dealer, () => go('exchange1-dealer'), 'First Exchange'));
  else if (ph === 'exchange1-dealer') app.appendChild(exchangeScreen(S.dealer, () => { drawReplacements(S.dealer); go('exchange2-nondealer-gate'); }, 'First exchange'));
  else if (ph === 'exchange2-nondealer-gate') app.appendChild(privacyGate(nonDealer(), () => go('exchange2-nondealer'), 'Second Exchange'));
  else if (ph === 'exchange2-nondealer') app.appendChild(exchangeScreen(nonDealer(), () => { drawReplacements(nonDealer()); go('exchange2-dealer-gate'); }, 'Second exchange'));
  else if (ph === 'exchange2-dealer-gate') app.appendChild(privacyGate(S.dealer, () => go('exchange2-dealer'), 'Second Exchange'));
  else if (ph === 'exchange2-dealer') app.appendChild(exchangeScreen(S.dealer, () => { drawReplacements(S.dealer); afterExchange(); render(); }, 'Second exchange'));
  else if (ph === 'stakeA' || ph === 'stakeB' || ph === 'stakeR') app.appendChild(stakeScreen());
  else if (ph === 'fold') app.appendChild(foldScreen());
  else if (ph === 'showdown-gate') app.appendChild(showdownGate());
  else if (ph === 'showdown') app.appendChild(showdownScreen());
  else if (ph === 'tie') app.appendChild(tieScreen());
  else if (ph === 'marker') app.appendChild(markerScreen());
  else if (ph === 'reward') app.appendChild(rewardScreen());
  else if (ph === 'bust') app.appendChild(bustScreen());
  else if (ph === 'final') app.appendChild(finalScreen());
  LAST = {chips: S.players.map(p => p.chips), pot: S.pot};
}

  d.innerHTML = `<div class="eyebrow" style="text-align:center">KamaAgni Presents</div><h1>Poker for Couples</h1><div class="tag">the quick version · let the fire decide</div>`;

}

    <div class="eyebrow">Before you begin</div>
    <p class="muted" style="margin-bottom:18px;">Two players, five clothing items each (a pair of socks or shoes counts as one). Play in a room where you won't be interrupted for about 90 minutes. Everything is optional, and either of you can stop at any time.</p>
    <label>Player One</label><input type="text" id="nameA" placeholder="e.g. Priya" maxlength="16">

/* chips drawn as real stacks */
function stackHTML(n){
  const den = [[50,'k'],[25,'g'],[10,'b'],[5,'r']]; let out = '', left = n, c = 0;
  for (const [v,k] of den) while (left >= v && c < 16){ out += `<i class="chip ${k}" style="--n:${c}"></i>`; left -= v; c++; }
  return `<div class="stack">${out}</div>`;
}
function agniTrack(){
  const wrap = el('div','panel');
  const track = el('div','agni-track');
  S.players.forEach((p,i)=>{
    const pct = Math.round((p.deckIndex/8)*100);
    const col = el('div','agni-col');
    col.innerHTML = `<div class="agni-name">${pkEsc(p.name)}${S.dealer===i?' <span style="opacity:.5">(dealer)</span>':''}</div>
      <div class="agni-bar"><div class="agni-fill" style="width:${pct}%"></div></div>
      <div class="agni-sub">${p.clothes} item${p.clothes===1?'':'s'} left · ${p.bails} bail${p.bails===1?'':'s'}</div>`;
    track.appendChild(col);
  });
  wrap.appendChild(track);
  if (S.cfgBet){
    const t = el('div','table');
    const seat = i => { const p = S.players[i], bump = p.chips !== LAST.chips[i] ? ' bump' : '', gain = S.potWon && S.potWon.to === i && S.phase !== 'exchange1-nondealer-gate' ? `<span class="gain">+${S.potWon.n}</span>` : '';
      return `<div class="seat${bump}">${gain}${stackHTML(p.chips)}<b>${p.chips}</b><small>${pkEsc(p.name)}</small></div>`; };
    t.innerHTML = seat(0) + `<div class="seat pot${S.pot !== LAST.pot ? ' bump' : ''}">${stackHTML(S.pot)}<b>${S.pot}</b><small>Pot</small></div>` + seat(1);
    wrap.appendChild(t);
  }
  wrap.appendChild(el('div','muted center', `Round ${S.round}`));
  return wrap;
}

function privacyGate(playerIdx, onReady, phaseLabel){
  const p = S.players[playerIdx];
  const wrap = el('div','panel privacy-screen');
  wrap.innerHTML = `<div class="badge">${phaseLabel}</div><div class="icon">🔥</div><h2>Pass to ${pkEsc(p.name)}</h2><p class="muted">Make sure ${pkEsc(S.players[1-playerIdx].name)} can't see the screen.</p>`;
  const btn = el('button','btn-primary', `I'm ${pkEsc(p.name)}. Show my hand`);

/* a real 3D card: dealt from the deck, flips face up */
function cardEl(card, o){
  o = o || {};
  const isRed = REDS.has(card.s);
  const c = el('div', 'pc' + (o.down ? ' down' : '') + (o.selected ? ' selected' : '') + (isRed ? ' red' : '') + (o.onClick ? '' : ' static') + (o.deal ? ' dealin' : ''));
  c.style.setProperty('--i', o.i || 0);
  c.innerHTML = `<div class="pc-in"><div class="pc-f"><div class="rk">${rankLabel(card.r)}</div><div class="suit">${card.s}</div><div class="rk2">${rankLabel(card.r)}${card.s}</div></div><div class="pc-b"></div></div>`;
  if (o.onClick) c.onclick = o.onClick;
  return c;
}
function deckEl(){ return el('div','deckpile', '<i></i><i></i><i></i><i></i>'); }

function exchangeScreen(playerIdx, onConfirm, label){
  const p = S.players[playerIdx], sel = S.selected[playerIdx];
  const wrap = el('div','panel');
  wrap.appendChild(el('div','badge', `${pkEsc(p.name)}'s hand · ${label}`));
  wrap.appendChild(el('p','muted', 'Tap the cards you want to swap. You may keep your whole hand if you\'re happy with it.'));
  const top = el('div','dealrow'); top.appendChild(deckEl()); wrap.appendChild(top);
  const handWrap = el('div','card-hand'); wrap.appendChild(handWrap);
  const hint = el('div','checkbox-hint'), btn = el('button','btn-primary');
  const cards = [];
  const fresh = p.freshN || 0, n = p.hand.length;
  function update(){
    cards.forEach((c, i) => c.classList.toggle('selected', sel.includes(i)));
    hint.textContent = sel.length ? `${sel.length} card${sel.length===1?'':'s'} selected to swap` : 'No cards selected. You may keep everything';
    btn.textContent = sel.length ? `Swap ${sel.length} Card${sel.length===1?'':'s'}` : 'Keep My Hand';
  }
  p.hand.forEach((card, i) => {
    const isNew = i >= n - fresh;
    const c = cardEl(card, {down: isNew && !RM, deal: isNew && !RM, i: isNew ? i - (n - fresh) : 0, onClick: () => { const k = sel.indexOf(i); if (k > -1) sel.splice(k, 1); else sel.push(i); sfx(1); buzz(8); update(); }});
    cards.push(c); handWrap.appendChild(c);
    if (isNew && !RM){ const d = 220 + (i - (n - fresh)) * 130; later(() => { c.classList.remove('down'); sfx(1); }, d + 380); }
  });
  if (fresh){ sfx('shuffle'); later(() => { p.freshN = 0; }, 50); }
  wrap.appendChild(hint); wrap.appendChild(btn); update();
  btn.onclick = () => {
    btn.disabled = true;
    if (sel.length && !RM){ sel.forEach(i => cards[i] && cards[i].classList.add('toss')); sfx(3); later(onConfirm, 460); } else onConfirm();
  };
  return wrap;
}

/* ---- stakes: check, bet chips, or put a foreplay marker on the table ---- */
function stakeScreen(){
  const ph = S.phase, a = actorOf(ph), p = S.players[a], o = S.players[1-a];
  const wrap = el('div','panel center');
  wrap.appendChild(el('div','badge', 'Stakes'));
  if (ph === 'stakeR'){
    const b = S.bet, by = S.players[b.by];
    wrap.appendChild(el('h2', '', `${pkEsc(p.name)}, ${pkEsc(by.name)} ${b.kind === 'chips' ? 'bets <span style="color:var(--flame)">' + b.amt + ' chips</span>' : 'puts a marker on the table'}`));
    if (b.kind === 'marker') wrap.appendChild(el('div','marker-card', `<div class="flames">${'🔥'.repeat(b.m.f)}</div>${pkEsc(b.m.t)}<small>If you lose the hand, you do this for ${pkEsc(by.name)}. If you win, ${pkEsc(by.name)} does it for you.</small>`));
    else wrap.appendChild(el('p','muted', `Match it to see the hands, or fold and ${pkEsc(by.name)} takes the pot.`));
    const row = el('div','btn-row');
    const call = el('button','btn-primary', b.kind === 'chips' ? `Call ${b.amt}` : 'Accept the marker');
    const fold = el('button','btn-danger', 'Fold');
    call.onclick = () => { if (b.kind === 'chips'){ const x = Math.min(b.amt, p.chips); p.chips -= x; S.pot += x; } else b.called = true; sfx(3); go('showdown-gate'); };
    fold.onclick = () => { p.chips = p.chips; by.chips += S.pot; S.potWon = {to: b.by, n: S.pot}; S.pot = 0; S.foldMsg = `${p.name} folds. ${by.name} takes the pot.`; sfx(2); go('fold'); };
    row.appendChild(call); row.appendChild(fold); wrap.appendChild(row);
    return wrap;
  }
  wrap.appendChild(el('h2', '', `${pkEsc(p.name)}, your move`));
  wrap.appendChild(el('p','muted', ph === 'stakeA' ? 'Hands stay hidden. Check, bet chips, or put a foreplay marker on the table (one marker per hand).' : `${pkEsc(o.name)} checked. Your turn to check, bet or put a marker down.`));
  if (S.markerOpts){
    wrap.appendChild(el('p','muted', 'Choose a marker. The loser of the hand performs it for the winner.'));
    S.markerOpts.forEach(m => {
      const d = el('div','option', `<span class="flames">${'🔥'.repeat(m.f)}</span> ${pkEsc(m.t)}`);
      d.onclick = () => { S.bet = {by: a, kind: 'marker', m, called: false}; S.markerOpts = null; sfx(2); go('stakeR'); };
      wrap.appendChild(d);
    });
    const back = el('button','btn-ghost','Back'); back.style.width = '100%'; back.onclick = () => { S.markerOpts = null; render(); }; wrap.appendChild(back);
    return wrap;
  }
  const amt = Math.min(10, p.chips, o.chips);
  const col = el('div'); col.style.cssText = 'display:grid;gap:10px;margin-top:8px';
  const chk = el('button','btn-ghost','Check'); chk.onclick = () => { sfx(1); if (ph === 'stakeA') go('stakeB'); else go('showdown-gate'); };
  const bet = el('button','btn-primary', amt > 0 ? `Bet ${amt} chips` : 'No chips to bet'); bet.disabled = amt <= 0;
  bet.onclick = () => { p.chips -= amt; S.pot += amt; S.bet = {by: a, kind: 'chips', amt}; sfx(3); buzz(20); go('stakeR'); };
  const mk = el('button','btn-ghost','🎟️ Put a foreplay marker down');
  mk.onclick = () => { S.markerOpts = shuffle(markerPool()).slice(0, 4); render(); };
  col.appendChild(chk); col.appendChild(bet); col.appendChild(mk); wrap.appendChild(col);
  return wrap;
}

  wrap.innerHTML = `<div class="badge">Folded</div><div class="icon">🪙</div><h2>${pkEsc(S.foldMsg)}</h2><p class="muted">No reward card this hand. Next hand is dealing.</p>`;

function showdownGate(){

function handBlock(playerIdx, evalResult, isWinner, base){
  const p = S.players[playerIdx];
  const box = el('div','panel hb'); box.style.marginBottom='10px';
  const badge = el('div','badge', pkEsc(p.name)); box.appendChild(badge);
  const handWrap = el('div','card-hand'); box.appendChild(handWrap);
  const verdict = el('div','hand-verdict', ' '); box.appendChild(verdict);
  p.hand.forEach((card, i) => {
    const c = cardEl(card, {down: !RM, deal: false});
    handWrap.appendChild(c);
    if (!RM) later(() => { c.classList.remove('down'); sfx(1); }, base + i * 260);
  });
  later(() => { verdict.textContent = evalResult.name; verdict.classList.add('show'); if (isWinner){ box.classList.add('win'); badge.textContent = p.name + ' · Winner'; buzz([30, 40, 60]); window.KA_MOTION && KA_MOTION.burst && KA_MOTION.burst({kind: 'hearts', n: 18, y: innerHeight * .35}); } else if (S.lastRoundResult.winnerIdx !== null) box.classList.add('lose'); }, base + 5 * 260 + 250);
  return box;
}
function showdownScreen(){
  const {evalA, evalB, winnerIdx} = S.lastRoundResult;
  const c = el('div');
  c.appendChild(handBlock(0, evalA, winnerIdx===0, 300));
  c.appendChild(handBlock(1, evalB, winnerIdx===1, 300 + 5*260 + 700));
  const total = 300 + 10*260 + 1500;
  const next = S.markerDue ? 'marker' : 'reward';
  const w = S.players[winnerIdx];
  const holder = el('div'); c.appendChild(holder);
  later(() => {
    holder.appendChild(el('p','muted center', S.markerDue ? `${pkEsc(S.players[S.markerDue.loser].name)} lost the marker bet and performs it first.` : `${pkEsc(w.name)} wins the hand and draws a reward card.`));
    autoNext(holder, 4, S.markerDue ? 'Continue to the marker' : `${pkEsc(w.name)} draws a reward card`, () => go(next), drive(winnerIdx));
  }, total);
  return c;
}
function tieScreen(){
  const wrap = el('div','panel center');

/* a task on screen: time to read it, then the timer starts by itself */
function performScreen(o){
  const wrap = el('div','panel center perform');
  wrap.appendChild(el('div','badge', o.badge));
  if (o.sub) wrap.appendChild(el('div','reward-desc', o.sub));
  wrap.appendChild(el('div','task-big', pkEsc(o.text)));
  const secs = window.KA_AUTO ? KA_AUTO.secsOf(o.text) : 0;
  const host = el('div'); wrap.appendChild(host);
  let finished = false;
  const done = () => { if (finished) return; finished = true; o.onDone(); };
  if (secs && window.KA_AUTO){
    const stop = KA_AUTO.ring(host, {secs, text: o.text, label: o.timerLabel, onNext: drive(o.who) ? done : null, next: 5});
    STOP.push(stop);
    later(() => { try { host.scrollIntoView({behavior: 'smooth', block: 'center'}); } catch (e) {} }, 250);
    host.appendChild(el('p','muted', 'Take a moment to read it. The timer begins by itself, so you can just be present.'));
  } else host.appendChild(el('p','muted breathe', 'No timer for this one. Take as long as you both like.'));
  const row = el('div','btn-row'); row.style.marginTop = '14px';
  const d = el('button','btn-primary', secs ? 'Done early' : 'Done'); d.onclick = done; row.appendChild(d);
  if (o.back){ const b = el('button','btn-ghost','Pick another'); b.onclick = o.back; row.appendChild(b); }
  wrap.appendChild(row);
  return wrap;
}
function markerScreen(){
  const md = S.markerDue, loser = S.players[md.loser], winner = S.players[1 - md.loser];
  return performScreen({badge: 'Marker due', sub: `${loser.name} performs this for ${winner.name}`, text: md.m.t, who: 1 - md.loser, timerLabel: 'Enjoy it', onDone: () => { S.markerDue = null; go('reward'); }});
}

function rewardScreen(){
  const r = S.currentReward;
  const drawer = S.players[r.who], other = S.players[1-r.who], meta = REWARD_META[r.type];
  if (r.picked != null){
    return performScreen({badge: `${drawer.name} won the round · ${meta.label} card`, text: r.options[r.picked], who: r.who, timerLabel: 'Together',
      back: () => { r.picked = null; render(); },
      onDone: () => { finishReward(); render(); }});
  }
  const wrap = el('div','panel');
  wrap.appendChild(el('div','badge', `${pkEsc(drawer.name)} won the round`));
  wrap.appendChild(el('div','reward-type', meta.label+' Card'));
  wrap.appendChild(el('div','reward-desc', meta.desc));
  const optWrap = el('div');
  r.options.forEach((text, i)=>{
    const o = el('div', 'option optin', pkEsc(text)); o.style.animationDelay = (i * 160) + 'ms';
    o.onclick = () => { r.picked = i; r.chosenIdx = i; sfx(2); buzz(15); render(); };
    optWrap.appendChild(o);
  });
  const wish = el('div','option optin wish', '✍️ Write your own wish'); wish.style.animationDelay = (r.options.length * 160) + 'ms';
  wish.onclick = () => {
    wish.className = 'option'; wish.onclick = null;
    wish.innerHTML = '<input type="text" id="wishin" maxlength="140" placeholder="What do you want right now?" style="margin-bottom:10px"><button class="btn-primary" id="wishgo">Use this</button>';
    wish.querySelector('#wishgo').onclick = () => { const v = wish.querySelector('#wishin').value.trim(); if (!v) return; r.options.push(v); r.picked = r.options.length - 1; render(); };
    wish.querySelector('#wishin').focus();
  };
  optWrap.appendChild(wish);
  wrap.appendChild(optWrap);
  wrap.appendChild(el('p','muted', `${pkEsc(drawer.name)} taps one option and you both follow it. Strip, nude and climax cards permanently remove clothes.`));
  if (other.bails > 0){
    const bailBtn = el('button','btn-ghost', `${pkEsc(other.name)}, bail on these (${other.bails} left)`);
    bailBtn.style.cssText = 'margin-top:10px;width:100%';
    bailBtn.onclick = ()=>{
      other.bails--;
      const remaining = REWARD_CONTENT[r.type].filter(t=> !r.options.includes(t));
      r.options = shuffle(remaining.length >= 3 ? remaining : REWARD_CONTENT[r.type]).slice(0, r.type==='climax'?4:3);
      r.chosenIdx = 0; render();
    };
    wrap.appendChild(bailBtn);
  }
  return wrap;
}
function bustScreen(){
  const wrap = el('div','panel center');
  wrap.innerHTML = `<div class="badge">Out of chips</div><div class="icon">🪙</div><h2>${pkEsc(S.bustMsg)}</h2>`;
  autoNext(wrap, 5, 'Deal the next hand', () => { nextRound(); render(); }, drive(0));
  return wrap;
}
function finalScreen(){
  const w = S.players[S.winner];
  const wrap = el('div','panel final-screen');
  wrap.innerHTML = `<div class="badge">Game Over</div><h2>${pkEsc(w.name)} wins the game! 🔥</h2>
    <p class="muted">${S.finale ? 'Time for the finale you agreed on:' : 'The Climax card is drawn. You are both free to finish however you like.'}</p>
    ${S.finale ? '<div class="task-big">' + pkEsc(S.finale) + '</div>' : ''}`;
  const restart = el('button','btn-primary','Play Again');
  restart.style.marginTop='16px';
  restart.onclick = ()=>{ initGame(S.players[0].name, S.players[1].name, S.finale); render(); };
  wrap.appendChild(restart);
  window.KA_MOTION && KA_MOTION.burst && later(() => KA_MOTION.burst({kind: 'hearts', n: 40, y: innerHeight * .4}), 300);
  return wrap;
}

render();
</script>
