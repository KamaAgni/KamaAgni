<!doctype html>
<html lang="en"><head>
<script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-custom.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060f"/>
<title>KamaAgni Plan Tonight</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-common.js"></script>
<script src="../js/ka-nudge.js"></script>
<script>

(() => {
  const {LS, esc, top, pick, heat, heatBar, HEAT} = KX;
  const app = document.getElementById('app');
  const G = {
    pb: ['kamaagni-playbook.html', '🎲 Open this game'], posl: ['kamaagni-positions.html', '📖 Open this position'],
    coupons: ['kamaagni-love-coupons.html', '🎟 Love Coupons'], wyp: ['kamaagni-would-you-prefer.html', '⚖️ Would You Prefer'], tod: ['kamaagni-truth-or-dare.html', '🎭 Truth or Dare'],
    match: ['kamaagni-desire-match.html', '💞 Desire Match'], dice: ['intimacy_dice_game_single_page.html', '🎲 Intimacy Dice'], cards: ['intimacy_cards_game_single_page.html', '🃏 Intimacy Cards'],
    ludo: ['intimacy_ludo_dice_game_single_page.html', '♟️ Intimacy Ludo'], connect: ['kamaagni-connect-foreplay.html', '🔴 Connect Foreplay'], poker: ['kamaagni-poker-quick.html', '♠️ Poker for Couples'],
    pos: ['intimacy_Position_Selector_page.html', '🔥 Position Selector'], oral: ['intimacy_Oral_Position_Selector_page.html', '🌸 Oral Selector'], tasks: ['kamaagni-task-deck.html', '🃏 Task Deck'],
    mission: ['kamaagni-spark-challenge.html', '🌱 30-Day Spark'], learn: ['kamaagni-learn.html', '💬 Conversation starters'], journal: ['kamaagni-journal.html', '📓 Journal'],
    unwind: ['kamaagni-brakes.html#unwind', '🌊 Unwind first'], talk: ['kamaagni-talk.html', '💬 Talk Kit'], rp: ['kamaagni-roleplay.html', '🎭 Roleplay Studio'], sensory: ['kamaagni-sensory-night.html', '🕯️ Sensory Night'], massage: ['kamaagni-massage.html', '💆 Massage Studio']
  };
  const MOODS = {
    romantic: {n: '🌹 Romantic', warm: ['coupons', 'wyp', 'learn'], main: ['dice', 'cards', 'pos'], extra: ['tasks', 'mission']},
    playful: {n: '😜 Playful', warm: ['tod', 'wyp', 'poker'], main: ['dice', 'ludo', 'connect'], extra: ['tasks', 'cards']},
    adventurous: {n: '🔥 Adventurous', warm: ['match', 'tod', 'wyp'], main: ['tasks', 'ludo', 'oral'], extra: ['pos', 'dice']},
    tired: {n: '😴 Tired but trying', warm: ['coupons', 'learn'], main: ['wyp', 'cards', 'dice'], extra: ['coupons']}
  };
  /* connection questions by mood (KamaAgni's own wording) */
  const ASK = {
    romantic: ['What’s a moment with me this year you’d love to live again?', 'When did you last feel really wanted by me?', 'What’s one thing about my body you never say out loud that you love?'],
    playful: ['What’s the silliest thing that has ever turned you on?', 'If tonight had a theme song, what would it be?', 'Rate my flirting from 1 to 10, and tell me how to get a 10.'],
    adventurous: ['What’s something you’ve been curious to try but haven’t said yet?', 'What’s the boldest place you’d ever want to have sex?', 'If I gave you full control tonight, what would you do first?'],
    tired: ['What would feel really good for your body right now?', 'What drained you today, and what would recharge you?', 'Would you rather be held or be touched tonight?']
  };
  let RP = [];
  fetch('../data/roleplay.json').then(r => r.json()).then(d => { RP = d; }).catch(() => {});
  /* v82: a position from the Position Library and a game from the Play Book, matched to the mood */
  let POS = [], PBG = [];
  fetch('../data/positions.json').then(r => r.json()).then(d => { POS = d; }).catch(() => {});
  fetch('../data/playbook.json').then(r => r.json()).then(d => { PBG = (window.KA_FILTER && KA_FILTER.keep ? KA_FILTER.keep(d.games) : d.games); }).catch(() => {});
  const POSMOOD = {romantic: p => /intimate|slow|eye contact|tantric/.test(p.g.join(' ')) && p.d <= 2, playful: p => /she leads|novel|visual/.test(p.g.join(' ')) && p.d <= 2, adventurous: p => p.d >= 2 && /deep|acrobatic|power|standing|novel/.test(p.g.join(' ')), tired: p => /relaxed|beginner/.test(p.g.join(' ')) && p.d === 1};
  const posPick = () => { const tr = (LS.get('ka_pos', {}) || {}).tried || {}, L = POS.filter(POSMOOD[st.mood] || (() => true)), fresh = L.filter(p => !tr[p.n]); return (fresh.length ? fresh : L).length ? pick(fresh.length ? fresh : L) : null; };
  const pbPick = () => { const dn = (LS.get('ka_playbook', {}) || {}).done || {}, ch = st.mood === 'adventurous' ? ['dare', 'fan', 'toys'] : ['house', 'food', 'pos'], L = PBG.filter(x => x.h <= heat() && ch.includes(x.c)), fresh = L.filter(x => !dn[x.n]); return (fresh.length ? fresh : L).length ? pick(fresh.length ? fresh : L) : null; };
  const rpPick = () => {
    const h = heat(), played = (LS.get('ka_rp', {}).played) || {};
    const L = RP.filter(o => (o.h || 3) <= Math.max(h, 1) || h === 3);
    const fresh = L.filter(o => !played[o.n]);
    return pick(fresh.length ? fresh : (L.length ? L : RP));
  };
  const brake = () => { const b = LS.get('ka_brakes', {}) || {}; if (b.plan && b.plan.brake) return b.plan.brake; const off = []; (b.r || []).forEach(R => Object.entries(R || {}).forEach(([k, v]) => { if (v === -1) off.push(k.split(':').slice(1).join(':')); })); return off[0] || ''; };
  const st = LS.get('ka_plan_in', {mood: 'romantic', mins: 60, when: ''});
  let plan = LS.get('ka_plan', null);
  const save = () => { LS.set('ka_plan_in', st); LS.set('ka_plan', plan); };
  const link = k => G[k][0].startsWith('kamaagni') || G[k][0].startsWith('intimacy') ? G[k][0] : G[k][0];
  function build() {
    const m = MOODS[st.mood], mins = +st.mins, steps = [];
    const br = brake();
    if (mins >= 60 || st.mood === 'tired') steps.push({t: 'Unwind', min: 5, g: 'unwind', note: br ? 'Clear tonight’s brake first: “' + br + '”. Then 90 seconds of slow breathing or a 20-second hug.' : 'Shake off the day: 90 seconds of slow breathing, then a 20-second hug.', fixed: 'kamaagni-brakes.html#unwind'});
    steps.push({t: 'Connect', min: 5, g: 'talk', note: 'Ask each other, phones away: “' + pick(ASK[st.mood] || ASK.romantic) + '”', fixed: 'kamaagni-talk.html'});
    steps.push({t: 'Warm up', min: mins <= 30 ? 5 : 10, g: pick(st.mood === 'tired' ? ['massage', 'sensory', ...m.warm] : m.warm), note: 'Slow down. The goal is to enjoy, not to finish.'});
    const o = (st.mood !== 'tired' && RP.length && (st.mood === 'adventurous' || Math.random() < .55)) ? rpPick() : null;
    if (o) steps.push({t: 'Main event: role-play', min: mins <= 30 ? 20 : mins <= 60 ? 30 : 40, g: 'rp', rp: o.n, note: o.t + (o.line ? ' · Opening line: ' + o.line : '') + (o.set ? ' · Set the scene: ' + o.set : ''), fixed: 'kamaagni-roleplay.html?n=' + o.n});
    else { const gb = (st.mood === 'playful' || st.mood === 'adventurous') && Math.random() < .5 ? pbPick() : null;
      if (gb) steps.push({t: 'Main event: ' + gb.n, min: mins <= 30 ? 20 : mins <= 60 ? 30 : 40, g: 'pb', note: gb.set + ' ' + (heat() >= 2 ? gb.sp : gb.sw), fixed: 'kamaagni-playbook.html?g=' + encodeURIComponent(gb.n)});
      else steps.push({t: 'Main event', min: mins <= 30 ? 20 : mins <= 60 ? 30 : 40, g: pick(m.main), note: 'Heat level: ' + HEAT[heat()]}); }
    const ps = mins >= 60 && heat() >= 2 ? posPick() : null;
    if (ps) steps.push({t: 'Try a position: ' + ps.n, min: 10, g: 'posl', note: ps.s + ' ' + ps.w, fixed: 'kamaagni-positions.html?p=' + encodeURIComponent(ps.n)});
    if (mins >= 90) steps.push({t: 'Turn it up', min: 20, g: pick(m.extra), note: 'Only if you both still want to.'});
    steps.push({t: 'Afterglow', min: 10, g: 'talk', note: 'Water, a blanket, cuddles. Then each say one thing you loved and one thing to try next time.', fixed: 'kamaagni-talk.html'});
    plan = {mood: st.mood, mins, heat: heat(), made: Date.now(), steps: steps.map(s => ({...s, done: false}))};
    save();
  }
  function ics() {
    const d = new Date(st.when || Date.now() + 36e5), end = new Date(d.getTime() + (+st.mins) * 60000);
    const f = x => x.toISOString().replace(/[-:]|\.\d{3}/g, '');
    const n = KX.names();
    const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//KamaAgni//EN', 'BEGIN:VEVENT', 'UID:' + Date.now() + '@kamaagni', 'DTSTAMP:' + f(new Date()), 'DTSTART:' + f(d), 'DTEND:' + f(end),
      'SUMMARY:Date night with ' + (n[1] === 'Partner 2' ? 'you' : n[1]), 'DESCRIPTION:Our private evening. ' + plan.steps.map(s => s.t).join(' > '), 'BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', 'DESCRIPTION:Tonight', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type: 'text/calendar'})); a.download = 'date-night.ics'; a.click();
  }
  async function invite() {
    if (window.KA_NUDGE && KA_NUDGE.linked()) {
      const when = st.when || '';
      return KA_NUDGE.send('plan', {t: 'I’ve planned our evening: ' + plan.steps.map(s => s.t.replace('Main event: ', '')).join(' → ') + '. ' + MOODS[plan.mood].n + ', about ' + plan.mins + ' min.', w: when, u: 'games/kamaagni-tonight.html', title: 'Plan Tonight', pid: plan.made, s: plan.steps.map(x => x.t)}).then(() => KX.toast('Plan sent to your partner 💌'), e => KX.toast(e.message));
    }
    const when = st.when ? new Date(st.when).toLocaleString([], {weekday: 'long', hour: '2-digit', minute: '2-digit'}) : 'tonight';
    const text = `I've planned something for us ${when} 🔥 ${MOODS[st.mood].n.replace(/^\S+ /, '')} mood, about ${st.mins} minutes. Phones away, just you and me.`;
    try { if (navigator.share) { await navigator.share({text}); return; } await navigator.clipboard.writeText(text); KX.toast('Invite copied — paste it to your partner'); } catch {}
  }
  /* saved evenings: keep a plan you loved and repeat it in one tap */
  let saved = LS.get('ka_plan_saved', []) || [];
  const keepSaved = () => LS.set('ka_plan_saved', saved);
  /* partner veto: when they skip a step of a plan you sent, it's marked here so you can swap it */
  let vetoChecked = 0;
  function checkVeto() {
    if (vetoChecked || !plan || !window.KA_NUDGE || !KA_NUDGE.linked()) return; vetoChecked = 1;
    KA_CLOUD.couple.list(0).then(ev => { const v = ev.filter(e => e.kind === 'veto' && !e.mine && e.body && e.body.pid === plan.made).pop();
      if (v && plan.veto == null && plan.steps[v.body.s] && !plan.vetoDone) { plan.veto = v.body.s; plan.vetoBy = v.body.n || KX.names()[1]; save(); draw(); } }).catch(() => {});
  }
  function draw() {
    const mood = MOODS[st.mood];
    app.innerHTML = top('Plan Tonight', 'A whole evening in one tap: unwind, connect, warm up, the main event and afterglow, picked from everything in KamaAgni.') + `<div id="hb"></div>
      <div class="kx-card">
        <div class="kx-sec" style="margin-top:0">Mood</div><div class="kx-tabs" id="mo">${Object.entries(MOODS).map(([k, v]) => `<button data-m="${k}" class="${k === st.mood ? 'on' : ''}">${v.n}</button>`).join('')}</div>
        <div class="kx-sec">Time we have</div><div class="kx-tabs" id="ti">${[30, 60, 90, 120].map(x => `<button data-t="${x}" class="${x === +st.mins ? 'on' : ''}">${x} min</button>`).join('')}</div>
        <button class="kx-btn" id="mk">✨ ${plan ? 'Make a new plan' : 'Plan our evening'}</button>
        ${saved.length ? `<div class="kx-sec">Our saved evenings</div><div class="kx-row" style="flex-wrap:wrap">${saved.map(x => `<span class="kx-chip" style="display:inline-flex;gap:4px;align-items:center;padding:0"><button class="kx-btn sm ghost" data-use="${x.id}" style="border:0">★ ${esc(x.name)}</button><button class="kx-btn sm ghost" data-del="${x.id}" aria-label="Delete ${esc(x.name)}" style="border:0;min-width:40px">✕</button></span>`).join('')}</div>` : ''}</div>
      ${plan ? `<div class="kx-sec">Tonight's plan · ${MOODS[plan.mood].n} · ${plan.mins} min</div>
      <div class="kx-list" id="pl">${plan.steps.map((s, i) => `<div class="kx-card ${s.done ? 'kx-item done' : ''}" style="padding:16px;display:block">
        <div class="kx-row" style="justify-content:space-between"><b style="font-family:'Cormorant Garamond',serif;font-size:21px">${i + 1}. ${esc(s.t)}</b><span class="kx-chip">${s.min} min</span></div>
        ${plan.veto === i ? `<p style="margin:4px 0 8px;color:#f4a0ae"><b>✗ ${esc(plan.vetoBy || 'Your partner')} would rather skip this one.</b> Tap ↻ Swap for something else.</p>` : ''}
        <p class="kx-muted" style="margin:4px 0 10px">${esc(s.note)}</p>
        <div class="kx-row"><a class="kx-btn sm" href="${s.fixed || G[s.g][0]}">${esc(s.rp ? '🎭 Open this story' : G[s.g][1])} →</a><button class="kx-btn ghost sm" data-tm="${s.min}">⏱ Timer</button>
        <button class="kx-btn ghost sm" data-sw="${i}">↻ Swap</button><button class="kx-btn ${s.done ? '' : 'ghost'} sm" data-d="${i}">${s.done ? '✓ Done' : 'Mark done'}</button></div></div>`).join('')}</div>
      <div class="kx-card" style="margin-top:14px"><div class="kx-sec" style="margin-top:0">Make it official</div>
        <input class="kx-input" type="datetime-local" id="when" value="${esc(st.when)}">
        <div class="kx-row"><button class="kx-btn sm gold" id="ics">📅 Add to calendar</button><button class="kx-btn sm" id="inv">💌 ${window.KA_NUDGE && KA_NUDGE.linked() ? 'Send to my partner' : 'Send invite'}</button><button class="kx-btn sm ghost" id="jr">📓 Log it after</button><button class="kx-btn sm ghost" id="svp">★ Save this evening</button></div></div>` : ''}`;
    heatBar(document.getElementById('hb'), () => { });
    document.getElementById('mo').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { st.mood = b.dataset.m; save(); draw(); } };
    document.getElementById('ti').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { st.mins = +b.dataset.t; save(); draw(); } };
    document.getElementById('mk').onclick = () => { build(); vetoChecked = 0; draw(); };
    app.querySelectorAll('[data-use]').forEach(b => b.onclick = () => { const x = saved.find(y => y.id === b.dataset.use); if (!x) return; plan = JSON.parse(JSON.stringify(x.plan)); plan.made = Date.now(); delete plan.veto; delete plan.vetoDone; plan.steps.forEach(z => z.done = false); st.mood = plan.mood; st.mins = plan.mins; save(); vetoChecked = 0; KX.toast('★ ' + x.name + ' is tonight’s plan'); draw(); });
    app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const x = saved.find(y => y.id === b.dataset.del); if (!x || !confirm('Delete “' + x.name + '”?')) return; saved = saved.filter(y => y !== x); keepSaved(); draw(); });
    if (!plan) return;
    document.getElementById('when').onchange = e => { st.when = e.target.value; save(); };
    document.getElementById('svp').onclick = () => { const n = (prompt('Name this evening', MOODS[plan.mood].n.replace(/^\S+ /, '') + ' ' + plan.mins) || '').trim().slice(0, 40); if (!n) return;
      const copy = JSON.parse(JSON.stringify(plan)); delete copy.veto; delete copy.vetoBy; delete copy.vetoDone; saved = saved.filter(y => y.name !== n); saved.unshift({id: 'e' + Date.now().toString(36), name: n, plan: copy}); saved = saved.slice(0, 12); keepSaved(); KX.toast('★ Saved. Find it at the top any time.'); draw(); };
    checkVeto();
    document.getElementById('ics').onclick = ics; document.getElementById('inv').onclick = invite;
    document.getElementById('jr').onclick = () => (window.KA_go || (u => location.href = u))('kamaagni-journal.html');
    app.querySelectorAll('[data-tm]').forEach(b => b.onclick = () => window.KA && KA.timer(+b.dataset.tm * 60, 'Plan'));
    app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { plan.steps[+b.dataset.d].done ^= 1; save(); if (plan.steps.every(x => x.done)) { window.KA_AFTER && KA_AFTER.mark('Plan Tonight'); KX.toast('💞 Whole plan done. Tomorrow you’ll get a little morning-after check-in.'); } draw(); });
    app.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { if (plan.veto === +b.dataset.sw) { delete plan.veto; plan.vetoDone = 1; } const s = plan.steps[+b.dataset.sw]; if (s.rp) { const o = rpPick(); if (o) { s.rp = o.n; s.note = o.t + (o.line ? ' · Opening line: ' + o.line : '') + (o.set ? ' · Set the scene: ' + o.set : ''); s.fixed = 'kamaagni-roleplay.html?n=' + o.n; } save(); draw(); return; } if (s.g === 'posl') { const ps = posPick(); if (ps) { s.t = 'Try a position: ' + ps.n; s.note = ps.s + ' ' + ps.w; s.fixed = 'kamaagni-positions.html?p=' + encodeURIComponent(ps.n); } save(); draw(); return; } if (s.g === 'pb') { const gb = pbPick(); if (gb) { s.t = 'Main event: ' + gb.n; s.note = gb.set + ' ' + (heat() >= 2 ? gb.sp : gb.sw); s.fixed = 'kamaagni-playbook.html?g=' + encodeURIComponent(gb.n); } save(); draw(); return; } if (s.fixed) return; const m = MOODS[plan.mood]; const pool = [...m.warm, ...m.main, ...m.extra].filter(k => k !== s.g); s.g = pick(pool); save(); draw(); });
  }
  draw();
})();

</script>
<script src="../js/ka-features.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ka-config.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
