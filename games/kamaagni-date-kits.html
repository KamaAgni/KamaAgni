// id, title, icon, heat, mins, budget, vibe, tagline, need[], mood, steps[], hotter, 
const K = [
['blinddate','The Blind Date','🕶️',1,150,'$$','Playful','Meet as strangers and flirt like it is the first time.',['Two outfits','A bar, café or hotel lobby (or your own living room as a "bar")','A made-up name each'],'Smart, slightly dressed-up. Jazz or lounge music.',['One of you leaves home first. Dress as if meeting someone new.','Pick a new name and a new job. Agree a backstory in one line.','Meet at your chosen spot. Introduce yourselves and flirt properly.','Ask each other real questions you have never asked.','Walk home together or go to the hotel. Keep the character until the door closes.'],'Whisper one thing you "noticed" about the stranger. Let the evening end wherever you both want it to.'],
['5senses','The Five Senses Night','🕯️',2,120,'$','Sensual','Slow down and give every sense a turn.',['Blindfold','Feather or soft brush','Ice cube','Warm oil or lotion','Something sweet to taste','A candle or scent you love','Slow playlist'],'Dim light, one candle, soft slow music.',['Sight: undress each other slowly by candlelight. Look, do not touch yet.','Sound: whisper three things you love about the other into their ear.','Smell: breathe in their neck, hair and wrists. Say what you notice.','Taste: blindfold your partner and feed them three small tastes.','Touch: trace feather, ice, then warm oil across their skin. Swap roles.','Finish together however you like.'],'Do each sense for exactly five minutes with a timer and no rush to the end.'],
['tantric','Tantric Slow Date','🧘',2,90,'$','Slow & connected','Breathe, gaze and touch with no destination.',['Cushions or a rug','Candle or soft light','Warm oil (optional)','Phones in another room'],'Warm light. Slow ambient music.',['Sit facing each other, knees touching. Hold eye contact for 3 minutes.','Match your breathing. Rest hands on each other\'s hearts for 3 minutes.','Take turns giving 10-minute slow touch. Receiver only breathes and notices.','Come together slowly. Keep eye contact and keep breathing.','Rest in each other\'s arms for 5 minutes before talking.'],'Try ending the evening with a full minute of silence while still holding each other.'],
['movie','Recreate a Movie Scene','🎬',1,90,'$','Playful','Act out a famous romantic or sensual scene (and laugh at the attempts).',['A favourite scene to copy','Props or costumes from your wardrobe','Phone to film (optional, delete after)'],'Make it feel like a set. Play the film soundtrack.',['Watch your chosen scene together once.','Pick roles. Decide the lines and the props.','Rehearse, then film or just perform it.','Watch the result and decide how to give it a better ending.'],'Replace the end of the scene with your own.'],

['cooking','Naked Cooking','🍳',2,100,'$$','Playful','Cook together with fewer clothes and more kisses.',['Easy recipe','Apron or no apron','Kitchen timer','Wine or juice'],'Upbeat, flirty playlist.',['Choose an easy recipe and prepare everything first.','Set a kitchen timer for every step. When it rings, take a kiss break.','Feed each other the first bites.','Eat slowly, together.','Do the dishes together and see what happens.'],'Every timer ring means a bolder kiss break than the last.'],

['lapdance','Slow Lap Dance','💃',3,40,'$','Sensual','A step-by-step tease for your favourite person.',['A chair','A scarf or tie','A song you love'],'Low lights, one slow song on repeat.',['Seat your partner. Tie nothing at first. Set the rule: look, do not touch.','Start the song and move slowly.','Use your scarf. Let it trail across their shoulders and neck.','On the second song, let them touch only where you allow.','End the dance by sitting close. They choose what comes next.'],'Hold eye contact the whole time.'],
['secretadmirer','Secret Admirer Hunt','💌',1,120,'$','Romantic','Leave notes and clues that lead to a surprise date.',['Sticky notes','Small gifts or treats','A final destination'],'Sweet, warm and slightly mysterious.',['Hide three love notes in places your partner will find across the day.','The last note gives an address and a time.','Meet there with a gift or a flower.','Spend the evening just on them.'],'Make the last note a promise written in your own words.'],
['spoil','Spoil Your Spouse','🎁',1,180,'$$','Romantic','One night entirely about what they love.',['Their favourite food','Their favourite film or music','A massage oil','A handwritten card'],'Whatever they love most.',['Before they get home, prepare their favourite meal and playlist.','Greet them at the door and take over every chore.','Give them a long massage while they choose the music.','Ask: "What else would you like tonight?" and say yes within reason.'],'Cook, serve and clean with nothing expected in return.'],
['picnic','Midnight Living-room Picnic','🧺',1,90,'$','Romantic','Blankets, candles and a feast on the floor.',['Blanket','Candles','Fruit and cheese or your favourite snacks','Wine or a mocktail'],'Fairy lights, acoustic playlist.',['Lay out the blanket and the food.','Feed each other.','Play a card game or the Closeness Questions.','End with slow dancing.'],'Add one surprise: a gift hidden under the blanket.'],
['bath','Candlelit Bath for Two','🛁',2,70,'$','Sensual','Warm water, slow talk, soft touch.',['Candles','Bath oil or bubbles','Two towels','A playlist'],'Candles only. Slow music.',['Run the bath and light the candles.','Get in with one person in front, the other behind.','Wash each other\'s shoulders and arms.','Talk or just breathe together.','Dry each other with warm towels.'],'Read aloud from a favourite poem or from the Closeness Questions.'],
['game','Game Night with Prizes','🎲',2,120,'$','Playful','Any game becomes steamy when the winner picks the prize.',['A deck of cards or a board game','A bowl of prize coupons'],'Playful, cosy.',['Write ten prizes on paper: massage, kiss, choose-the-film, a dare.','Play best of three. The winner of each round draws a prize.','Raise the stakes with each round.','The overall winner gets the grand prize of their choice.'],'Use the Love Coupons page for prizes.'],
['sexyphoto','Photo Shoot for Two','📸',2,60,'$','Playful','Capture the real you, privately.',['Phone with a timer','Soft lighting','Outfits you love'],'Soft lamps, a fun playlist.',['Choose a theme: classic, silhouette, sweater and nothing else.','Take turns being the photographer.','Review the shots together and delete any you do not both like.','Keep them private. Never share without both agreeing.'],'Turn your phone to airplane mode and delete everything at the end if you prefer.'],
['scheduled','Scheduled Sexy Time','📅',2,60,'$','Planned','Anticipation is half the fun. Put it in the diary.',['A calendar','A teasing message sent the day before'],'Whatever you pick.',['Choose a date and time together this week.','Send a teaser message each day leading up to it.','Prepare the room and yourselves in the hour before.','Keep the time sacred. No phones.'],'Send a daily message that says only one thing you want to do.'],
['picnic2','Sunset Picnic for Two','🧺',1,120,'$$','Romantic','Slow food, a blanket and golden light.',['Blanket','Picnic basket','Finger food and a drink','Speaker (low volume)','Camera or phone'],'Golden hour. Soft acoustic music.',['Pick a quiet spot with a view. Check sunset time.','Lay out the blanket. Feed each other the first bite.','Play a round of "Would You Prefer" or "Know Me" from the app.','Watch the sunset in silence for five minutes, hands held.','Pack up together and take a slow walk home.'],'Bring a small treat to give as a surprise.','picnic spots'],
['stargaze','Stargazing Date','🌌',1,90,'$','Romantic','Lie back and talk about the big things.',['Blanket or sleeping bag','Hot drink','A star map app','Warm layers'],'Dark spot, no screens except the map.',['Drive somewhere dark. Wrap up warm.','Lie together and find three constellations.','Share a dream or a wish with each other.','Finish with slow kisses and shared warmth.'],'Take turns whispering a fantasy for the stars to keep.','stargazing spots'],
['dessert','Dessert Date Crawl','🍰',1,120,'$$','Playful','Three dessert spots, one sweet night.',['Three places to try','A scoring card','Cash or card'],'Casual, laughing, sugar high.',['Choose three dessert places near each other.','Order one dessert at each and share.','Score each 1 to 10 on the card.','Award a "best kiss" for the winner at the end.'],'Feed each other the final bites without hands.','dessert cafes'],
['massagebar','Couples Massage Spa Night at Home','💆',2,100,'$$','Sensual','A home spa with candles, oil and warm towels.',['Massage oil','Warm towels','Candles','Calm music','Face masks (optional)'],'Warm, quiet, soft light.',['Run a warm bath or shower together. Dry off slowly.','Face masks on, sit and chat.','Take turns giving a 15-minute massage. Receiver gives feedback.','Finish with a long hug.'],'Let the massage go wherever you both choose.','spa and massage'],
['karaoke','Karaoke Duet Night','🎤',1,90,'$$','Playful','Sing love songs badly, together.',['Karaoke app or venue','Song list','Water'],'Silly, brave, loud.',['Pick three love songs each.','Sing one duet, eyes locked.','Vote on the most embarrassing performance.','Slow dance to the last song.'],'Pick a song that means something to you both and sing it slowly.','karaoke bars'],
['photoshoot','Boudoir Photo Night (private)','📸',2,90,'$','Sensual','A private shoot that only you two keep.',['Phone or camera with a timer','Lamp or fairy lights','Outfits you feel great in','Safe storage plan (delete or lock)'],'Soft light, music, plenty of compliments.',['Agree: photos stay private and you delete or lock them after.','Set the lighting and music.','Take turns photographing each other. Compliment out loud.','Review the photos together and keep only the ones you both love.'],'Add a prop: a scarf, a shirt or a mirror.','photography studio'],
['cinemafort','Blanket Fort Movie Night','🏰',1,150,'$','Cosy','Build a fort and cuddle in it.',['Blankets and cushions','Fairy lights','Snacks','Film or series'],'Cosy, warm, phones off.',['Build the fort together.','Choose a film each and flip a coin.','Share snacks and cuddle.','Play "20 Questions" during the credits.'],'Choose a film with a steamy scene and see what it inspires.','cinema'],
['cooking2','Cook a Cuisine From Where We First Met','🍝',1,120,'$$','Romantic','A dinner from a place that means something.',['Recipe','Ingredients','Wine or juice','Playlist'],'Memory-lane, warm and laughing.',['Pick a cuisine linked to a memory.','Cook together, no phones.','Set the table properly.','Share your favourite memory from that time.'],'Make a second dessert that you feed each other.','specialty grocery']
];
let st = LS.get(KEY, {done: {}, tab: 'all'}); const save = () => LS.set(KEY, st);
const dollars = {'$': 'Low cost', '$$': 'Some spend'};
function home() {
  const h = KX.heat(), list = KF(K).filter(k => k[3] <= h && (st.tab === 'all' || k[6] === st.tab));
  const vibes = ['all', ...new Set(K.map(k => k[6]))];
  app.innerHTML = '<h1 class="kx-title"><span>Date Night Kits</span></h1><p class="kx-sub">Complete plans with everything you need, a mood, step-by-step and a way to make it hotter. Add any to your calendar.</p>' +
    `<div class="kd-chips">${vibes.map(v => `<button class="kx-chip-btn ${st.tab === v ? 'on' : ''}" data-v="${esc(v)}">${v === 'all' ? '✨ All' : esc(v)}</button>`).join('')}</div>` +
    `<div class="kd-rit">${list.map(k => `<button class="kd-rc" data-k="${k[0]}"><span class="kd-ri">${k[2]}</span><b>${esc(k[1])}</b><em>${Math.round(k[4] / 60 * 10) / 10 > 1 ? Math.round(k[4] / 6) / 10 + ' h' : k[4] + ' min'} · ${k[5]} · ${esc(k[6])}${st.done[k[0]] ? ' · ✓ done' : ''}</em></button>`).join('')}</div>`;
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { st.tab = b.dataset.v; save(); home(); });
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => kit(b.dataset.k));
}
function kit(id) {
  const k = K.find(x => x[0] === id), tick = st.done[id];
  app.innerHTML = '<h1 class="kx-title"><span>' + esc(k[1]) + '</span></h1><p class="kx-sub">' + esc(k[7]) + '</p>' +
    `<div class="kd-bar"><span class="kx-chip h${k[3]}">${k[2]} ${esc(k[6])}</span><span class="kx-chip">⏱ ${k[4]} min</span><span class="kx-chip">${k[5]}</span></div>` +
    `<div class="kx-card" data-nofx="1"><div class="kx-sec" style="margin-top:0">You will need</div><ul class="kd-ul">${k[8].map(x => '<li>' + esc(x) + '</li>').join('')}</ul><div class="kx-sec">Set the mood</div><p class="kx-muted">${esc(k[9])}</p>
    <div class="kx-sec">Step by step</div><ol class="kd-ol">${k[10].map(x => '<li>' + esc(x) + '</li>').join('')}</ol><div class="kx-sec">Make it hotter</div><p class="kx-muted">${esc(k[11])}</p><div class="kx-sec">Afterwards</div><p class="kx-muted">Cuddle, drink some water and say one thing you loved. A few minutes of closeness after sex or play helps you both feel safe.</p></div>` +
    `<div class="kd-pass"><button class="kx-btn gold" id="cal">📅 Add to calendar</button><button class="kx-btn ghost" id="cp">📋 Copy shopping list</button><button class="kx-btn ghost" id="mp">📍 Find a venue</button><button class="kx-btn ghost" id="pr">🖨 Print</button><button class="kx-btn ghost" id="dn">${tick ? '✓ Done' : 'Mark as done'}</button><button class="kx-btn ghost" id="bk">← All kits</button></div>`;
  document.getElementById('bk').onclick = home;
  document.getElementById('dn').onclick = () => { st.done[id] = !st.done[id]; save(); try { KA_TRACK.log('play', 'Date Kit: ' + k[1], ''); } catch (e) {} kit(id); };
  document.getElementById('cp').onclick = async () => { try { await navigator.clipboard.writeText(k[1] + ' shopping list:\n- ' + k[8].join('\n- ')); KX.toast('Copied'); } catch (e) { KX.toast('Could not copy'); } };
  document.getElementById('mp').onclick = () => { const q = k[12] || (k[6] === 'Sensual' ? 'hotel spa' : k[6] === 'Playful' ? 'fun date night activities' : 'romantic restaurant'); window.open('https://www.google.com/maps/search/' + encodeURIComponent(q + ' near me'), '_blank', 'noopener'); };
  document.getElementById('pr').onclick = () => { const w = window.open('', '_blank'); if (!w) { KX.toast('Allow pop-ups to print'); return; } w.document.write('<title>' + esc(k[1]) + '</title><style>body{font-family:Georgia,serif;margin:24px;max-width:640px}li{margin:6px 0}</style><h1>' + esc(k[1]) + '</h1><p>' + esc(k[7]) + '</p><h3>You will need</h3><ul>' + k[8].map(x => '<li>' + esc(x) + '</li>').join('') + '</ul><h3>Steps</h3><ol>' + k[10].map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>'); w.document.close(); setTimeout(() => w.print(), 300); };
  document.getElementById('cal').onclick = () => {
    U.guide('Add to calendar', '<div class="kd-form"><label>Date<input type="date" id="cd"></label><label>Time<input type="time" id="ct" value="19:30"></label><button class="kx-btn gold" id="cg">Download calendar file</button></div>');
    const d0 = new Date(); d0.setDate(d0.getDate() + 3); document.getElementById('cd').value = d0.toISOString().slice(0, 10);
    document.getElementById('cg').onclick = () => {
      const dd = document.getElementById('cd').value.split('-'), tt = document.getElementById('ct').value.split(':'), s = new Date(+dd[0], +dd[1] - 1, +dd[2], +tt[0], +tt[1]), e = new Date(s.getTime() + k[4] * 60000);
      const z = x => x.getFullYear() + String(x.getMonth() + 1).padStart(2, '0') + String(x.getDate()).padStart(2, '0') + 'T' + String(x.getHours()).padStart(2, '0') + String(x.getMinutes()).padStart(2, '0') + '00';
      const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KamaAgni//EN','BEGIN:VEVENT','UID:' + Date.now() + '@kamaagni','DTSTAMP:' + z(new Date()),'DTSTART:' + z(s),'DTEND:' + z(e),'SUMMARY:Date night: ' + k[1],'DESCRIPTION:' + k[7].replace(/[,;]/g, ' '),'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Date night in an hour','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], {type: 'text/calendar'})); a.download = 'kamaagni-date-night.ics'; a.click(); KX.toast('Calendar file downloaded');
    };
  };
}
home();
