<!doctype html>
<html lang="en"><head>
  <script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-custom.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>KamaAgni Kinky Dice Sets</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-data.js"></script>
<script src="../js/ka-common.js"></script>
<script src="../js/ka-duo.js"></script>
<script src="../js/ka-ui.js"></script>
<script>
(async () => {
'use strict';
const {esc, shuffle, LS} = KX, U = KA_UI, app = document.getElementById('app'), KEY = 'ka_dice_v2';
let F;
try { F = await (await fetch('../data/dice_faces.json')).json(); } catch (e) { app.innerHTML = '<div class="kx-card">Could not load. Open this page from your hosted site.</div>'; return; }
F.sweet = ['KISS HER NECK', 'KISS HIS NECK', 'SLOW MASSAGE', 'CUDDLE', 'HOLD HANDS', 'WHISPER A COMPLIMENT', 'KISS THE LIPS', 'KISS THE SHOULDERS', 'TRACE WITH A FINGER', 'PLAY WITH HAIR', 'BACK RUB', 'FOOT RUB', 'SLOW DANCE', 'EYE CONTACT 60 SEC', 'BREATHE TOGETHER', 'FEED A TREAT', 'KISS THE HANDS', 'LOVE NOTE', 'TICKLE', 'BEAR HUG', 'KISS THE EARS', 'KISS THE FOREHEAD', 'SAY "I LOVE YOU" 3 WAYS', 'SPOON AND TALK'];
const SETS = [
  {id: 'sweet', l: 'Love dice', i: '💞', h: 1, n: 'Kisses, touch and cuddles', g: '🌸 Gentle'},
  {id: 'sex', l: 'Sex dice', i: '🎲', h: 2, n: 'Classic activity faces', g: '🔥 Spicy'},
  {id: 'xmas', l: 'Christmas dice', i: '🎄', h: 2, n: 'Festive version', g: '🔥 Spicy'},
  {id: 'bdsm', l: 'BDSM dice', i: '⛓️', h: 3, n: 'Intense. Pass anything you do not both want', g: '🌋 Wild'},
  {id: 'punish', l: 'Punishment dice', i: '🔥', h: 3, n: 'For the one who misbehaved', g: '🌋 Wild'}
];
if ((F.custom || []).length) SETS.push({id: 'custom', l: 'Our own dice', i: '✍️', h: 1, n: 'Faces you wrote', g: '✍️ Yours'});
let S = null, rolling = false, stop = null;
const D = KA_DUO.init({g: 'dice', key: KEY, get: () => S, onState: (st, first) => { const fresh = !S || st.rid !== S.rid; S = st; render(fresh && !first && st.faces && st.faces.length); }, onQuit: () => { S = null; render(); }, onLink: () => { if (!S) render(); }});
S = D.load();
const N = () => D.names(S), two = () => !!(S && S.mode === 'two'), mine = () => !two() || S.turn === D.me;
const pool = () => { const out = []; S.sets.forEach(id => { const s = SETS.find(x => x.id === id); if (s && s.h <= S.heat) (F[id] || []).forEach(f => { if (!/^\+ ?ROLL AGAIN$/.test(f)) out.push({f, s: id}); }); }); return out; };
function start(o) { S = {mode: o.mode, gid: Date.now(), seq: 0, phase: 'play', turn: 0, sets: o.cats, heat: o.heat, nd: +o.extras.nd, mix: o.extras.mix === 'on', faces: [], rid: 0, rolls: 0, names: [(LS.get('ka_couple', {}) || {}).p1 || 'Partner 1', (LS.get('ka_couple', {}) || {}).p2 || 'Partner 2']}; D.setMe(0); D.save(S); render(); }
const GUIDE = `<h3>The idea</h3><p>Roll the dice and do what the faces say, together or one after the other. A roll is a suggestion, never an order.</p>
<h3>Each roll</h3><ol><li>Tap Roll. Each die lands on a face.</li><li>Do all the faces together, or take one each.</li><li>Tap Pass for a new roll. Tap ♡ to keep a roll you loved.</li></ol>
<h3>Sets</h3><p>Pick one or more dice sets. Mixing sets gives each die a face from a random set. Sets above your heat level are hidden.</p>
<h3>Two phones</h3><p>Link in Together first. Rolls appear on both phones at the same time. Players take turns rolling.</p>`;
function setup() {
  U.setup(app, {id: 'dice', title: 'Kinky Dice Sets', sub: 'Pick your dice sets, then roll for ideas. Pass anything you do not both want.', modes: ['one', 'two'], duo: D,
    catsLabel: 'Which dice?', cats: SETS.map(s => ({id: s.id, l: s.l, i: s.i, n: s.n + ' · ' + (F[s.id] || []).length + ' faces', h: s.h, g: s.g})),
    extras: [{id: 'nd', label: 'How many dice?', def: '2', opts: [['1', '1'], ['2', '2'], ['3', '3']]}, {id: 'mix', label: 'Mix chosen sets on each roll', def: 'on', opts: [['on', 'Mix'], ['off', 'One set per roll']]}],
    startLabel: 'Open the dice', guideTitle: 'How to play with dice', guide: GUIDE, start, note: 'Pass any roll you do not both want.'});
}
function doRoll() {
  if (rolling) return; const p = pool(); if (!p.length) return KX.toast('Turn on a dice set first');
  rolling = true;
  let picks = [], base = p;
  if (!S.mix) { const one = shuffle([...new Set(p.map(x => x.s))])[0]; base = p.filter(x => x.s === one); }
  for (let i = 0; i < S.nd; i++) picks.push(base[Math.floor(Math.random() * base.length)]);
  const finish = () => { rolling = false; S.faces = picks.map(x => ({f: x.f, s: x.s})); S.rid = Date.now(); S.rolls++; S.turn = S.mode === 'two' ? 1 - S.turn : 0; try { KA_TRACK.log('play', 'Rolled dice', picks.map(x => x.f).join(' + ').slice(0, 80)); } catch (e) {} D.save(S); render(true); };
  const box = document.getElementById('fc');
  if (!window.KA_FX || !box) return finish();
  box.innerHTML = '<div id="dh3"></div>'; try { navigator.vibrate && navigator.vibrate([20, 30, 20, 30, 40]); } catch (e) {}
  KA_FX.dice(document.getElementById('dh3'), Array.from({length: S.nd}, () => KA_FX.rnd())).then(finish, finish);
}
function render(pop) {
  if (!S) return setup();
  const n = N(), act = mine(), who = two() ? `<div class="kd-turn p${S.turn}"><i></i>${esc(n[S.turn])} rolls next</div>` : '';
  const faces = S.faces || [];
  app.innerHTML = '<h1 class="kx-title"><span>Kinky Dice</span></h1>' + U.bar([['Rolls ' + S.rolls, ''], two() ? ['📱📱 Two phones', 'h1'] : ['', '']].filter(x => x[0]), {guide: true, quit: true}) +
    `<div class="kx-card" data-nofx="1" style="text-align:center">${who}<div id="fc" class="kd-faces">${faces.length ? faces.map((x, i) => `<div class="kd-face ${pop ? 'pop' : ''}" style="animation-delay:${i * .12}s"><span class="kx-chip h${(SETS.find(s => s.id === x.s) || {h: 1}).h}">${esc((SETS.find(s => s.id === x.s) || {l: ''}).l)}</span><b>${esc(x.f)}</b></div>`).join('') : '<div class="kx-big">Tap Roll</div>'}</div>
    <div class="kd-pass">${act ? '<button class="kx-btn gold" id="rl">🎲 ' + (faces.length ? 'Roll again' : 'Roll') + '</button>' : '<span class="kx-muted">Waiting for ' + esc(n[S.turn]) + ' to roll…</span>'}${faces.length ? '<button class="kx-btn ghost" id="sv">♡ Save</button>' : ''}<button class="kx-btn ghost" id="pn">🗓 Plan my night</button></div><div id="plan"></div></div>`;
  U.bindBar(app, {guide: GUIDE, guideTitle: 'How to play with dice', two: two(), quit: () => { D.quit(S); S = null; render(); }});
  const rl = document.getElementById('rl'); if (rl) rl.onclick = doRoll;
  const pn = document.getElementById('pn'); if (pn) pn.onclick = () => {
    const p = pool(); if (!p.length) return KX.toast('Turn on a dice set first');
    const steps = ['Warm-up', 'Main event', 'Finale'].map(l => { const x = p[Math.floor(Math.random() * p.length)]; return [l, x.f]; });
    document.getElementById('plan').innerHTML = '<div class="kx-card" style="margin-top:12px"><div class="kx-sec" style="margin-top:0">Tonight\'s plan</div>' + steps.map((x, i) => '<div class="kx-item"><span class="kx-it"><b>' + (i + 1) + '. ' + x[0] + '</b><br>' + esc(x[1]) + '</span></div>').join('') + '<div class="kx-row" style="margin-top:10px"><button class="kx-btn sm ghost" id="pcp">📋 Copy plan</button></div></div>';
    document.getElementById('pcp').onclick = async () => { try { await navigator.clipboard.writeText('Tonight: ' + steps.map((x, i) => (i + 1) + '. ' + x[0] + ': ' + x[1]).join(' | ')); KX.toast('Copied'); } catch (e) {} };
  };
  const sv = document.getElementById('sv'); if (sv) sv.onclick = e => { KX.fav('cards', faces.map(x => x.f).join(' + ')); e.target.textContent = '♥ Saved'; };
}
render();
})();
</script>
<script src="../js/ka-features.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ka-config.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
