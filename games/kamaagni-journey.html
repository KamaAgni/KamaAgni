<!doctype html>
<html lang="en"><head>
<script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060f"/><meta name="robots" content="noindex,nofollow"/>
<title>KamaAgni — BDSM Journey</title>
<link rel="stylesheet" href="../css/fonts.css"/><link rel="stylesheet" href="../css/premium.css"/><link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-common.js"></script><script src="../js/ka-data.js"></script>
<script>

(async () => {
  const {LS, esc, top, pick} = KX;
  const app = document.getElementById('app');
  let D;
  try { D = await (await fetch('../data/bdsm500.json')).json(); }
  catch { app.innerHTML = top('BDSM Journey', '') + '<div class="kx-card kx-center">Could not load. Open this page from your hosted site.</div>'; return; }
  const st = LS.get('ka_journey', {done: {}, reward: {}, cat: 0});
  const save = () => LS.set('ka_journey', st);
  const byCat = c => D.items.map((x, i) => ({i: (window.KA_FILTER ? KA_FILTER.origIdx(D.items, i) : i), c: x[0], t: x[1]})).filter(x => x.c === c);
  const lvlOf = c => Math.floor(c / 2);
  const cnt = c => byCat(c).filter(x => st.done[x.i]).length;
  const total = () => Object.keys(st.done).length;
  function view() {
    const c = st.cat, L = lvlOf(c), lvlDone = cnt(L * 2) + cnt(L * 2 + 1);
    app.innerHTML = top('BDSM Journey', '500 beginner tasks across 10 categories and 5 levels. Go at your own pace.') + `
      <div class="kx-card kx-center"><div class="kx-big" style="font-size:28px">${total()} / 500 done</div>
        <div class="kx-prog"><i style="width:${total() / 5}%"></i></div></div>
      <div class="kx-sec">Level ${L + 1}: ${esc(D.levels[L])} · ${lvlDone}/100</div>
      <div class="kx-card"><div class="kx-muted" style="margin-bottom:8px">Reward for completing 10 tasks in this level (you decide, together):</div>
        <input class="kx-input" id="rw" maxlength="120" placeholder="e.g. a massage, a night out, her choice of position" value="${esc(st.reward[L] || '')}"></div>
      <div class="kx-tabs" style="margin-top:14px;flex-wrap:nowrap;overflow-x:auto">${D.cats.map((n, i) => `<button data-c="${i}" class="${i === c ? 'on' : ''}" style="flex:0 0 auto">${i + 1}. ${esc(n)}<br><span class="kx-muted">${cnt(i)}/50</span></button>`).join('')}</div>
      <div class="kx-row" style="margin-bottom:12px"><button class="kx-btn" id="draw">🎲 Pick a task</button></div>
      <div class="kx-list" id="ls">${byCat(c).map(x => `<div class="kx-item ${st.done[x.i] ? 'done' : ''}"><button class="kx-check ${st.done[x.i] ? 'on' : ''}" data-i="${x.i}" aria-label="Mark done">${st.done[x.i] ? '✓' : ''}</button><span class="kx-it">${esc(x.t)}</span></div>`).join('')}</div>
      <p class="kx-note">Agree on a safe word. Stop or skip any task, any time. Aftercare after every scene.</p>`;
    document.getElementById('rw').oninput = e => { st.reward[L] = e.target.value; save(); };
    app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { st.cat = +b.dataset.c; save(); view(); });
    app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const i = b.dataset.i; if (st.done[i]) delete st.done[i]; else { st.done[i] = 1; window.KA_TRACK && KA_TRACK.log('journey', 'Journey step done', ''); } save(); const y = scrollY; view(); scrollTo(0, y); });
    document.getElementById('draw').onclick = () => {
      const left = byCat(c).filter(x => !st.done[x.i]);
      if (!left.length) return KX.toast('This category is complete 🎉');
      const t = pick(left); const mt = t.t.match(/(\d{1,2})\s*(?:minutes?|min)\b/i);
      const d = document.createElement('div'); d.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(5,6,15,.9);display:flex;align-items:center;justify-content:center;padding:20px';
      d.innerHTML = `<div class="kx-card kx-play" style="max-width:520px;width:100%"><div class="kx-turn">${esc(D.cats[c])}</div><div class="kx-big" style="font-size:23px">${esc(t.t)}</div><div class="kx-row" style="justify-content:center"><button class="kx-btn" id="dn">Done ✓</button><button class="kx-btn ghost" id="ag">Another</button>${mt ? `<button class="kx-btn gold" id="tm">⏱ ${mt[1]} min</button>` : ''}<button class="kx-btn ghost" id="cl">Close</button></div></div>`;
      document.body.appendChild(d);
      d.querySelector('#dn').onclick = () => { st.done[t.i] = 1; window.KA_TRACK && KA_TRACK.log('journey', 'Journey step done', ''); save(); d.remove(); view(); };
      d.querySelector('#ag').onclick = () => { d.remove(); document.getElementById('draw').click(); };
      d.querySelector('#cl').onclick = () => d.remove();
      const tm = d.querySelector('#tm'); if (tm) tm.onclick = () => window.KA && KA.timer(+mt[1] * 60, 'Journey');
    };
  }
  view();
})();

</script>
<script src="../js/ka-config.js"></script><script src="../js/ka-features.js"></script><script src="../js/app-shell.js"></script><script src="../js/ka-gate.js"></script><script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
