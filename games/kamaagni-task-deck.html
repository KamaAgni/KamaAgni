<!doctype html>
<html lang="en"><head>
<script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060f"/>
<title>KamaAgni — Task Deck</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-common.js"></script>
<script>

(async () => {
  const {LS, esc, top, pick, shuffle, heat, heatBar, HEAT} = KX;
  const app = document.getElementById('app');
  let packs = [];
  const loaded = {};
  try {
    packs = await (await fetch('../data/tasks.json')).json();
    const idx = await (await fetch('../data/packs/index.json')).json();
    idx.forEach(x => packs.push({id: x.id, label: x.l, desc: x.d, heat: x.h, group: x.g, count: x.n, lazy: true, items: []}));
  } catch { app.innerHTML = top('Task Deck', '') + '<div class="kx-card kx-center">Could not load tasks. Open this page from your hosted site.</div>'; return; }
  let st = LS.get('ka_tasks', {sel: ['lightfd', 'switch'], done: {}});
  const save = () => LS.set('ka_tasks', st);
  const [NA, NB] = KX.names();
  const fill = t => t.replace(/\{A\}/g, NA).replace(/\{B\}/g, NB).replace(/\bPlayer 1\b/g, NA).replace(/\bPlayer 2\b/g, NB);
  async function ensure(ids) {
    for (const id of ids) {
      const p = packs.find(x => x.id === id);
      if (p && p.lazy && !loaded[id]) { try { p.items = await (await fetch('../data/packs/' + id + '.json')).json(); loaded[id] = 1; } catch {} }
    }
  }
  const key = (p, i) => p + ':' + i;
  // per-task intensity: anything with intense words only appears at Wild
  const INTENSE = /urethra|sounding|chok|strangl|torture|humiliat|spit|piss|golden|gag|cane|whip|flog|clamp|needle|fist|rimjob|pegg|swallow|degrad|slap|crop\b|trampl|forc|mummif|straitjacket|breath|slave|brutal|rough|anal|ass\b.*fuck|cum (?:in|on|into)|kneel|collar|leash|cage/i;
  const ih = (p, t) => p.lazy ? (p.heat <= 2 ? (INTENSE.test(t) ? 3 : p.heat) : 3) : (INTENSE.test(t) ? 3 : Math.min(p.heat, 2));
  let query = '';
  function setup() {
    const h = heat();
    app.innerHTML = top('Task Deck', 'Pick the packs you both want, then draw. Pass or stop any time.') + `<div id="hb"></div>
      <input class="kx-input" id="q" type="search" placeholder="Search packs (e.g. bondage, public, roleplay)">
      <div class="kx-list" id="pk"></div>
      <div class="kx-row" style="margin-top:16px"><button class="kx-btn" id="go">🃏 Draw a task</button><button class="kx-btn ghost" id="all">🎲 Surprise me (all packs)</button></div>
      <p class="kx-note">Agree on a safe word before starting. Anything you don't both want, pass.</p>`;
    heatBar(document.getElementById('hb'), setup);
    const vis = packs.map(p => ({p, n: p.lazy ? (p.heat <= h || h === 3 ? p.count : 0) : p.items.filter(x => ih(p, x) <= h).length}))
      .filter(o => o.n && (!query || (o.p.label + ' ' + o.p.desc + ' ' + (o.p.group || '')).toLowerCase().includes(query)));
    let lastG = null;
    document.getElementById('pk').innerHTML = vis.map(({p, n}) => {
      const d = p.lazy ? Object.keys(st.done).filter(k => k.startsWith(p.id + ':')).length : p.items.filter((x, i) => st.done[key(p.id, (window.KA_FILTER?KA_FILTER.origIdx:(a,i)=>i)(p.items, i))] && ih(p, x) <= h).length;
      const g = p.group || 'Original packs'; const head = g !== lastG ? `<div class="kx-sec">${esc(g)}</div>` : ''; lastG = g;
      return head + `<label class="kx-item" style="cursor:pointer"><input type="checkbox" data-p="${p.id}" ${st.sel.includes(p.id) ? 'checked' : ''} style="width:20px;height:20px;accent-color:#e8637a">
        <span class="kx-it"><b>${esc(p.label)}</b> <span class="kx-chip h${p.heat}">${HEAT[p.heat]}</span><br><span class="kx-muted">${esc(p.desc)} · ${n} tasks · ${d} done</span></span></label>`; }).join('') || '<p class="kx-muted kx-center">No packs match.</p>';
    const q = document.getElementById('q'); q.value = query; q.oninput = e => { query = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; setup(); const q2 = document.getElementById('q'); q2.focus(); q2.setSelectionRange(pos, pos); };
    document.getElementById('pk').onchange = e => { const id = e.target.dataset.p; st.sel = st.sel.filter(x => x !== id); if (e.target.checked) st.sel.push(id); save(); };
    document.getElementById('all').onclick = async () => { const b = document.getElementById('all'); b.textContent = 'Shuffling…'; st.sel = packs.filter(p => (p.lazy ? p.heat <= heat() : true)).map(p => p.id); save(); await ensure(st.sel); draw(); };
    document.getElementById('go').onclick = async () => { const b = document.getElementById('go'); b.textContent = 'Shuffling…'; await ensure(st.sel); draw(); };
  }
  function pool() {
    const out = [];
    if (heat() < 3) { /* lazy packs follow their own level */ }
    packs.filter(p => st.sel.includes(p.id)).forEach(p => p.items.forEach((t, i) => { const oi = (window.KA_FILTER?KA_FILTER.origIdx:(a,i)=>i)(p.items, i); if (!st.done[key(p.id, oi)] && ih(p, t) <= heat()) out.push({p, i: oi, t}); }));
    return out;
  }
  function draw() {
    const pl = pool();
    if (!pl.length) { app.innerHTML = top('Task Deck', '') + `<div class="kx-card kx-play"><div class="kx-big">Nothing left in these packs 🎉</div><button class="kx-btn" id="b">Choose packs</button></div>`; document.getElementById('b').onclick = setup; return; }
    const c = pick(pl);
    const m = c.t.match(/(\d{1,2})\s*(?:-|to)?\s*(?:\d{1,2}\s*)?(?:min|minutes)\b/i), ms = !m && c.t.match(/(\d{2,3})\s*seconds?\b/i);
    app.innerHTML = top('Task Deck', c.p.label + ' · ' + pl.length + ' left') + `
      <div class="kx-card kx-play"><span class="kx-chip h${ih(c.p, c.t)}">${esc(c.p.label)} · ${HEAT[ih(c.p, c.t)]}</span>
        <div class="kx-big" style="font-size:clamp(19px,4.2vw,25px)">${esc(fill(c.t))}</div>
        <div class="kx-row" style="justify-content:center">
          <button class="kx-btn" id="done">Done ✓</button>
          <button class="kx-btn ghost" id="skip">Pass</button>
          <button class="kx-btn ghost" id="sv" aria-label="Save">♡</button>
          ${m ? `<button class="kx-btn gold" id="tm">⏱ ${m[1]} min timer</button>` : ms ? `<button class="kx-btn gold" id="tm">⏱ ${ms[1]}s timer</button>` : ''}</div></div>
      <div class="kx-row" style="justify-content:center;margin-top:14px"><button class="kx-btn ghost sm" id="packs">Change packs</button></div>`;
    document.getElementById('done').onclick = () => { st.done[key(c.p.id, c.i)] = 1; save(); window.KA_TRACK && KA_TRACK.log('task', 'Task done · ' + c.p.label, fill(c.t).slice(0, 110)); draw(); };
    document.getElementById('skip').onclick = draw;
    document.getElementById('sv').onclick = e => { KX.fav('cards', fill(c.t)); e.target.textContent = '♥'; };
    document.getElementById('packs').onclick = setup;
    const tm = document.getElementById('tm'); if (tm) tm.onclick = () => window.KA && KA.timer(m ? +m[1] * 60 : +ms[1], c.p.label);
  }
  setup();
})();

</script>
<script src="../js/ka-features.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ka-config.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
