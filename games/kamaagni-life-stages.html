<style>
.g-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.g-chip{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:transparent;color:inherit;font:inherit;font-size:14px;min-height:40px;cursor:pointer}
.g-chip.on{background:rgba(255,160,90,.22);border-color:#ffb066}
.g-card{border:1px solid rgba(255,255,255,.12);border-radius:14px;margin:10px 0;background:rgba(255,255,255,.03);overflow:hidden}
.g-card summary{padding:14px;cursor:pointer;font-weight:700;font-size:16px;min-height:44px;display:flex;align-items:center;gap:10px;list-style:none}
.g-card summary::-webkit-details-marker{display:none}
.g-card summary::after{content:'+';margin-left:auto;opacity:.6;font-size:20px}
.g-card[open] summary::after{content:'\2212'}
.g-body{padding:0 14px 14px;font-size:15px;line-height:1.6}
.g-body h4{margin:12px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#ffb066}
.g-body ul{margin:4px 0 4px 18px;padding:0}.g-body li{margin:4px 0}
.g-body a,.g-note a{color:#ffc861;display:inline-block;padding:8px 4px}
.g-note{border-left:3px solid #ffb066;padding:8px 12px;margin:10px 0;font-size:14px;opacity:.9}
.g-in{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:inherit;font:inherit;box-sizing:border-box}
textarea.g-in{min-height:80px}
.g-rate{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}.g-rate span.l{min-width:120px;font-size:14px}
.g-rate button{border:0;background:none;font-size:22px;padding:4px;min-width:36px;min-height:40px;cursor:pointer;color:inherit;opacity:.3}
.g-rate button.on{opacity:1}
.g-btn{min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;font:inherit;cursor:pointer}
</style></head><body>

<script>

 your intimate life."], "l": [{"n": "Rituals", "u": "kamaagni-rituals.html"}, {"n": "Massage", "u": "kamaagni-massage.html"}, {"n": "Sensory Night", "u": "kamaagni-sensory-night.html"}, {"n": "Yearly Review", "u": "kamaagni-roadmap.html"}, {"n": "Journal", "u": "kamaagni-journal.html"}], "q": ["What do we do well that we should keep?", "What would you like more of in the next year?", "What is something about us that has never changed?"]}, {"id": "parents", "e": "🍼", "t": "New parents", "w": "The baby years", "s": "Sleep is short and time is shorter. Closeness may look different for a while, and that is normal.", "h": ["Count a kiss, a hug and a real conversation as intimacy.", "Take short windows: ten-minute rituals, shower dates, nap-time touch.", "Share the night load so both of you can rest.", "Talk about healing, feelings and expectations without blame."], "l": [{"n": "Quickies", "u": "kamaagni-quickies.html"}, {"n": "Pamper", "u": "kamaagni-pamper.html"}, {"n": "Love Coupons", "u": "kamaagni-love-coupons.html"}, {"n": "Health guide", "u": "kamaagni-health.html"}, {"n": "Rituals", "u": "kamaagni-rituals.html"}], "q": ["What do you need most from me this week?", "What is one thing that would make you feel looked after?", "When did we last laugh together?"]}, {"id": "busy", "e": "⏳", "t": "Busy seasons", "w": "Work, study, caring", "s": "Stress takes energy first from the things that are not urgent, such as romance.", "h": ["Pick one small daily touch that never changes.", "Send a message in the middle of the day.", "Plan one proper evening a fortnight.", "Do not wait for free time. It will not appear."], "l": [{"n": "Spark Challenge", "u": "kamaagni-spark-challenge.html"}, {"n": "Secret Envelope", "u": "kamaagni-secret.html"}, {"n": "Quickies", "u": "kamaagni-quickies.html"}, {"n": "Tonight", "u": "kamaagni-tonight.html"}, {"n": "Love Coupons", "u": "kamaagni-love-coupons.html"}], "q": ["What is draining you most right now, and how can I help?", "What is the smallest thing I could do that would mean a lot?", "What would you like us to protect no matter how busy we are?"]}, {"id": "mid", "e": "🌿", "t": "Midlife", "w": "40s and 50s", "s": "Bodies change, confidence grows, and many couples find their best sex.", "h": ["Talk openly about hormones, energy and comfort.", "Lube, time and variety help.", "Look after fitness and sleep together.", "Explore what you now like, not what you used to like."], "l": [{"n": "Fitness", "u": "kamaagni-fit.html"}, {"n": "Kama Studio", "u": "kamaagni-kama-studio.html"}, {"n": "Massage", "u": "kamaagni-massage.html"}, {"n": "Health guide", "u": "kamaagni-health.html"}, {"n": "Fantasy Box", "u": "kamaagni-fantasy-box.html"}], "q": ["What do you like more now than you did ten years ago?", "What would make you feel sexiest?", "What fantasy would you now be brave enough to share?"]}, {"id": "later", "e": "🌅", "t": "Later life", "w": "60s and beyond", "s": "Time is a gift. Intimacy becomes more about touch, trust and tenderness.", "h": ["Go slowly and use pillows for comfort.", "Keep touching, kissing and cuddling every day.", "Ask your doctor about medicines that affect sex.", "Make new memories, not just old ones."], "l": [{"n": "Massage", "u": "kamaagni-massage.html"}, {"n": "Sensory Night", "u": "kamaagni-sensory-night.html"}, {"n": "Movie Night", "u": "kamaagni-movies.html"}, {"n": "Journal", "u": "kamaagni-journal.html"}, {"n": "Health guide", "u": "kamaagni-health.html"}], "q": ["What is your favourite memory of us?", "What would you like us to do more of?", "What touch feels best to you now?"]}, {"id": "distance", "e": "📱", "t": "Long distance", "w": "Apart for a while", "s": "Distance makes communication and anticipation the heart of the relationship.", "h": ["Set regular call times that you both protect.", "Use the shared Together features to play at the same time.", "Send small surprises by message or post.", "Count down to the next visit and plan it."], "l": [{"n": "Together", "u": "kamaagni-together.html"}, {"n": "Secret Envelope", "u": "kamaagni-secret.html"}, {"n": "Truth or Dare", "u": "kamaagni-truth-or-dare.html"}, {"n": "Would You Prefer", "u": "kamaagni-would-you-prefer.html"}, {"n": "Movie Night", "u": "kamaagni-movies.html"}], "q": ["What do you miss most about being together?", "What can we plan for our next visit?", "What is one thing we can do together online this week?"]}, {"id": "repair", "e": "🌱", "t": "After a hard time", "w": "Rebuilding", "s": "After an argument, an illness, a loss or a long gap, closeness comes back slowly.", "h": ["Start with safe touch: hand-holding, hugs, sitting close.", "Say sorry clearly and without excuses, and listen without defending.", "Do not push sex. Rebuild trust first.", "Consider a counsellor. It is a strength, not a failure."], "l": [{"n": "Journal", "u": "kamaagni-journal.html"}, {"n": "Rituals", "u": "kamaagni-rituals.html"}, {"n": "Ask & Tell", "u": "kamaagni-ask-tell.html"}, {"n": "Learn", "u": "kamaagni-learn.html"}, {"n": "Love Languages", "u": "kamaagni-love-languages.html"}], "q": ["What do you need from me right now?", "What can I do differently?", "What do you want us to hold onto from the past?"]}]; const KEY='ka_stage_v1';

 h+='<div class="g-chips">'+D.map(x=>'<button class="g-chip'+(cur===x.id?' on':'')+'" data-s="'+x.id+'">'+x.e+' '+esc(x.t)+'</button>').join('')+'</div>';

 else{h+='<div class="g-card" open><div class="g-body" style="padding-top:14px"><h2 style="margin:0 0 4px">'+x.e+' '+esc(x.t)+'</h2><div class="kx-muted" style="margin-bottom:8px">'+esc(x.w)+'</div><p>'+esc(x.s)+'</p><h4>What helps</h4><ul>'+x.h.map(y=>'<li>'+esc(y)+'</li>').join('')+'</ul><h4>Try these pages</h4><div class="g-chips">'+x.l.map(l=>'<a class="g-chip" href="'+l.u+'" style="text-decoration:none">'+esc(l.n)+' →</a>').join('')+'</div><h4>Talk about</h4><ul>'+x.q.map(y=>'<li>'+esc(y)+'</li>').join('')+'</ul></div></div>';}

 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{cur=b.dataset.s;LS.set(KEY,cur);view();});

view();
