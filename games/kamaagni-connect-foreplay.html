<style>
  :root{
    --bg:#12070a;
    --bg2:#1d0d0d;
    --ember:#ff6a2b;
    --ember-deep:#c22a12;
    --flame:#ff9c3d;
    --gold:#e6b568;
    --gold-deep:#b8863a;
    --gold-dim:#8a6a3c;
    --cream:#f6e9d8;
    --ash:#9c8378;
    --slot-empty:#26141a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;

      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(255,106,43,.20), transparent 60%),

    position:relative;
    overflow-x:hidden;
  }
  #embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .ember-particle{
    position:absolute; bottom:-10px; width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle, var(--flame), var(--ember-deep) 70%, transparent);
    opacity:.7; animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:.8;}
    100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0;}
  }
  #app{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:28px 16px 60px;}

  h1,h2,h3{font-family:'Cinzel', serif; letter-spacing:.02em; margin:0 0 6px;}
  .eyebrow{
    font-family:'Cinzel', serif; text-transform:uppercase; letter-spacing:.28em;

    font-size:34px; font-weight:900;

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));

  input[type=text]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(230,181,104,.3);

    margin-bottom:16px;

  input[type=text]:focus{outline:none; border-color:var(--ember);}

  button{
    font-family:'DM Sans',sans-serif; font-weight:700; letter-spacing:.02em;
    border:none; border-radius:12px; padding:13px 22px; font-size:15px;
    cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;

  button:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(135deg, var(--flame), var(--ember-deep));
    color:#fff8ee; box-shadow:0 6px 20px rgba(255,106,43,.35);

  .muted{color:var(--ash); font-size:13px;}

    background:rgba(230,181,104,.12); border:1px solid rgba(230,181,104,.4); color:var(--gold);
    margin-bottom:10px;

  .turn-row{display:flex; gap:14px; margin-bottom:16px;}
  .turn-col{flex:1; text-align:center; padding:10px 6px; border-radius:12px; border:1px solid transparent;}
  .turn-col.active{border-color:var(--ember); background:rgba(255,106,43,.1);}
  .turn-name{font-family:'Cinzel',serif; font-size:14px; color:var(--gold);}
  .turn-disc{width:16px; height:16px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle;}

  .board-wrap{
    background:rgba(0,0,0,.3); border-radius:16px; padding:10px;
    border:1px solid rgba(230,181,104,.25);

  .board{
    display:grid;
    grid-template-columns:repeat(7, 1fr);

  .col{display:flex; flex-direction:column-reverse; gap:6px; cursor:pointer;}
  .col:hover .slot.empty{background:rgba(255,106,43,.12);}
  .slot{
    aspect-ratio:1/1; border-radius:50%; background:var(--slot-empty);
    display:flex; align-items:center; justify-content:center; font-size:15px;
    border:1px solid rgba(230,181,104,.15); position:relative;

  .slot.p0{background:linear-gradient(135deg, var(--flame), var(--ember-deep)); box-shadow:0 3px 8px rgba(255,106,43,.4);}
  .slot.p1{background:linear-gradient(135deg, #f6e0a8, var(--gold-deep)); box-shadow:0 3px 8px rgba(230,181,104,.4);}
  .slot .icon{font-size:14px;}

  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:center;}
  .legend-item{
    font-size:11px; color:var(--ash); background:rgba(255,255,255,.04);
    border:1px solid rgba(230,181,104,.2); border-radius:8px; padding:4px 8px;
  }

  .tier-banner{
    text-align:center; font-family:'Cinzel',serif; font-size:22px; color:var(--flame);
    margin-bottom:4px;
  }
  .tier-sub{text-align:center; color:var(--ash); font-size:12px; margin-bottom:16px;}

  .challenge-list{list-style:none; margin:0 0 18px; padding:0;}
  .challenge-item{
    display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:12px;
    border:1px solid rgba(230,181,104,.25); background:rgba(0,0,0,.2); margin-bottom:10px;
  }
  .challenge-icon{font-size:20px; line-height:1;}
  .challenge-text{font-size:14px; line-height:1.4;}
  .challenge-tag{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); display:block; margin-bottom:2px;}

  .final-screen{text-align:center; padding:10px 0;}
  .final-screen h2{font-size:28px; color:var(--flame);}

  .rules-section{margin-bottom:20px;}
  .rules-section h3{font-size:16px; color:var(--gold); margin-bottom:8px;}
  .rules-section p, .rules-section li{font-size:14px; line-height:1.55; color:var(--cream);}
  .rules-section ul{margin:0; padding-left:20px;}
  .rules-section ul li{margin-bottom:4px;}
  .link-btn{
    background:none; border:none; color:var(--gold); text-decoration:underline;
    font-size:13px; padding:0; cursor:pointer; width:auto; font-weight:600;
  }
  @media(max-width:480px){  .mode-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:6px 0 10px}
  .mode-pick button{text-align:left;padding:12px;border-radius:14px;border:1px solid rgba(230,181,104,.25);background:rgba(255,255,255,.03);color:var(--cream);font:inherit;cursor:pointer}
  .mode-pick button.on{border-color:var(--ember);box-shadow:0 0 0 2px rgba(255,106,43,.3)}.mode-pick button:disabled{opacity:.5;cursor:not-allowed}
  .mode-pick b{display:block;font-size:15px}.mode-pick span{font-size:12px;color:var(--ash)}
  #cf-rules{position:fixed;inset:0;z-index:2147482500;background:rgba(18,7,10,.95);overflow:auto;padding:70px 12px 40px}
  #cf-rules .cf-rin{max-width:640px;margin:0 auto}
  .cf-ctl,.cf-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cf-chip{padding:6px 10px;border-radius:999px;border:1px solid rgba(230,181,104,.3);background:transparent;color:var(--cream);font:inherit;font-size:12px;cursor:pointer}
  .cf-chip.on{background:rgba(255,106,43,.22);border-color:var(--ember)}.cf-chip:disabled{opacity:.45;cursor:not-allowed}
  .challenge-item.passed .challenge-text{opacity:.55;text-decoration:line-through}.challenge-item.passed .cf-ctl{text-decoration:none}
  .cf-crown{margin-top:14px;padding:12px;border:1px solid rgba(230,181,104,.25);border-radius:14px}
</style>

<script src="../js/ka-duo.js"></script>
<script>
/* ---------------- Embers background ---------------- */
(function(){

  for(let i=0;i<24;i++){

    wrap.appendChild(e);

})();

/* ---------------- Content: tiers & marker types ---------------- */
const TIERS = [
  {
    key:'spark', label:'Spark', sub:'Round 1 of 3 — warming up',
    types:{
      talk:{icon:'💬', options:[
        "Tell your partner one thing you find irresistible about them.",

      ]},

      ]},

      ]},
      cuddle:{icon:'🤗', options:[
        "Pull your partner into a close hug and don't let go for a minute.",
        "Sit in your partner's lap for the next challenge.",
        "Wrap your arms around your partner from behind and hold them close."
      ]}
    }
  },
  {
    key:'blaze', label:'Blaze', sub:'Round 2 of 3 — turning up the heat',
    types:{
      kiss:{icon:'💋', options:[
        "Kiss your partner slowly for 20 seconds.",
        "Kiss your partner's neck, three times.",
        "Give your partner a kiss somewhere they don't expect."
      ]},
      massage:{icon:'🤲', options:[
        "Give your partner a one-minute shoulder massage.",
        "Massage your partner's hands, one finger at a time.",
        "Rub your partner's lower back for 60 seconds."
      ]},
      strip:{icon:'🎽', options:[
        "Remove one item of your partner's clothing, slowly.",
        "Remove one item of your own clothing, however you like.",
        "Let your partner choose one item of clothing for you to remove."
      ]},
      whisper:{icon:'🤫', options:[
        "Whisper what you want to happen once the game is over.",
        "Whisper your partner's biggest turn-on back to them.",
        "Whisper three words that describe how you're feeling right now."
      ]}
    }
  },
  {
    key:'inferno', label:'Inferno', sub:'Round 3 of 3 — the final round',
    types:{
      bare:{icon:'🔥', options:[
        "Remove another item of clothing, your choice.",
        "Let your partner remove one more item of yours.",
        "Both of you remove one item at the same time."
      ]},
      command:{icon:'👑', options:[
        "Give your partner one command they must follow for the next 30 seconds.",
        "Tell your partner exactly how you want to be touched right now.",
        "Direct your partner's hands wherever you want them."
      ]},
      worship:{icon:'💫', options:[
        "Kiss your way from your partner's neck down to their waist.",
        "Spend 30 seconds giving your partner your full attention, anywhere they choose.",
        "Tell your partner what you love most about their body right now."
      ]},
      edge:{icon:'⚡', options:[
        "Bring your partner right to the edge, then stop.",
        "Take things as far as you both want to go.",
        "Whoever's more turned on right now doesn't choose what happens next — their partner does."
      ]}
    }
  }
];

function tierOptions(a){ const F = window.KA_FILTER; if(!F) return a; const k = a.filter(t=>F.ok(t)); return k.length ? k : ['Share a long, slow kiss and tell each other what you like about it.']; }
function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ---------------- Connect-4 mechanics ---------------- */
const ROWS = 6, COLS = 7;
function emptyGrid(){
  return Array.from({length:ROWS}, ()=> Array(COLS).fill(null));
}
function lowestEmptyRow(grid, col){
  for(let r=0;r<ROWS;r++){ if(!grid[r][col]) return r; }
  return -1;
}
const DIRECTIONS = [[0,1],[1,0],[1,1],[1,-1]];
function findWinLine(grid, row, col){
  const player = grid[row][col].player;
  for(const [dr,dc] of DIRECTIONS){
    let line = [[row,col]];
    // positive direction
    let r=row+dr, c=col+dc;
    while(r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]&&grid[r][c].player===player){ line.push([r,c]); r+=dr; c+=dc; }
    // negative direction
    r=row-dr; c=col-dc;
    while(r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]&&grid[r][c].player===player){ line.unshift([r,c]); r-=dr; c-=dc; }
    if(line.length>=4){
      return line.slice(0,4);
    }
  }
  return null;
}
function boardFull(grid){
  return grid[ROWS-1].every(cell=>cell!==null);
}

/* ---------------- Game State ---------------- */
const KEY = 'ka_connect_v1';
const LSget = (k,d)=>{ try{ const v = localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } };
const LSset = (k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const myName = ()=> LSget(KEY+'_n','') || ((LSget('ka_couple',{})||{}).p1) || '';
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null;
let myIdx = LSget(KEY+'_me', 0);
const two = ()=> !!(S && S.mode==='two');
const D = KA_DUO.init({g:'cf', key:KEY, get:()=>S,
  onState:(st, first)=>{ const before = S ? actor() : -1; myIdx = D.me; S = st; if(!first && actor()===myIdx && before!==myIdx) toast('Your turn'); render(); },
  onQuit:()=>{ S = null; localStorage.removeItem(KEY); render(); },
  onLink:()=>{ if(!S) render(); }});
const linked = ()=> D.linked();
/* display name of player i */
function PN(i){
  if(!two()) return S.players[i];
  return i===myIdx ? (myName() || S.players[i]) : (D.partner || S.players[i]);
}
/* who may act now. null = host only */
function actor(){
  if(!S) return -1;
  return S.phase==='board' ? S.turn : 0;
}
function save(){ D.save(S); }
function toast(m){ if(window.KA && KA.toast) KA.toast(m); }
{ const sv = LSget(KEY,null); if(sv && sv.tiers && sv.phase && sv.phase!=='final') S = sv; }
function quitGame(){
  if(!confirm('End this game for both players?')) return;
  D.quit(S); S=null; localStorage.removeItem(KEY);
  render();
}

function initGame(nameA, nameB, mode, opt){
  opt = opt || (S && S.opt) || {heat:2, off:[], fin:true};
  const tiers = opt.heat===1 ? [0,1] : opt.heat===3 ? [1,2] : [0,1,2];
  S = {
    mode: mode||'one', gid: Date.now(), seq: 0, texts: null, opt, tiers, asg: null, rr: false, passed: [],
    phase:'board',
    tierIndex:tiers[0],
    players:[nameA, nameB],
    turn:0,
    grid:emptyGrid(),
    winLine:null,
    winner:null,     // round winner (0/1)
    finalWinner:null
  };
}

function dropDisc(col){
  const grid = S.grid;
  const row = lowestEmptyRow(grid, col);
  if(row===-1) return;
  const tier = TIERS[S.tierIndex];
  let typeKeys = Object.keys(tier.types).filter(k=>!(S.opt.off||[]).includes(k)); if(!typeKeys.length) typeKeys = Object.keys(tier.types);
  const type = randomFrom(typeKeys);
  grid[row][col] = {player:S.turn, type};

  const line = findWinLine(grid, row, col);
  if(line){
    S.winLine = line;
    S.winner = S.turn;
    S.asg = [0,1,2,3].map(()=>'l'); S.rr = false; S.passed = [];
    S.texts = line.map(([r,c])=> randomFrom(tierOptions(tier.types[grid[r][c].type].options)));
    S.phase = 'round-win';
    return;
  }
  if(boardFull(grid)){
    S.phase = 'draw';
    return;
  }
  S.turn = 1 - S.turn;
}

function playAgain(){ const a=S.players[0], b=S.players[1], m=S.mode; if(m==='two'){ myIdx=0; LSset(KEY+'_me',0); } initGame(a,b,m,S.opt); save(); render(); }
function nextRound(){
  const pos = S.tiers.indexOf(S.tierIndex);
  if(pos >= S.tiers.length-1){
    S.finalWinner = S.winner;
    S.phase = 'final';
    try{ window.KA_TRACK && KA_TRACK.log('play','Connect Foreplay','Finished all rounds'); }catch(e){}
    return;
  }
  S.tierIndex = S.tiers[pos+1];
  S.grid = emptyGrid();
  S.winLine = null;
  S.winner = null;
  S.turn = 0;
  S.phase = 'board';
}

function replayTier(){
  S.grid = emptyGrid();
  S.winLine = null;
  S.winner = null;
  S.turn = 0;
  S.phase = 'board';
}

/* ---------------- Rendering ---------------- */
const app = document.getElementById('app');
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

function render(){
  app.innerHTML='';
  app.appendChild(logo());
  if(!S){ app.appendChild(setupScreen()); return; }
  if(S.phase==='rules'){ app.appendChild(rulesScreen()); return; }

  switch(S.phase){
    case 'board': app.appendChild(boardScreen()); break;
    case 'round-win': app.appendChild(roundWinScreen()); break;
    case 'draw': app.appendChild(drawScreen()); break;
    case 'final': app.appendChild(finalScreen()); break;
  }
}

function logo(){
  const d = el('div','logo');
  d.innerHTML = `<div class="eyebrow" style="text-align:center">KamaAgni Presents</div>
    <h1>Connect Foreplay</h1>
    <div class="tag">connect four, then turn up the heat</div>`;
  return d;
}

function setupScreen(){
  const wrap = el('div','panel');
  const cp = LSget('ka_couple',{})||{};
  wrap.innerHTML = `
    <div class="eyebrow">Before you begin</div>
    <p class="muted" style="margin-bottom:14px;">Two players, one board, three rounds that get hotter as you go. Connect four discs in a row, horizontally, vertically or diagonally, to win the round and set your challenges.</p>
    <label>How do you want to play?</label>
    <div class="mode-pick" id="mode">
      <button type="button" class="on" data-m="one"><b>📱 One phone</b><span>Share this phone and take turns tapping the board.</span></button>
      <button type="button" data-m="two" ${linked()?'':'disabled'}><b>📱📱 Two phones</b><span>${linked()?'Each of you plays on your own phone, live. Your partner joins by themselves.':'Needs a linked partner. Sign in and link in Together first.'}</span></button>
    </div>
    ${linked()?'':'<p class="muted" style="font-size:12px;margin:6px 0 0"><a href="kamaagni-together.html" style="color:var(--gold)">Open Together to link</a></p>'}
    <label>Naughtiness</label>
    <div class="mode-pick" id="heat" style="grid-template-columns:repeat(3,1fr)">${[[1,'🌸 Sweet','Spark + Blaze'],[2,'🔥 Spicy','All three rounds'],[3,'🌋 Wild','Blaze + Inferno']].map(h=>`<button type="button" data-h="${h[0]}"><b>${h[1]}</b><span>${h[2]}</span></button>`).join('')}</div>
    <details style="margin:10px 0"><summary style="cursor:pointer;color:var(--gold)">Challenge types (tap to turn off)</summary>
      <div id="types" style="margin-top:8px">${TIERS.map(t=>`<div class="muted" style="margin:6px 0 2px">${t.label}</div><div class="cf-row">${Object.entries(t.types).map(([k,v])=>`<button type="button" class="cf-chip on" data-t="${k}">${v.icon} ${k}</button>`).join('')}</div>`).join('')}</div>
    </details>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input type="checkbox" id="fin" checked style="width:auto"> Self-control finale: who holds out longest?</label>
    <label id="la">Player One (goes first)</label>
    <input type="text" id="nameA" placeholder="e.g. Priya" maxlength="16" value="${esc(myName()||cp.p1||'')}">
    <div id="bwrap"><label>Player Two</label>
    <input type="text" id="nameB" placeholder="e.g. Dev" maxlength="16" value="${esc(cp.p2||'')}"></div>
    <button class="btn-primary" id="startBtn">Light the Board</button>
    <div class="center" style="margin-top:12px;">
      <button class="link-btn" id="rulesBtn">How to Play →</button>
    </div>
  `;
  let mode='one', heat = [1,2,3].includes(+LSget('ka_heat',2)) ? +LSget('ka_heat',2) : 2; const off = new Set();
  const syncHeat=()=>wrap.querySelectorAll('[data-h]').forEach(b=>b.classList.toggle('on', +b.dataset.h===heat)); syncHeat();
  wrap.querySelectorAll('[data-h]').forEach(b=> b.onclick=()=>{ heat=+b.dataset.h; LSset('ka_heat',heat); syncHeat(); });
  wrap.querySelectorAll('[data-t]').forEach(b=> b.onclick=()=>{ const k=b.dataset.t; if(off.has(k)){ off.delete(k); b.classList.add('on'); } else { off.add(k); b.classList.remove('on'); } });
  const sync=()=>{ wrap.querySelector('#bwrap').style.display = mode==='two'?'none':''; wrap.querySelector('#la').textContent = mode==='two'?'Your name (you go first, your partner joins after)':'Player One (goes first)'; };
  wrap.querySelectorAll('[data-m]').forEach(b=> b.onclick=()=>{ if(b.disabled) return; mode=b.dataset.m; wrap.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b)); sync(); });
  wrap.querySelector('#startBtn').onclick = ()=>{
    const a = wrap.querySelector('#nameA').value.trim() || 'Player One';
    const b = wrap.querySelector('#nameB').value.trim() || 'Player Two';
    if(mode==='two' && !linked()) return toast('Link with your partner in Together first');
    myIdx = 0; LSset(KEY+'_me',0); LSset(KEY+'_n', a);
    const tiers = heat===1?[0,1]:heat===3?[1,2]:[0,1,2];
    for(const ti of tiers){ if(Object.keys(TIERS[ti].types).filter(k=>!off.has(k)).length<2) return toast('Keep at least 2 challenge types on in '+TIERS[ti].label); }
    initGame(a,b,mode,{heat, off:[...off], fin: wrap.querySelector('#fin').checked}); save(); render();
  };
  wrap.querySelector('#rulesBtn').onclick = openRules;
  return wrap;
}

function openRules(){
  let g = document.getElementById('cf-rules'); if(g) g.remove();
  g = el('div'); g.id='cf-rules';
  const inner = el('div','cf-rin'); inner.appendChild(rulesScreen());
  g.appendChild(inner); document.body.appendChild(g); document.body.style.overflow='hidden';
  const close = ()=>{ g.remove(); document.body.style.overflow=''; };
  g.querySelector('.btn-primary').onclick = close; g.onclick = e=>{ if(e.target===g) close(); };
}

function rulesScreen(){
  const wrap = el('div','panel');
  wrap.appendChild(el('div','badge','How to Play'));
  wrap.appendChild(el('h2','','Connect Foreplay Rules'));

  const s1 = el('div','rules-section');
  s1.innerHTML = `<h3>The Board</h3><p>Connect Foreplay is played on a vertical grid with <strong>7 columns and 6 rows</strong> — 42 spaces in total. Discs are dropped in from the top and fall to the lowest open space in that column, just like classic Connect Four.</p>`;
  wrap.appendChild(s1);

  const s2 = el('div','rules-section');
  s2.innerHTML = `<h3>How to Play</h3>
    <ul>
      <li>Players take turns. Player One drops first.</li>
      <li>Every disc you drop is randomly branded with a challenge type for the current round — you won't know which one until it lands.</li>
      <li>Discs never move once placed.</li>
      <li>Play alternates until someone connects four, or the board fills up.</li>
    </ul>`;
  wrap.appendChild(s2);

  const s3 = el('div','rules-section');
  s3.innerHTML = `<h3>How to Win a Round</h3>
    <p>Connect <strong>four of your own discs</strong> in a consecutive line to win the round. This can be:</p>
    <ul>
      <li><strong>Horizontal</strong> — four across a row</li>
      <li><strong>Vertical</strong> — four stacked in a column</li>
      <li><strong>Diagonal</strong> — four in a slanted line, either direction</li>
    </ul>
    <p>The round ends the instant a line of four is completed. Both partners then complete the four challenges tied to the discs in that winning line — together.</p>`;
  wrap.appendChild(s3);

  const s4 = el('div','rules-section');
  s4.innerHTML = `<h3>Rounds Get Hotter</h3>
    <p>There are three rounds — <strong>Spark, Blaze, and Inferno</strong> — each with its own set of challenge types. Win the round to clear the board and move up to the next, hotter tier. Win the Inferno round and the game is over.</p>`;
  wrap.appendChild(s4);

  const s5 = el('div','rules-section');
  s5.innerHTML = `<h3>Draws</h3><p>If all 42 spaces fill up and neither player has four in a row, it's a draw — no challenges this time. Clear the board and replay the same round.</p>`;
  wrap.appendChild(s5);

  const s8 = el('div','rules-section');
  s8.innerHTML = `<h3>The winner's advantage</h3>
    <ul>
      <li>The round winner <strong>decides who does each challenge</strong>: themselves, their partner, or both.</li>
      <li>The winner can <strong>re-draw one</strong> challenge per round.</li>
      <li>The other player can <strong>pass</strong> on any challenge, always.</li>
    </ul>
    <h3>Make it yours</h3>
    <ul>
      <li><strong>Naughtiness:</strong> Sweet (Spark + Blaze), Spicy (all three rounds) or Wild (Blaze + Inferno).</li>
      <li><strong>Challenge types:</strong> turn off any type you do not want. Topic filters in Settings also apply.</li>
      <li><strong>Self-control finale:</strong> after the last round, see who held out longest.</li>
    </ul>`;
  wrap.appendChild(s8);

  const s7 = el('div','rules-section');
  s7.innerHTML = `<h3>One phone or two phones</h3>
    <ul>
      <li><strong>One phone:</strong> share the device. Tap a column on your turn, then pass it back.</li>
      <li><strong>Two phones:</strong> both sign in and link in <em>Together</em> first. Start the game from one phone and the other joins by itself. You can only tap the board on your own turn; the other phone shows who is up. The challenges show on both screens.</li>
      <li>Either of you can end the game with <strong>End game</strong>.</li>
    </ul>
    <h3>Ground rules</h3>
    <ul><li>Everything is optional. Say "pass" at any time and skip a challenge, no explanation needed.</li><li>Challenge heat follows your Settings (heat level and topic filters).</li></ul>`;
  wrap.appendChild(s7);

  const s6 = el('div','rules-section');
  s6.innerHTML = `<h3>Quick Tips</h3>
    <ul>
      <li>The center column gives you the most ways to build a line — start there.</li>
      <li>Watch the diagonals; they're the easiest wins to miss.</li>
      <li>Think about what you're setting up for your <em>partner</em> too — every win is shared.</li>
    </ul>`;
  wrap.appendChild(s6);

  const btn = el('button','btn-primary','Got it');
  wrap.appendChild(btn);
  return wrap;
}

function hostOnly(btn){
  if(two() && myIdx!==0){ const p = el('p','muted','Waiting for '+PN(0)+' to continue…'); return p; }
  return btn;
}
function turnRow(){
  const wrap = el('div','turn-row');
  [0,1].forEach((i)=>{ const name = PN(i);
    const col = el('div','turn-col'+(S.turn===i?' active':''));
    const discColor = i===0 ? 'linear-gradient(135deg, var(--flame), var(--ember-deep))' : 'linear-gradient(135deg, #f6e0a8, var(--gold-deep))';
    col.innerHTML = `<span class="turn-disc" style="background:${discColor}"></span><span class="turn-name">${name}</span>`;
    wrap.appendChild(col);
  });
  return wrap;
}

function boardScreen(){
  const frag = document.createDocumentFragment();
  const tier = TIERS[S.tierIndex];

  const panel1 = el('div','panel');
  panel1.appendChild(el('div','tier-banner', tier.label));
  panel1.appendChild(el('div','tier-sub', 'Round '+(S.tiers.indexOf(S.tierIndex)+1)+' of '+S.tiers.length+' · '+tier.sub.split('—')[1].trim()));
  panel1.appendChild(turnRow());
  const rulesLink = el('div','center', '<button class="link-btn" id="inGameRules">How to Play →</button>');
  rulesLink.querySelector('#inGameRules').onclick = openRules;
  panel1.appendChild(rulesLink);
  const mine = !two() || S.turn===myIdx;
  panel1.appendChild(el('div','center muted', (two()? '<span class="badge" style="margin:0 6px 0 0">📱📱 Two phones</span>':'') + (mine ? 'Your move: tap a column.' : 'Waiting for '+esc(PN(S.turn))+'…') + ' <button class="link-btn" id="quitBtn" style="margin-left:8px">End game</button>'));
  panel1.querySelector('#quitBtn').onclick = quitGame;
  frag.appendChild(panel1);

  const boardPanel = el('div','panel');
  const boardWrap = el('div','board-wrap');
  const board = el('div','board');
  for(let c=0;c<COLS;c++){
    const colEl = el('div','col');
    colEl.onclick = ()=>{ if(two() && S.turn!==myIdx) return toast('Wait for '+PN(S.turn)+' to play'); dropDisc(c); save(); render(); };
    for(let r=ROWS-1;r>=0;r--){
      const cell = S.grid[r][c];
      const slot = el('div','slot'+(cell?` p${cell.player}`:' empty'));
      if(cell){ slot.innerHTML = `<span class="icon">${tier.types[cell.type].icon}</span>`; }
      colEl.appendChild(slot);
    }
    board.appendChild(colEl);
  }
  boardWrap.appendChild(board);
  boardPanel.appendChild(boardWrap);

  const legend = el('div','legend');
  Object.entries(tier.types).forEach(([key, t])=>{
    legend.appendChild(el('div','legend-item', `${t.icon} ${key}`));
  });
  boardPanel.appendChild(legend);
  frag.appendChild(boardPanel);

  return frag;
}

function roundWinScreen(){
  const tier = TIERS[S.tierIndex];
  const w = S.winner, l = 1-w, wn = PN(w), ln = PN(l);
  const iAmW = !two() || myIdx===w, iAmL = !two() || myIdx===l;
  const wrap = el('div','panel');
  wrap.appendChild(el('div','badge', `${tier.label} — Round Won`));
  wrap.appendChild(el('h2', '', `${esc(wn)} connected four!`));
  wrap.appendChild(el('p','muted', `<b>Winner's advantage:</b> ${esc(wn)} decides who does each challenge and can re-draw one. ${esc(ln)} can pass on any challenge, no questions asked.`));
  const list = el('ul','challenge-list');
  S.winLine.forEach(([r,c],i)=>{
    const type = S.grid[r][c].type, meta = tier.types[type];
    const text = (S.texts && S.texts[i]) || randomFrom(tierOptions(meta.options));
    const who = S.asg[i], passed = S.passed.includes(i);
    const item = el('li','challenge-item'+(passed?' passed':''));
    item.innerHTML = `<span class="challenge-icon">${meta.icon}</span>
      <span class="challenge-text"><span class="challenge-tag">${type}</span>${esc(text)}
      <span class="cf-ctl">
        ${['w','l','b'].map(k=>`<button type="button" class="cf-chip ${who===k?'on':''}" data-r="${i}:${k}" ${(!iAmW||passed)?'disabled':''}>${k==='w'?esc(wn)+' does it':k==='l'?esc(ln)+' does it':'Both'}</button>`).join('')}
        <button type="button" class="cf-chip" data-rr="${i}" ${(!iAmW||S.rr||passed)?'disabled':''}>🔄 Re-draw${S.rr?' (used)':''}</button>
        <button type="button" class="cf-chip ${passed?'on':''}" data-pass="${i}" ${(!iAmL)?'disabled':''}>🛡 ${passed?'Passed':'Pass'}</button>
      </span></span>`;
    list.appendChild(item);
  });
  wrap.appendChild(list);
  list.querySelectorAll('[data-r]').forEach(b=> b.onclick=()=>{ const [i,k]=b.dataset.r.split(':'); S.asg[+i]=k; save(); render(); });
  list.querySelectorAll('[data-rr]').forEach(b=> b.onclick=()=>{ const i=+b.dataset.rr, [r,c]=S.winLine[i], opts=tierOptions(tier.types[S.grid[r][c].type].options).filter(t=>t!==S.texts[i]); if(opts.length) S.texts[i]=randomFrom(opts); S.rr=true; save(); render(); });
  list.querySelectorAll('[data-pass]').forEach(b=> b.onclick=()=>{ const i=+b.dataset.pass; S.passed = S.passed.includes(i) ? S.passed.filter(x=>x!==i) : S.passed.concat(i); save(); render(); });

  const isLastTier = S.tierIndex === S.tiers[S.tiers.length-1];
  const nxt = isLastTier ? 'Finish the Game' : 'Continue to '+TIERS[S.tiers[S.tiers.indexOf(S.tierIndex)+1]].label;
  const btn = el('button','btn-primary', nxt);
  btn.onclick = ()=>{ nextRound(); save(); render(); };
  wrap.appendChild(hostOnly(btn));
  return wrap;
}

function drawScreen(){
  const wrap = el('div','panel center');
  wrap.innerHTML = `<div class="badge">Board Full</div>
    <h2>No one connected four</h2>
    <p class="muted">The board filled up with no winner. Clear it and try this round again.</p>`;
  const btn = el('button','btn-primary','Replay This Round');
  btn.onclick = ()=>{ replayTier(); save(); render(); };
  wrap.appendChild(hostOnly(btn));
  return wrap;
}

function finalScreen(){
  const last = TIERS[S.tiers[S.tiers.length-1]];
  const wrap = el('div','panel final-screen');
  wrap.innerHTML = `<div class="badge">${last.label} Complete</div>
    <h2>${esc(PN(S.finalWinner))} won the final round 🔥</h2>
    <p class="muted">You've made it through ${S.tiers.map(i=>TIERS[i].label).join(', ')}. Take things wherever you both want to go from here.</p>`;
  if(S.opt.fin){
    const c = el('div','cf-crown');
    const res = S.crown;
    if(res===undefined || res===null){
      c.innerHTML = `<h3>👑 Self-control crown</h3><p class="muted">The classic finale: who held out longest? Be honest.</p>
        <div class="cf-row">${[0,1].map(i=>`<button type="button" class="cf-chip" data-g="${i}" ${two()&&myIdx!==i?'disabled':''}>${esc(PN(i))} gave in</button>`).join('')}<button type="button" class="cf-chip" data-g="b">Neither, both held out</button></div>`;
    } else {
      c.innerHTML = `<h3>👑 Self-control crown</h3><p>${res==='b' ? '🤝 Both of you held out. Shared crown!' : '👑 '+esc(PN(1-res))+' held out longest. '+esc(PN(res))+' owes them a favour.'}</p>`;
    }
    wrap.appendChild(c);
    c.querySelectorAll('[data-g]').forEach(b=> b.onclick=()=>{ S.crown = b.dataset.g==='b' ? 'b' : +b.dataset.g; save(); render(); });
  }
  const restart = el('button','btn-primary','Play Again');
  restart.style.marginTop='16px';
  restart.onclick = ()=>{ playAgain(); };
  wrap.appendChild(hostOnly(restart));
  return wrap;
}

render();
</script>
