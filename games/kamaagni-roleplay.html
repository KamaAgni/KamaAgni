<!doctype html>
<html lang="en"><head>
<script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060f"/>
<title>KamaAgni — Roleplay Studio</title>
<link rel="stylesheet" href="../css/fonts.css"/><link rel="stylesheet" href="../css/premium.css"/><link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-common.js"></script>
<script>
(async () => {
  const {LS, esc, top, pick, shuffle} = KX;
  const app = document.getElementById('app');
  let D = [], HK = [];
  try { D = await (await fetch('../data/roleplay.json')).json(); }
  catch { app.innerHTML = top('Roleplay Studio', '') + '<div class="kx-card kx-center">Could not load scenarios. Open this page from your hosted site.</div>'; return; }
  try { HK = await (await fetch('../data/roleplay_hooks.json')).json(); } catch {}
  const st = LS.get('ka_rp', {played: {}});
  const save = () => LS.set('ka_rp', st);
  const [A, B] = KX.names();

  function list() {
    app.innerHTML = top('Roleplay Studio', 'Pick a scenario, decide who plays whom, set the scene.') + `
      <div class="kx-row" style="margin-bottom:14px"><button class="kx-btn" id="rnd">🎲 Surprise us</button>${HK.length ? '<button class="kx-btn gold" id="hk">💭 Story hook</button>' : ''}</div>
      <div class="kx-list">${D.map(o => `<button class="kx-item" data-n="${o.n}" style="cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%">
        <span class="kx-it"><b>${esc(o.t)}</b><br><span class="kx-muted">${o.p.length} plot${o.p.length > 1 ? 's' : ''}${st.played[o.n] ? ' · played ' + st.played[o.n] + '×' : ''}</span></span><span>›</span></button>`).join('')}</div>`;
    document.getElementById('rnd').onclick = () => scene(pick(D));
    const hk = document.getElementById('hk'); if (hk) hk.onclick = () => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(5,6,15,.9);display:flex;align-items:center;justify-content:center;padding:20px'; const h = pick(HK); d.innerHTML = '<div class="kx-card kx-play" style="max-width:520px;width:100%"><div class="kx-turn">Story hook</div><div class="kx-big" style="font-size:22px"></div><div class="kx-row" style="justify-content:center"><button class="kx-btn" id="a">Another</button><button class="kx-btn ghost" id="c">Close</button></div></div>'; d.querySelector('.kx-big').textContent = h; document.body.appendChild(d); d.querySelector('#a').onclick = () => d.querySelector('.kx-big').textContent = pick(HK); d.querySelector('#c').onclick = () => d.remove(); };
    app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => scene(D.find(o => o.n == b.dataset.n)));
  }
  function scene(o, pi, swap) {
    pi = pi == null ? Math.floor(Math.random() * o.p.length) : pi;
    swap = swap == null ? Math.random() < .5 : swap;
    const r1 = swap ? B : A, r2 = swap ? A : B;
    app.innerHTML = top(o.t, 'Scenario #' + o.n + (o.p.length > 1 ? ' · Plot ' + (pi + 1) + ' of ' + o.p.length : '')) + `
      <div class="kx-card"><div class="kx-turn">Roles</div>
        <p style="margin:6px 0 12px"><b>${esc(r1)}</b> takes the first role in the story &nbsp;·&nbsp; <b>${esc(r2)}</b> takes the other.</p>
        ${o.tip ? `<div class="kx-turn">Props &amp; setup</div><p class="kx-muted" style="margin:6px 0 12px">${esc(o.tip)}</p>` : ''}
        <div class="kx-turn">The story</div>
        <p style="margin:6px 0 4px;line-height:1.7;font-size:15px">${esc(o.p[pi])}</p></div>
      <div class="kx-row" style="margin-top:14px;justify-content:center">
        <button class="kx-btn" id="pl">▶ We're playing</button>
        <button class="kx-btn gold" id="tm">⏱ 20 min scene</button>
        <button class="kx-btn ghost" id="sw">⇄ Swap roles</button>
        ${o.p.length > 1 ? '<button class="kx-btn ghost" id="np">Next plot</button>' : ''}
        <button class="kx-btn ghost" id="sv" aria-label="Save">♡</button>
        <button class="kx-btn ghost" id="bk">All scenarios</button></div>
      <p class="kx-note">Agree on a safe word first. Change anything you don't both want — it's your story.</p>`;
    document.getElementById('pl').onclick = () => { st.played[o.n] = (st.played[o.n] || 0) + 1; save(); KX.toast('Have fun 🔥'); };
    document.getElementById('tm').onclick = () => window.KA && KA.timer(1200, o.t);
    document.getElementById('sw').onclick = () => scene(o, pi, !swap);
    const np = document.getElementById('np'); if (np) np.onclick = () => scene(o, (pi + 1) % o.p.length, swap);
    document.getElementById('sv').onclick = e => { KX.fav('cards', o.t + ': ' + o.p[pi]); e.target.textContent = '♥'; };
    document.getElementById('bk').onclick = list;
  }
  list();
})();
</script>
<script src="../js/ka-config.js"></script><script src="../js/ka-features.js"></script><script src="../js/app-shell.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
