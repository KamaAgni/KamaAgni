<!doctype html>
<html lang="en"><head>
<script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-custom.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060f"/>
<title>KamaAgni Roleplay Studio</title>
<link rel="stylesheet" href="../css/fonts.css"/><link rel="stylesheet" href="../css/premium.css"/><link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-common.js"></script>
<style>
.rp-steps{display:flex;gap:6px;margin:4px 0 14px;overflow-x:auto}
.rp-steps button{flex:1;min-width:76px;min-height:44px;border-radius:12px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px 8px}
.rp-steps button.on{background:rgba(232,99,122,.16);border-color:rgba(232,99,122,.6);color:#fff}
.rp-steps button.done{color:#9fe3c2}
.rp-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 4px}
.rp-role{border:1px solid var(--border2);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.03)}
.rp-role small{display:block;color:var(--muted);font-size:12px}.rp-role b{font-size:16px}
.rp-line{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1.35;font-style:italic;margin:6px 0 2px}
.rp-beat{border-left:3px solid var(--rose);padding:6px 0 6px 12px;margin:10px 0}
.rp-beat.dim{opacity:.35;border-color:var(--border2)}
.rp-beat small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.rp-q{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.rp-q b{display:block;margin-bottom:2px}
.rp-lights{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.rp-lights span{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
.rp-g{background:rgba(80,200,120,.15);color:#9fe3c2}.rp-y{background:rgba(240,190,60,.15);color:#f3d27a}.rp-r{background:rgba(232,99,122,.18);color:#f4a0ae}
.rp-ck{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;margin:4px 0}
.rp-ck input{width:22px;height:22px;accent-color:var(--rose)}
.rp-filter{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rp-filter button{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.rp-filter button.on{color:#fff;border-color:rgba(232,99,122,.6);background:rgba(232,99,122,.14)}
.rp-cos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.rp-cos .col{border:1px solid var(--border2);border-radius:14px;padding:10px;background:rgba(255,255,255,.03)}
.rp-cos .col small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.rp-ci{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:14px;line-height:1.35}
.rp-ci span{font-size:30px;width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:radial-gradient(circle at 30% 30%,rgba(232,99,122,.28),rgba(255,255,255,.04))}
.rp-ch{margin:8px 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:14px;line-height:1.5}
.rp-ch b{color:#fff}
.rp-say{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}
.rp-say div{border-radius:12px;padding:8px 10px;background:rgba(232,99,122,.08);border:1px solid rgba(232,99,122,.25);font-size:14px;line-height:1.45}
.rp-say div:nth-child(2){background:rgba(243,210,122,.07);border-color:rgba(243,210,122,.25)}
.rp-say small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.rp-say p{margin:3px 0;font-style:italic}
.rp-ph{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin:8px 0}
.rp-new{display:inline-block;font-size:12px;font-weight:800;color:#f3d27a;border:1px solid rgba(243,210,122,.5);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
@media(max-width:420px){.rp-cos,.rp-say{grid-template-columns:1fr}}
.rp-ta{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:inherit;font:inherit;padding:10px;margin:4px 0 10px;box-sizing:border-box}
</style>
<script>
(async () => {
  const {LS, esc, top, pick} = KX;
  const app = document.getElementById('app');
  let D = [], HK = [];
  try { D = await (await fetch('../data/roleplay.json')).json(); }
  catch { app.innerHTML = top('Roleplay Studio', '') + '<div class="kx-card kx-center">Could not load scenarios. Open this page from your hosted site.</div>'; return; }
  try { HK = await (await fetch('../data/roleplay_hooks.json')).json(); } catch {}
  const st = LS.get('ka_rp', {played: {}});
  st.played = st.played || {}; st.notes = st.notes || {};
  const save = () => LS.set('ka_rp', st);
  const [A, B] = KX.names();
  const HEAT = {1: '🌸 Sweet', 2: '🔥 Spicy', 3: '🌋 Wild'};
  let filt = LS.get('ka_rp_f', 0);

  const photo = n => { try { return localStorage.getItem('rp_photo_' + n) || ''; } catch (e) { return ''; } };
  function savePhoto(file, n, done) {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 720, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      try { localStorage.setItem('rp_photo_' + n, c.toDataURL('image/jpeg', 0.78)); done(); } catch (e) { KX.toast('Photo too large for this device'); } };
    img.src = url;
  }
  function list() {
    const L = D.filter(o => !filt || (filt === 9 ? o.nw : (o.h || 3) === filt)).sort((a, b) => (b.nw || 0) - (a.nw || 0));
    app.innerHTML = top('Roleplay Studio', '90 stories with characters, costumes and lines to say. We walk you through it: agree, set the scene, play, then afterglow.') + `
      <div class="kx-row" style="margin-bottom:12px"><button class="kx-btn" id="rnd">🎲 Surprise us</button>${HK.length ? '<button class="kx-btn gold" id="hk">💭 Story hook</button>' : ''}</div>
      <div class="rp-filter" role="group" aria-label="Filter by heat">${[[0, 'All'], [9, '✨ New'], [1, HEAT[1]], [2, HEAT[2]], [3, HEAT[3]]].map(([h, l]) => `<button type="button" data-f="${h}" class="${filt === h ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="kx-list">${L.map(o => `<button class="kx-item" data-n="${o.n}" style="cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%">
        <span class="kx-it"><b>${esc(o.t)}</b>${o.nw ? '<span class="rp-new">NEW</span>' : ''}<br><span class="kx-muted">${o.r ? esc(o.r[0]) + ' &amp; ' + esc(o.r[1]) + ' · ' : ''}${HEAT[o.h || 3]}${o.c ? ' · ' + o.c.flat().slice(0, 3).map(x => x.i).join('') : ''}${st.played[o.n] ? ' · played ' + st.played[o.n] + '×' : ''}</span></span><span>›</span></button>`).join('')}</div>
      <p class="kx-note">Every scene is pretend, agreed in advance, and can stop at any moment. That is what makes it safe to play big.</p>`;
    document.getElementById('rnd').onclick = () => scene(pick(L.length ? L : D));
    app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filt = +b.dataset.f; LS.set('ka_rp_f', filt); list(); });
    const hk = document.getElementById('hk'); if (hk) hk.onclick = () => { const d = document.createElement('div'); d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Story hook'); d.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(5,6,15,.9);display:flex;align-items:center;justify-content:center;padding:20px'; d.innerHTML = '<div class="kx-card kx-play" style="max-width:520px;width:100%"><div class="kx-turn">Story hook</div><div class="kx-big" style="font-size:22px"></div><div class="kx-row" style="justify-content:center"><button class="kx-btn" id="a">Another</button><button class="kx-btn ghost" id="c">Close</button></div></div>'; d.querySelector('.kx-big').textContent = pick(HK); document.body.appendChild(d); d.querySelector('#a').onclick = () => d.querySelector('.kx-big').textContent = pick(HK); d.querySelector('#c').onclick = () => d.remove(); };
    app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => scene(D.find(o => o.n == b.dataset.n)));
    window.scrollTo(0, 0);
  }

  function scene(o, pi, swap, step, beat) {
    pi = pi == null ? Math.floor(Math.random() * o.p.length) : pi;
    if (swap == null) {
      /* give each partner the role that fits their gender; random when the story doesn't care */
      const G = KX.genders(), rg = (o.pg && o.pg[pi]) || ['x', 'x'];
      const fit = (g, r) => (r === 'x' || g === 'x') ? 0 : (g === r ? 1 : -1);
      const keep = fit(G[0], rg[0]) + fit(G[1], rg[1]), flip = fit(G[1], rg[0]) + fit(G[0], rg[1]);
      swap = keep === flip ? Math.random() < .5 : flip > keep;
    }
    step = step || 1; beat = beat || 0;
    /* resume: remember exactly where you are; the afterglow step (4) finishes the story */
    if (window.KA_RESUME) { if (step < 4) KA_RESUME.set({u: 'games/kamaagni-roleplay.html?n=' + o.n + '&pi=' + pi + '&sw=' + (swap ? 1 : 0) + '&s=' + step + '&b=' + beat, t: o.t, s: ['', 'Agree', 'Set the scene', 'Play · beat ' + (beat + 1), ''][step] || ''}); else { KA_RESUME.clear('games/kamaagni-roleplay.html'); window.KA_AFTER && KA_AFTER.mark('Role-play: ' + o.t); } }
    const R = o.r || ['First role', 'Second role'];
    const p1 = swap ? B : A, p2 = swap ? A : B;
    const GG = KX.genders(), gOf = k => GG[(k === 0) === !swap ? 0 : 1];
    const look = (x, k) => (x[gOf(k)] || x);
    const go = (s, b) => scene(o, pi, swap, s, b);
    const steps = ['Agree', 'Set the scene', 'Play', 'Afterglow'];
    let body = '';
    const roles = `<div class="rp-roles"><div class="rp-role"><small>${esc(p1)} plays</small><b>${esc(R[0])}</b></div><div class="rp-role"><small>${esc(p2)} plays</small><b>${esc(R[1])}</b></div></div>`;
    if (step === 1) body = `
      <div class="kx-card">${roles}
        <button class="kx-btn ghost sm" id="sw" style="margin:6px 0 4px">⇄ Swap roles</button>
        ${o.ch ? `<div class="kx-turn" style="margin-top:12px">Your characters</div>${[0, 1].map(k => `<div class="rp-ch"><b>${esc(k ? p2 : p1)} as ${esc(R[k])}</b><br>🎯 <i>Wants:</i> ${esc(o.ch[k].w)}<br>🎙️ <i>How to play it:</i> ${esc(o.ch[k].v)}</div>`).join('')}` : ''}
        <div class="kx-turn" style="margin-top:12px">Two minutes, out loud, before you start</div>
        <div class="rp-q"><b>💬 “One thing I’d love in this scene is…”</b><span class="kx-muted">Each of you says one. Be specific: a word, a touch, a moment.</span></div>
        <div class="rp-q"><b>🚫 “One thing that’s off-limits tonight is…”</b><span class="kx-muted">No reasons needed. Anything not agreed is not part of the scene.</span></div>
        <div class="rp-q"><b>🚦 Your safe words</b><div class="rp-lights"><span class="rp-g">Green = more, I love it</span><span class="rp-y">Yellow = slow down</span><span class="rp-r">Red = stop, step out of character</span></div><span class="kx-muted">If a mouth will be covered, agree a hand signal instead (three taps).</span></div>
        ${o.tip ? `<div class="kx-turn" style="margin-top:12px">Props &amp; ideas</div><p class="kx-muted" style="margin:6px 0">${esc(o.tip)}</p>` : ''}
      </div>`;
    if (step === 2) body = `
      <div class="kx-card"><div class="kx-turn">This scene</div><p style="margin:6px 0 12px;line-height:1.6">${esc(o.set || 'Dim the lights, choose a playlist and gather any props.')}</p>
        ${o.c ? `<div class="kx-turn">Costume ideas</div><div class="rp-cos">${[0, 1].map(k => `<div class="col"><small>${esc(k ? p2 : p1)} · ${esc(R[k])}</small>${(o.c[k] || []).map(x0 => { const x = look(x0, k); return `<div class="rp-ci"><span aria-hidden="true">${x.i}</span>${esc(x.t)}</div>`; }).join('')}</div>`).join('')}</div>` : ''}
        ${o.tip ? `<p class="kx-muted" style="margin:4px 0 10px">🧺 <b>Props:</b> ${esc(o.tip)}</p>` : ''}
        <div class="kx-turn">Our costume photo</div>${photo(o.n) ? `<img class="rp-ph" src="${photo(o.n)}" alt="Your costume photo for ${esc(o.t)}">` : '<p class="kx-muted" style="margin:4px 0">Dressed up? Add a photo of your look to remember it. It stays on this device only.</p>'}
        <div class="kx-row" style="margin:4px 0 12px"><label class="kx-btn ghost sm" style="cursor:pointer">📸 ${photo(o.n) ? 'Change photo' : 'Add our photo'}<input type="file" accept="image/*" id="ph" style="display:none"></label>${photo(o.n) ? '<button class="kx-btn ghost sm" id="phx">Remove photo</button>' : ''}</div>
        <div class="kx-turn">Clear the brakes (tick as you go)</div>
        ${['📵 Phones on silent, face down', '🔒 Door locked, nobody expected', '💡 Lights low: a lamp or candles', '🎵 A playlist that fits the story', '💧 Water nearby for afterwards'].map((t, i) => `<label class="rp-ck"><input type="checkbox" data-c="${i}"> <span>${t}</span></label>`).join('')}
        <p class="kx-muted" style="margin-top:10px">Stress, worry and interruptions are the biggest mood-killers. Two minutes here makes everything that follows easier.</p></div>`;
    if (step === 3) body = `
      <div class="kx-card">${roles}
        <div class="kx-turn" style="margin-top:12px">The story</div>
        <p style="margin:6px 0 10px;line-height:1.7;font-size:15px">${esc(o.p[pi])}</p>
        ${o.p.length > 1 ? '<button class="kx-btn ghost sm" id="np">Another version of this story</button>' : ''}
        ${o.line ? `<div class="kx-turn" style="margin-top:14px">${esc(p1)} opens with</div><div class="rp-line">${esc(o.line)}</div>` : ''}
        ${(o.b || []).length ? `<div class="kx-turn" style="margin-top:14px">How it builds</div>${o.b.map((t, i) => `<div class="rp-beat${i > beat ? ' dim' : ''}"><small>${['Tease', 'Build', 'Peak'][i] || 'Beat ' + (i + 1)}</small><div>${esc(t)}</div>${o.g && o.g[i] && i === beat ? `<div class="rp-say">${[['a', 0], ['b', 1]].map(([k, j]) => `<div><small>${esc(j ? p2 : p1)} could say</small>${(o.g[i][k] || []).map(l => `<p>${esc(l)}</p>`).join('')}</div>`).join('')}</div>` : ''}</div>`).join('')}
          ${beat < o.b.length - 1 ? `<div class="kx-row" style="margin-top:8px"><button class="kx-btn gold" id="nb">Next beat →</button><button class="kx-btn ghost" id="tb">⏱ 7 min for this beat</button></div><p class="kx-muted" style="margin-top:6px">Before the next beat, one of you asks “Colour?” The other answers green, yellow or red.</p>` : '<p class="kx-muted" style="margin-top:8px">Take the last beat as far as you both want. When you’re done, go to Afterglow.</p>'}` : ''}
      </div>`;
    if (step === 4) { const nt = st.notes[o.n] || {}; body = `
      <div class="kx-card"><div class="kx-turn">Step out of character</div>
        <p style="margin:6px 0 10px;line-height:1.6">Drop the roles. Use your real names. Ask: <b>“What do you need right now?”</b></p>
        <div class="rp-lights" style="margin-bottom:12px">${['💧 Water', '🫂 Long hug', '🛁 Shower together', '🍫 Snack', '🧣 Blanket', '🤫 Quiet time', '💬 Talk'].map(t => `<span class="rp-g" style="background:rgba(255,255,255,.06);color:inherit">${t}</span>`).join('')}</div>
        <div class="kx-turn">Two-line debrief</div>
        <label for="nl" class="kx-muted" style="display:block;margin-top:6px">One thing I loved</label><textarea id="nl" class="rp-ta" placeholder="The moment you…">${esc(nt.l || '')}</textarea>
        <label for="nn" class="kx-muted" style="display:block">One thing to try next time</label><textarea id="nn" class="rp-ta" placeholder="Next time, could we…">${esc(nt.n || '')}</textarea>
        <div class="kx-row"><button class="kx-btn" id="fin">💾 Save &amp; finish</button><button class="kx-btn ghost" id="sv" aria-label="Save story to Saved Moments">♡ Save story</button></div>
        <p class="kx-muted" style="margin-top:8px">Some feelings arrive a day later. A quick check-in tomorrow is part of aftercare too.</p></div>`; }

    app.innerHTML = top(o.t, HEAT[o.h || 3] + ' · Scenario #' + o.n) + `
      <div class="rp-steps" role="tablist">${steps.map((t, i) => `<button type="button" role="tab" aria-selected="${step === i + 1}" data-s="${i + 1}" class="${step === i + 1 ? 'on' : step > i + 1 ? 'done' : ''}">${step > i + 1 ? '✓ ' : (i + 1) + '. '}${t}</button>`).join('')}</div>
      ${body}
      <div class="kx-row" style="margin-top:14px;justify-content:center">
        ${step > 1 ? '<button class="kx-btn ghost" id="pv">← Back</button>' : ''}
        ${step < 4 ? `<button class="kx-btn" id="nx">${step === 1 ? 'We agree →' : step === 2 ? 'Ready, start the scene →' : 'Afterglow →'}</button>` : ''}
        ${step === 3 ? '<button class="kx-btn gold" id="tm">⏱ 20 min scene</button><button class="kx-btn ghost" id="rmt">📲 Remote</button>' : ''}
        <button class="kx-btn ghost" id="bk">All scenarios</button></div>`;
    app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => go(+b.dataset.s, 0));
    const $ = id => document.getElementById(id);
    if ($('sw')) $('sw').onclick = () => scene(o, pi, !swap, step, beat);
    if ($('np')) $('np').onclick = () => scene(o, (pi + 1) % o.p.length, null, 3, beat);
    if ($('nb')) $('nb').onclick = () => go(3, beat + 1);
    if ($('tb')) $('tb').onclick = () => window.KA && KA.timer(420, ['Tease', 'Build', 'Peak'][beat] || o.t);
    if ($('tm')) $('tm').onclick = () => window.KA && KA.timer(1200, o.t);
    if ($('rmt')) $('rmt').onclick = () => window.KA_REMOTE && KA_REMOTE.open('roleplay');
    if ($('pv')) $('pv').onclick = () => go(step - 1, 0);
    if ($('ph')) $('ph').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) savePhoto(f, o.n, () => go(2, 0)); };
    if ($('phx')) $('phx').onclick = () => { try { localStorage.removeItem('rp_photo_' + o.n); } catch (e) {} go(2, 0); };
    if ($('nx')) $('nx').onclick = () => { if (step === 2) { st.played[o.n] = (st.played[o.n] || 0) + 1; save(); try { window.KA_TRACK && KA_TRACK.award('roleplay', 20); } catch (e) {} } go(step + 1, 0); };
    if ($('sv')) $('sv').onclick = e => { KX.fav('cards', o.t + ': ' + o.p[pi]); e.target.textContent = '♥ Saved'; };
    if ($('fin')) $('fin').onclick = () => { st.notes[o.n] = {l: $('nl').value.trim(), n: $('nn').value.trim(), d: Date.now()}; save(); KX.toast('Saved. Sweet dreams 🔥'); list(); };
    $('bk').onclick = list;
    window.scrollTo(0, 0);
  }
  const qn = +new URLSearchParams(location.search).get('n'); const qo = qn && D.find(o => o.n === qn);
  if (qo) { const q = new URLSearchParams(location.search), num = k => q.has(k) ? +q.get(k) : null;
    scene(qo, num('pi') != null && qo.p && num('pi') < qo.p.length ? num('pi') : null, q.has('sw') ? q.get('sw') === '1' : null, num('s') || 1, num('b') || 0); } else list();
})();
</script>
<script src="../js/ka-config.js"></script><script src="../js/ka-features.js"></script><script src="../js/app-shell.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
