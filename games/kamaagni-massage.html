const Z = {"back": ["Back", "🌿", 1, [["Long Glide", "Warm the oil in your hands. With flat palms, glide from the base of the spine up to the shoulders and back down, slowly. Keep contact the whole time. Do this for 2 minutes."], ["Slow Circles", "Make large slow circles with your palms across the shoulder blades and lower back. Ask for more or less pressure. Continue for 2 minutes."], ["Thumb Trails", "Walk your thumbs up either side of the spine, never on the bone, and stop wherever it feels tight. Spend 2 minutes."], ["Feather Trace", "Use only your fingertips and trace long, light lines from the neck to the hips. Let the skin ripple. Do this for 90 seconds."], ["Knead and Release", "Gently knead the shoulders and sides like soft dough, then release with a long sweep. Keep this up for 2 minutes."], ["Light Hacking", "Use the sides of your relaxed hands to tap quickly over the shoulders and the fleshy part of the back, never on the spine. Keep it light and rhythmic for 60 seconds."], ["Knuckle Glide", "Make loose fists and slide the flat of your knuckles in long lines beside the spine. Use slow, steady pressure and ask how it feels. Take 2 minutes."], ["Feather and Fur", "Trace a real feather or a soft fur mitt over the back, buttocks and thighs. Change direction often so they cannot predict it. Take 2 minutes."], ["Forearm Glide", "Rest your oiled forearm flat across their back and glide it slowly from the lower back to the shoulders, using your body weight, not your muscles. Wide and warm. 2 minutes."], ["Cupping", "Cup your hands slightly and pat quickly and lightly along the big muscles beside the spine, never on the spine itself. It sounds like soft rain and wakes the skin up. 1 minute."], ["Raking", "Spread your fingers like a rake and draw your fingertips down the back, one hand after the other, light enough to give goosebumps. 2 minutes."], ["Body Slide", "Oil your own chest and slowly slide your body along theirs, from the lower back to the shoulders, keep bowl of warm water, dry them slowly in a soft towel, then oil them. A small ritual that says 'you're cared for'. 4 minutes."]]], "head": ["Head and neck", "💆", 1, [["Scalp Comb", "Run your fingers through their hair and make small circles across the scalp. Do this for 2 minutes."], ["Neck Release", "Support the head, then use your fingertips along the base of the skull and neck. Take 2 minutes."], ["Temple Circles", "Make tiny slow circles at the temples and along the brow with your thumbs. Take 90 seconds."], ["Ear and Jaw", "Massage the earlobes and soften the jaw with slow, light circles. Spend 90 seconds."], ["Hairline Hold", "Rest your fingertips along the hairline and slowly spread them outward over the forehead, then down in front of the ears. Repeat 10 times."], ["Ear Lobes", "Gently squeeze and roll the ear lobes between finger and thumb, then trace the outer edge of the ear. Surprisingly arousing. 1 minute."]]], "front": ["Front body", "💞", 2, [["Heart Glide", "Rest one hand on the chest and glide the other from the collarbones to the belly in long sweeps. Do this for 2 minutes."], ["Belly Circles", "Make slow clockwise circles on the belly with warm palms. Spend 2 minutes."], ["Hip Cradle", "Press the hips and sides softly, pausing wherever they respond. Take 2 minutes."], ["Kiss Trail", "Follow your hands with light kisses along the collarbone, ribs and belly. Spend 2 minutes."], ["Blindfold Touch", "Cover their eyes and touch with different things in turn: fingertips, a silk scarf, a feather, an ice cube, warm lips. Ask them to guess each one. Take 5 minutes."], ["Rate My Touch", "Ask them to give each stroke a score from 1 to 10 and tell you what would make it a 10. Repeat the best ones. Take 5 minutes."], ["Breast Circles", "With warm oil, circle slowly around each breast from the outside in, never pinching, coming close to the nipple without touching it at first. Ask how it feels. 3 minutes."], ["Chest Fan", "With both palms on the centre of the chest, fan your hands out towards the shoulders like opening a book, then gather them back. 2 minutes."]]], "close": ["Intimate touch", "🔥", 3, [["Teasing Edges", "Spend time on the inner thighs and hips without going straight to the centre. Let them tell you when. Take 3 minutes."], ["Slow Build", "Use slow, warm, attentive touch and ask for guidance: faster, slower, lighter. Follow their breathing for 4 minutes."], ["Anywhere You Like", "The receiver guides your hand with words or touch, and the giver follows. Take 4 minutes."], ["Read the Body", "Pay attention to breathing, small sounds and the way the hips move. When the breathing deepens, hold the stroke you are doing and slow it down. Take 3 minutes."], ["Bath Massage", "Wash each other slowly with soap and warm water, using slippery hands for long glides over the shoulders, chest and thighs. Take 10 minutes."], ["Take Turns, No Rush", "One partner is the giver and the other is the receiver for 10 minutes. The receiver only says 'more', 'less' or 'there', then you swap."], ["Massage to Climax (Her)", "With plenty of lube and slow, patient hands, stroke the outer lips and inner thighs, then circle around the clitoris, not on it at first. Follow her breathing and keep the rhythm steady once she likes something. No rush, no finish line. 8 minutes or more."], ["Massage to Climax (Him)", "With plenty of oil, alternate long strokes from base to tip with slow twisting strokes, one hand after the other. Vary speed, and slow right down when he gets close to stretch the build. 8 minutes or more."], ["Monarch and Consort", "One of you is the monarch and only gives orders: where, how hard, how slow. The other obeys exactly and asks nothing. Swap after 5 minutes."]]], "taoist": ["Taoist touch", "☯️", 2, [["Warming the Kidneys", "Rub your palms together until they are hot, then rest them on the lower back either side of the spine and hold. Repeat three times. The old Taoist texts saw this area as the store of sexual energy. 2 minutes."], ["Cinnabar Field Circles", "Lay your warm palm just below the navel and make slow, wide circles, nine one way and nine the other. Breathe slowly together while you do it. 2 minutes."], ["Bubbling Spring", "Press your thumb firmly into the hollow on the sole of the foot, about a third of the way down from the toes, and hold for a few breaths, then circle. This is a classic acupressure point for warmth and calm. 1 minute each foot."], ["The Sacrum Press", "Place one palm flat over the bony triangle at the base of the spine, the other hand on top, and lean in gently with your body weight as they breathe out. Hold, release, repeat. 2 minutes."], ["Celestial Touch", "Use only your fingertips, barely touching, to draw slow lines along the inner arms, the sides of the body and the inner thighs. The lighter you go, the more they feel. 3 minutes."], ["Inner Smile", "Both close your eyes. Breathe slowly and imagine smiling into your own heart, then your belly, then your pelvis. A simple Taoist relaxation to start or finish a session. 3 minutes."], ["Perineum Point", "With a well-oiled fingertip, press very gently on the soft point between the genitals and the anus and hold for a few breaths. Ask first, go softly, stop if it isn't nice. 1 minute."]]], "tantric": ["Tantric touch", "🪷", 2, [["Heart to Heart", "Sit facing each other. Each place your right hand on the other's heart and your left hand over theirs. Breathe together, slowly, and look into each other's eyes. 3 minutes."], ["Anointing", "Pour warm oil into your palms and, without massaging yet, slowly 'anoint' the body: a hand on the feet, knees, belly, heart, forehead. A ritual that says 'this time is for you'. 2 minutes."], ["Spine Sweep", "With them lying face down, sweep both hands in one long, slow stroke from the base of the spine to the top of the head, then lift off and start again. Imagine moving warmth upwards. 2 minutes."], ["Hovering Hands", "Hold your palms a centimetre above their skin and move }
function bindMap() {
  const box = document.getElementById('msmap'); if (!box) return;

  start: o => { build(o); }}); }
function build(o) {
  const per = +o.extras.len, order = Object.keys(Z).filter(k => o.cats.includes(k)), plan = [];
  OPEN.forEach(s => plan.push({r: -1, z: 'Opening', t: s[0], x: s[1]}));

  if (S.phase === 'end') {

  const s = S.plan[S.i], who = s.r < 0 ? 'Both of you' : NM[s.r] + ' gives, ' + NM[1 - s.r] + ' receives';
