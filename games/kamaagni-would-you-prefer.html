<!doctype html>
<html lang="en"><head>
  <script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#05060f"/>
<title>KamaAgni — Would You Prefer</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-data.js"></script>
<script src="../js/ka-common.js"></script>
<script>
(() => {
  const {esc, names, top, shuffle, LS} = KX;
  const app = document.getElementById('app');
  let deck = shuffle(KA_DATA.wyp), i = 0, turn = 0, picked = [];
  function draw() {
    if (i >= deck.length) { deck = shuffle(KA_DATA.wyp); i = 0; }
    const [a, b] = deck[i], nm = names()[turn];
    app.innerHTML = top('Would You Prefer?', 'Two options. No third choice. Whoever draws it must do the pick.') + `
      <div class="kx-card kx-play">
        <div class="kx-turn">${esc(nm)}'s turn · card ${i + 1}/${deck.length}</div>
        <button class="kx-opt" data-c="0">${esc(a)}</button>
        <div class="kx-or">OR</div>
        <button class="kx-opt" data-c="1">${esc(b)}</button>
      </div>
      <div class="kx-row" style="justify-content:center;margin-top:14px"><button class="kx-btn ghost sm" id="skip">Skip card</button></div>
      <p class="kx-note">Either of you can say "pass" at any time. No explanations needed.</p>`;
    app.querySelectorAll('[data-c]').forEach(btn => btn.onclick = () => chosen(deck[i][+btn.dataset.c]));
    document.getElementById('skip').onclick = () => { i++; draw(); };
  }
  function chosen(text) {
    const nm = names()[turn], other = names()[1 - turn];
    app.innerHTML = top('Would You Prefer?', '') + `
      <div class="kx-card kx-play">
        <div class="kx-turn">${esc(nm)} chose</div>
        <div class="kx-big">${esc(text)}</div>
        <p class="kx-muted">${esc(other)} is in charge of this one.</p>
        <div class="kx-row" style="justify-content:center"><button class="kx-btn" id="nx">Done · next card</button>
        <button class="kx-btn ghost" id="sv">♡ Save</button></div>
      </div>`;
    document.getElementById('sv').onclick = e => { KX.fav('cards', text); e.target.textContent = '♥ Saved'; };
    document.getElementById('nx').onclick = () => { i++; turn = 1 - turn; draw(); };
  }
  draw();
})();
</script>
<script src="../js/ka-features.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ka-config.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
