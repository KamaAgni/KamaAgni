<html lang="en"><head>
  <script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-custom.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#07060f"/>
<title>KamaAgni Would You Prefer</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-data.js"></script>
<script src="../js/ka-common.js"></script>
<script src="../js/ka-duo.js"></script>
<script src="../js/ka-ui.js"></script>
<script src="../js/ka-reveal.js"></script>
<script>
KA_REVEAL.run(document.getElementById('app'), {
  id: 'wyp', key: 'ka_wyp_v2', g: 'wyp', title: 'Would You Prefer', sub: 'Two options, no third choice. Each of you picks in secret, then reveal.', icon: '⚖️',
  deckUrl: '../data/deck/wyp.json', card: it => ({q: 'Which would you prefer?', opts: [it[0], it[1]]}),
  same: '💞 Same pick! You think alike.', diff: '😏 Different picks!', ask: 'Ask each other why you chose it.', scoreLabel: 'Matches',
  startLabel: 'Deal the first card', guideTitle: 'How to play Would You Prefer',
  guide: `<h3>The idea</h3><p>A card shows two options. You both choose one in secret. When you have both answered, the picks are revealed side by side. Same pick is a match. Different picks are a conversation starter.</p>
  <h3>Each card</h3><ol><li>Read the two options.</li><li>Tap the one you prefer. On one phone the screen asks you to hand over before each answer. On two phones you each answer on your own phone at the same time.</li><li>See the reveal, laugh, talk, and tap Next.</li></ol>
  <h3>Make it yours</h3><ul><li>Pick categories (romantic, funny, date nights, sensual, bold, fantasy, wild).</li><li>Cards above your heat level never appear.</li><li>Tap ♡ on any card to save it.</li></ul>
  <h3>Ground rules</h3><ul><li>No pressure and no judgement. Every answer is okay.</li><li>You are allowed to say "neither".</li></ul>`,
  note: 'Nothing here is a promise to do anything. It is just a way to learn what each of you likes.'
});
</script>
<script src="../js/ka-features.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ka-config.js"></script><script src="../js/ka-gate.js"></script>

</body></html>
