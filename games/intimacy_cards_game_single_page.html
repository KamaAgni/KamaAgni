<!doctype html>
<html lang="en"><head>
  <script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-custom.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#07060f"/>
<meta name="robots" content="noindex,nofollow"/>
<title>KamaAgni Connection Cards</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-data.js"></script>
<script src="../js/ka-common.js"></script>
<script src="../js/ka-duo.js"></script>
<script src="../js/ka-ui.js"></script>
<script>
(async () => {
'use strict';
const {esc, shuffle, LS} = KX, U = KA_UI, app = document.getElementById('app'), KEY = 'ka_conn_v2';
let DK;
try { DK = await (await fetch('../data/deck/conn.json')).json(); } catch (e) { app.innerHTML = '<div class="kx-card">Could not load the cards. Open this page from your hosted site.</div>'; return; }
const XP = {1: 12, 2: 28, 3: 48}, RAR = {1: 'Common', 2: 'Rare', 3: 'Epic'}, RANK = l => l >= 5 ? 'Soulmates' : l >= 3 ? 'Passionates' : 'Newcomers';
const COMBOS = [{n: 'Slow Burn', s: ['touch', 'gaze', 'vocal'], b: 40}, {n: 'Whisper & Touch', s: ['vocal', 'touch', 'gaze'], b: 50}, {n: 'Rising Heat', s: ['sensory', 'sensory', 'wild'], b: 60}, {n: 'Soul Connection', s: ['gaze', 'vocal', 'gaze'], b: 45}, {n: 'Full Circle', s: ['touch', 'sensory', 'wild'], b: 55}];
let S = null, pool = [], pi = 0;
const D = KA_DUO.init({g: 'conn', key: KEY, get: () => S, onState: st => { S = st; render(); }, onQuit: () => { S = null; render(); }, onLink: () => { if (!S) render(); }});
S = D.load();
const N = () => D.names(S), two = () => !!(S && S.mode === 'two'), mine = () => !two() || S.turn === D.me;
function build() { const sel = new Set(S.cats), out = []; DK.cats.forEach(c => { if (!sel.has(c.id) || c.h > S.heat) return; DK.items[c.id].forEach(it => { if (it.h <= S.heat) out.push({n: it.n, d: it.d, h: it.h, t: c.id, tl: c.l}); }); }); pool = shuffle(out); pi = 0; }
function deal() { if (!pool.length) build(); const hand = []; for (let i = 0; i < 3 && pool.length; i++) { if (pi >= pool.length) { pool = shuffle(pool); pi = 0; } const c = pool[pi++]; if (hand.some(x => x.n === c.n) && pool.length > 3) { i--; continue; } hand.push(c); } return hand; }
function start(o) { S = {mode: o.mode, gid: Date.now(), seq: 0, phase: 'pick', turn: Math.random() < .5 ? 0 : 1, cats: o.cats, heat: o.heat, goal: o.extras.goal === 'free' ? 0 : +o.extras.goal, conn: 0, total: 0, lvl: 1, hist: [], hand: [], cur: null, count: 0, swaps: [+o.extras.swap, +o.extras.swap], combos: [], names: [(LS.get('ka_couple', {}) || {}).p1 || 'Partner 1', (LS.get('ka_couple', {}) || {}).p2 || 'Partner 2']}; D.setMe(0); build(); S.hand = deal(); D.save(S); render(); }
const GUIDE = `<h3>The idea</h3><p>Take turns. On your turn you are dealt three cards. Pick the one you both fancy and do it together. Every completed card fills your <b>Connection</b> meter. Fill it to level up.</p>
<h3>Cards</h3><ul><li><b>Touch, Eyes, Words, Senses, Bold</b> are the five types.</li><li>Common cards are gentle (+12). Rare cards turn it up (+28). Epic cards are bold (+48).</li></ul>
<h3>Combos</h3><p>Play three cards in a row in the right order of types for bonus Connection. For example Touch, Eyes, Words is <b>Slow Burn</b> (+40).</p>
<h3>Levels</h3><p>Each level needs 100 Connection. Ranks go Newcomers, Passionates, Soulmates.</p>
<h3>Two phones</h3><p>Link in Together first. The player whose turn it is sees the hand and picks. The other watches live.</p>
<h3>Ground rules</h3><ul><li>Everything is optional. Swap a hand if none of the three feels right.</li><li>Agree on a safe word before you start.</li></ul>`;
function setup() {
  U.setup(app, {id: 'conn', title: 'Connection Cards', sub: 'Pick one of three cards each turn. Build your Connection and level up together.', modes: ['one', 'two'], duo: D,
    catsLabel: 'Card types', cats: DK.cats.map(c => ({id: c.id, l: c.l, i: c.i, n: c.n + ' · ' + DK.items[c.id].length + ' cards', h: c.h, g: c.h === 1 ? '🌸 Gentle' : c.h === 2 ? '🔥 Spicy' : '🌋 Wild'})),
    extras: [{id: 'goal', label: 'How long?', def: 'free', opts: [['free', 'Free play'], ['8', '8 cards'], ['16', '16 cards'], ['30', '30 cards']]}, {id: 'swap', label: 'Hand swaps each', def: '3', opts: [['1', '1'], ['3', '3'], ['99', 'Unlimited']]}],
    startLabel: 'Deal the first hand', guideTitle: 'How to play Connection Cards', guide: GUIDE, start, note: 'Both partners must agree to everything. Say "pass" at any time.'});
}
function checkCombo() { const h = S.hist.slice(-3); if (h.length < 3) return null; const c = COMBOS.find(c => c.s.every((t, i) => t === h[i])); return c || null; }
function render() {
  if (!S) return setup();
  if (!pool.length) build();
  if (S.phase === 'end') return endView();
  const n = N(), act = mine(), t = S.turn, lvlPct = Math.min(100, S.conn);
  const head = '<h1 class="kx-title"><span>Connection Cards</span></h1>' + U.bar([['Lv ' + S.lvl + ' ' + RANK(S.lvl), 'h2'], ['Card ' + (S.count + 1) + (S.goal ? '/' + S.goal : ''), ''], two() ? ['📱📱 Two phones', 'h1'] : ['', '']].filter(x => x[0]), {guide: true, quit: true}) +
    `<div class="kd-meter"><i style="width:${lvlPct}%"></i><span>${S.conn} / 100 Connection</span></div>`;
  const who = `<div class="kd-turn p${t}"><i></i>${esc(n[t])}'s turn</div>`;
  let body;
  if (S.phase === 'pick') {
    body = `<div class="kx-card" data-nofx="1" style="text-align:center">${who}<div class="kx-muted" style="margin:6px 0 12px">${act ? 'Choose one card. You do it together.' : esc(n[t]) + ' is choosing…'}</div>
      <div class="kd-hand">${S.hand.map((c, i) => `<button class="kd-hc tone-${c.h}" data-p="${i}" ${act ? '' : 'disabled'}><span class="kx-chip h${c.h}">${RAR[c.h]} · ${esc(c.tl)}</span><b>${esc(c.n)}</b><em>${esc(c.d)}</em><span class="kd-xp">+${XP[c.h]} Connection</span></button>`).join('')}</div>
      ${act ? `<div class="kd-pass"><button class="kx-btn ghost sm" id="sw" ${S.swaps[t] <= 0 ? 'disabled' : ''}>🔄 New hand (${S.swaps[t] > 90 ? '∞' : S.swaps[t]})</button></div>` : ''}</div>`;
  } else {
    const c = S.cur;
    body = `<div class="kx-card" data-nofx="1" style="text-align:center">${who}<div style="margin:14px 0 4px">${U.card('<span>💞</span>', `<span class="kx-chip h${c.h}">${RAR[c.h]} · ${esc(c.tl)}</span><div class="kx-big" style="font-size:24px">${esc(c.n)}</div><div class="kx-muted" style="margin-top:8px;font-size:15px">${esc(c.d)}</div>`, 'tone-' + c.h)}</div>
      ${S.msg ? `<div class="kd-combo">${esc(S.msg)}</div>` : ''}${act ? `<div class="kd-pass"><button class="kx-btn gold" id="dn">✓ Done +${XP[c.h]}</button><button class="kx-btn ghost" id="sk">Skip</button><button class="kx-btn ghost" id="sv">♡ Save</button></div>` : `<p class="kx-muted" style="margin-top:12px">${esc(n[t])} is leading this one. Enjoy.</p>`}</div>`;
  }
  app.innerHTML = head + body;
  U.bindBar(app, {guide: GUIDE, guideTitle: 'How to play Connection Cards', two: two(), quit: () => { D.quit(S); S = null; render(); }});
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.cur = S.hand[+b.dataset.p]; S.phase = 'do'; S.msg = ''; D.save(S); render(); });
  const sw = document.getElementById('sw'); if (sw) sw.onclick = () => { S.swaps[t]--; S.hand = deal(); D.save(S); render(); };
  if (S.phase === 'do') {
    U.flip(app, 100);
    const dn = document.getElementById('dn');
    if (dn) {
      dn.onclick = () => { const c = S.cur; S.conn += XP[c.h]; S.total += XP[c.h]; S.hist.push(c.t); if (S.hist.length > 3) S.hist.shift(); S.count++; try { KA_TRACK.log('play', 'Connection Cards', c.n); } catch (e) {}
        const cb = checkCombo(); let msg = ''; if (cb) { S.conn += cb.b; S.total += cb.b; S.combos.push(cb.n); S.hist = []; msg = '✨ Combo: ' + cb.n + ' +' + cb.b; window.KA_MOTION && KA_MOTION.burst({kind: 'embers', n: 30}); }
        if (S.conn >= 100) { S.lvl++; S.conn -= 100; msg = (msg ? msg + ' · ' : '') + '🎉 Level ' + S.lvl + ': ' + RANK(S.lvl); window.KA_MOTION && KA_MOTION.burst({kind: 'confetti', n: 40}); }
        nextTurn(msg); };
      document.getElementById('sk').onclick = () => { S.hist = []; nextTurn(''); };
      document.getElementById('sv').onclick = e => { KX.fav('cards', S.cur.n + ': ' + S.cur.d); e.target.textContent = '♥ Saved'; };
    }
  }
}
function nextTurn(msg) { S.turn = 1 - S.turn; S.cur = null; S.msg = msg; if (S.goal && S.count >= S.goal) { S.phase = 'end'; } else { S.phase = 'pick'; S.hand = deal(); } D.save(S); render(); }
function endView() {
  app.innerHTML = '<h1 class="kx-title"><span>Connection Cards</span></h1><div class="kx-card" data-nofx="1" style="text-align:center"><div class="kx-turn">Well played</div><div class="kx-big" style="margin:10px auto">Level ' + S.lvl + ' · ' + RANK(S.lvl) + '</div><p class="kx-muted">' + S.count + ' cards · ' + S.total + ' Connection earned' + (S.combos.length ? ' · Combos: ' + esc([...new Set(S.combos)].join(', ')) : '') + '</p><div class="kx-row" style="justify-content:center;margin-top:14px"><button class="kx-btn gold" id="ag">Play again</button><a class="kx-btn ghost" href="../play.html">More games</a></div></div>';
  window.KA_MOTION && KA_MOTION.burst({kind: 'hearts', n: 40});
  document.getElementById('ag').onclick = () => { D.clear(); S = null; render(); };
}
render();
})();
</script>
<script src="../js/ka-features.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ka-config.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
