<meta charset="utf-8"/>

<title>KamaAgni Never Have I Ever</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-data.js"></script>
<script src="../js/ka-common.js"></script>
<script src="../js/ka-duo.js"></script>
<script src="../js/ka-ui.js"></script>
<script src="../js/ka-reveal.js"></script>
<script>
KA_REVEAL.run(document.getElementById('app'), {
  id: 'nhie', key: 'ka_nhie_v1', g: 'nhie', title: 'Never Have I Ever', sub: 'Say honestly whether you have. See who has done what.', icon: '🙋',
  deckUrl: '../data/deck/nhie.json', card: it => ({q: String(it), opts: ['I have 🙋', 'Never 🙅']}), or: '·',
  same: '🤝 You answered the same.', diff: '😏 One of you has! Tell the story.', ask: 'Ask for the full story.', scoreLabel: 'Same answers',
  startLabel: 'Deal the first card', guideTitle: 'How to play Never Have I Ever',
  guide: `<h3>The idea</h3><p>A statement appears, such as "Never have I ever kissed in the rain." You both secretly choose <b>I have</b> or <b>Never</b>. Then the answers are revealed.</p>
  <h3>Each card</h3><ol><li>Read the statement.</li><li>Tap "I have" or "Never" in private.</li><li>When both of you have answered, see the reveal. If one of you has, that is your cue to tell the story.</li></ol>
  <h3>Options</h3><ul><li>Choose categories from love to naughty. Cards above your heat level never appear.</li><li>Play on one phone (hand it over) or on two phones live.</li></ul>
  <h3>Ground rules</h3><ul><li>Be honest, be kind, and keep the stories fun.</li><li>You can always say "pass" when asked for a story.</li></ul>`,
  note: 'The past is the past. This is for laughs and closeness, not for judgement.'
});
</script>
<script src="../js/ka-features.js"></script>
