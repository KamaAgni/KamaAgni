<!doctype html>
<html lang="en"><head>
  <script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-custom.js"></script><script src="../js/ka-fx.js"></script>

</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-data.js"></script>
<script src="../js/ka-common.js"></script>

<script>
(() => {
'use strict';
const {esc, shuffle, LS, pick} = KX, U = KA_UI, C = KA_CARDS, app = document.getElementById('app');
const cp = LS.get('ka_couple', {}) || {}, NM = [cp.p1 || 'Partner 1', cp.p2 || 'Partner 2'];
let S = null;
const KEY = 'ka_cs_v1';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const clear = () => { S = null; try { localStorage.removeItem(KEY); } catch (e) {} };
const bar = chips => U.bar(chips, {guide: 1, quit: 1});
const bindBar = () => U.bindBar(app, {guide: GUIDE, guideTitle: 'How to play', quit: () => { KA_PERF.stop(); clear(); setup(); }});
const tiersOf = () => (S && S.tiers) || ['romantic'];
const actFor = (card, p) => C.act(C.tierAt(tiersOf(), p == null ? 0 : p), card.r);
const wishText = () => C.act(tiersOf()[tiersOf().length - 1], 12);
const tierExtras = [{id: 'x', label: 'Intensity', opts: [['one', 'Stay on the first tier'], ['up', 'Climb tier by tier']], def: 'up'}];
const tierList = sel => { const order = C.TIERS.map(t => t.id).filter(id => sel.includes(id)); return order.length ? order : ['romantic']; };
const GUIDE = `<h3>The idea</h3><p>Crazy Eights. Play a card that matches the top card by suit or rank. Play the same rank in a different suit and your partner performs that rank's activity for you.</p><h3>Play</h3><ol><li>Pass the phone each turn. Only the player whose turn it is sees their hand.</li><li>Glowing cards can be played. Tap one.</li><li>Eights are wild: play one any time and name the suit.</li><li>No playable card: draw up to three. Still nothing: take off an item of clothing or do the forfeit shown.</li><li>First to empty their hand scores the points left in the other hand (eights 25, face cards 10, aces 1). Highest total after the rounds wins a final wish.</li></ol>`;
function setup() { U.setup(app, {id: 'cs', title: 'Crazy Sex', sub: 'Crazy Eights for couples. Match a rank and your partner performs.', modes: ['one'], catsLabel: 'Intensity tiers', cats: C.cats(), guide: GUIDE, guideTitle: 'How to play', extras: tierExtras.concat([{id: 'rounds', label: 'Rounds', opts: [[1, '1 round'], [2, '2 rounds'], [4, '4 rounds']], def: 2}]), startLabel: 'Deal',
  start: o => { let t = tierList(o.cats); if (o.extras.x === 'one') t = [t[0]]; S = {tiers: t, heat: o.heat, rounds: +o.extras.rounds, round: 1, total: [0, 0], phase: 'gateA', turn: 0, msg: ''}; deal(); save(); render(); }}); }
function deal() { const d = C.shuffle(C.deck()); S.hands = [d.splice(0, 8), d.splice(0, 8)]; let top = d.shift(); while (top.r === 7) { d.push(top); top = d.shift(); } S.pile = d; S.top = top; S.suit = top.s; S.turn = (S.round - 1) % 2; S.phase = 'gateA'; S.drawn = 0; }
const prog = () => Math.min(.99, ((S.round - 1) + (16 - S.hands[0].length - S.hands[1].length) / 16) / S.rounds);
const legal = c => c.r === 7 || c.s === S.suit || c.r === S.top.r;
function nextTurn(msg) { S.turn = 1 - S.turn; S.phase = 'gateA'; S.drawn = 0; S.msg = msg || ''; save(); render(); }
function roundEnd(w) { const pts = S.hands[1 - w].reduce((a, c) => a + C.val(c), 0); S.total[w] += pts; if (S.round >= S.rounds) { const a = S.total[0], b = S.total[1], win = a === b ? -1 : a > b ? 0 : 1; Object.assign(S, {phase: 'perform', final: 1, badge: win < 0 ? 'A tie. You both win' : NM[win] + ' wins with ' + S.total[win] + ' points', sub: win < 0 ? 'Each of you picks a wish for the other' : NM[1 - win] + ' gives the winner this wish', text: wishText()}); window.KA_MOTION && KA_MOTION.burst({kind: 'hearts', n: 40}); } else { S.round++; const keep = S.total.slice(); Object.assign(S, {phase: 'perform', after: 1, badge: NM[w] + ' wins the round (+' + pts + ')', sub: 'Next round', text: 'Take a breath, a kiss, and a sip of water. Then deal again.'}); } save(); render(); }
function render() {
  if (!S) return setup(); const t = S.turn, o = 1 - t;
  const head = '<h1 class="kx-title"><span>Crazy Sex</span></h1>' + bar([['🃏 ' + esc(NM[0]) + ' ' + S.total[0], t === 0 ? 'h2' : ''], ['🃏 ' + esc(NM[1]) + ' ' + S.total[1], t === 1 ? 'h2' : ''], ['round ' + S.round + '/' + S.rounds, '']]);
  const card = h => '<div class="kx-card" data-nofx="1" style="text-align:center">' + h + '</div>';
  if (S.phase === 'perform') { app.innerHTML = head + '<div id="pf"></div>'; bindBar(); KA_PERF.show(document.getElementById('pf'), {badge: S.badge, sub: S.sub, text: S.text, doneLabel: S.final ? 'Finish' : undefined, onDone: () => { if (S.final) { try { KA_TRACK.log('play', 'Crazy Sex', ''); } catch (e) {} clear(); setup(); return; } if (S.after) { S.after = 0; deal(); } else if (S.resume) { S.resume = 0; S.turn = 1 - S.turn; S.phase = 'gateA'; } else S.phase = 'gateA'; save(); render(); }}); return; }
  if (S.phase === 'gateA') { app.innerHTML = head + card('<div class="kx-turn">Pass the phone</div><div class="kx-big" style="margin:10px auto">' + esc(NM[t]) + '</div><p class="kx-muted">' + esc(NM[o]) + ', look away.</p><button class="kx-btn gold" id="g">I am ' + esc(NM[t]) + '. Show my hand</button>'); bindBar(); document.getElementById('g').onclick = () => { S.phase = 'play'; render(); }; return; }
  if (S.phase === 'suit') { app.innerHTML = head + card('<div class="kx-turn">Wild eight</div><p class="kx-muted">Name the suit.</p><div class="gb-ask" style="display:flex;gap:10px;justify-content:center;margin:12px 0">' + C.SU.map(s => '<button class="kx-btn ghost cs-suit ' + (s === '♥' || s === '♦' ? 'red' : '') + '" data-s="' + s + '">' + s + '</button>').join('') + '</div>'); bindBar();
    app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.suit = b.dataset.s; if (!S.hands[t].length) return roundEnd(t); nextTurn(NM[t] + ' played a wild eight and named ' + S.suit); }); return; }
  const hand = S.hands[t].slice().sort((a, b) => a.s.localeCompare(b.s) || a.r - b.r);
  app.innerHTML = head + card('<div class="kx-turn">' + esc(NM[t]) + ', your turn</div><div class="cs-top">' + C.face(S.top, 'big') + '<div><div class="kx-muted">Match</div><div class="cs-suit ' + (S.suit === '♥' || S.suit === '♦' ? 'red' : '') + '">' + S.suit + '</div></div></div><p class="kx-muted">' + esc(S.msg || 'Play a glowing card, or draw.') + '</p><div class="kc-hand">' + hand.map((c, i) => C.face(c, (legal(c) ? 'ok' : 'dim') + ' tap')).join('') + '</div><button class="kx-btn ghost" id="dr">Draw a card (' + S.drawn + '/3)</button>'); bindBar(); S.msg = '';
  app.querySelectorAll('.kc.tap').forEach((el, i) => el.onclick = () => { const c = hand[i]; if (!legal(c)) return KX.toast('That card does not match'); const match = c.r === S.top.r && c.s !== S.top.s && c.r !== 7; S.hands[t] = S.hands[t].filter(x => x !== c); S.top = c; S.suit = c.s; try { KA_FX.clack(2); } catch (e) {}
    if (c.r === 7) { S.phase = 'suit'; save(); return render(); }
    if (!S.hands[t].length) { if (match) { /* skip activity on the winning card */ } return roundEnd(t); }
    if (match) { Object.assign(S, {phase: 'perform', resume: 1, badge: NM[t] + ' matched the rank (' + C.lab(c) + ')', sub: NM[o] + ' does this for ' + NM[t], text: actFor(c, prog())}); save(); return render(); }
    nextTurn(); });
  document.getElementById('dr').onclick = () => { if (S.drawn >= 3 || !S.pile.length) { return forfeit(); } const c = S.pile.shift(); S.hands[t].push(c); S.drawn++; try { KA_FX.clack(1); } catch (e) {} S.msg = 'You drew ' + C.lab(c) + (legal(c) ? '. You can play it.' : '.'); if (S.drawn >= 3 && !S.hands[t].some(legal)) return forfeit(); save(); render(); };
  function forfeit() { Object.assign(S, {phase: 'perform', resume: 1, badge: NM[t] + ' could not play', sub: 'Pay the forfeit, then it is ' + NM[o] + "'s turn", text: 'Take off one item of clothing, or do this instead: ' + C.act(C.TIERS[0].id, 12)}); save(); render(); }
}
setup();
})();
</script>
<script src="../js/ka-features.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ka-config.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>

</body></html>
