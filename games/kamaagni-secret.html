<!doctype html>
<html lang="en"><head>
<script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060f"/><meta name="robots" content="noindex,nofollow"/>
<title>KamaAgni — Secret Envelope</title>
<link rel="stylesheet" href="../css/fonts.css"/><link rel="stylesheet" href="../css/premium.css"/><link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-common.js"></script><script src="../js/ka-data.js"></script>
<script>

(async () => {
  const {LS, esc, top, pick} = KX;
  const app = document.getElementById('app');
  const D = window.KA_DATA || {};
  const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const dec = s => { try { return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))))); } catch { return null; } };
  const base = () => location.origin + location.pathname;
  const [A] = KX.names();
  const box = LS.get('ka_envelopes', []);
  const hm = location.hash.match(/[#&]m=([^&]+)/);
  const msg = hm ? dec(hm[1]) : null;

  function share(url, text) {
    if (navigator.share) navigator.share({title: 'KamaAgni', text, url}).catch(() => {});
    else (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => KX.toast('Link copied. Paste it in your chat.'), () => prompt('Copy this link', url));
  }
  function compose() {
    const ideas = () => pick([].concat((D.dare || []).slice(0, 80), (D.coupons || []).filter(c => c.h <= 2).map(c => 'Coupon: ' + c.t), ['Tonight, wear nothing under your clothes and tell me when you are home.', 'Send me a photo that only I would understand.', 'Be ready at 9pm. I have a plan for you.']));
    app.innerHTML = top('Secret Envelope', 'Send your partner a sealed surprise. They open it from a private link. No account, no server.') + `
      <div class="kx-card"><div class="kx-muted" style="margin-bottom:6px">From</div><input class="kx-input" id="fr" maxlength="24" value="${esc(A === 'Partner 1' ? '' : A)}" placeholder="Your name">
        <div class="kx-muted" style="margin-bottom:6px">Your secret message, dare or promise</div>
        <textarea class="kx-input" id="tx" rows="4" maxlength="400" placeholder="Write something, or tap the dice for an idea"></textarea>
        <div class="kx-row" style="margin-bottom:10px"><button class="kx-btn ghost sm" id="id">🎲 Idea</button></div>
        <div class="kx-muted" style="margin-bottom:6px">Locked until (optional)</div><input type="datetime-local" class="kx-input" id="ul">
        <button class="kx-btn" id="mk">💌 Seal & share</button></div>
      <div class="kx-sec">Your envelopes</div><div class="kx-list">${box.slice().reverse().slice(0, 12).map(b => `<div class="kx-item"><span class="kx-it">${b.dir === 'in' ? '📥 From ' + esc(b.f || '?') : '📤 Sent'}<br><span class="kx-muted">${esc((b.t || '').slice(0, 60))}</span></span></div>`).join('') || '<p class="kx-muted">None yet.</p>'}</div>`;
    document.getElementById('id').onclick = () => { document.getElementById('tx').value = ideas(); };
    document.getElementById('mk').onclick = () => {
      const t = document.getElementById('tx').value.trim(), f = document.getElementById('fr').value.trim() || 'Your partner', ul = document.getElementById('ul').value;
      if (!t) return KX.toast('Write something first');
      const o = {f, t, u: ul ? new Date(ul).getTime() : 0, c: Date.now()};
      box.push({dir: 'out', t, c: o.c}); LS.set('ka_envelopes', box);
      share(base() + '#m=' + enc(o), f + ' sent you a secret envelope 💌');
    };
  }
  function open(o) {
    if (o.r) { // a reply
      app.innerHTML = top('Reply received', '') + `<div class="kx-card kx-play"><div style="font-size:48px">✅</div><div class="kx-big" style="font-size:22px">${esc(o.f)} says: done</div>${o.n ? `<div class="kx-muted" style="font-size:15px">“${esc(o.n)}”</div>` : ''}<a class="kx-btn" href="kamaagni-secret.html">Send another</a></div>`;
      return;
    }
    const wait = o.u && o.u > Date.now();
    app.innerHTML = top('A secret envelope', 'For your eyes only.') + `<div class="kx-card kx-play" id="env"><div style="font-size:64px">${wait ? '🔒' : '💌'}</div>
      <div class="kx-big" style="font-size:22px">From ${esc(o.f)}</div>
      ${wait ? `<div class="kx-muted" id="cd"></div>` : '<button class="kx-btn" id="op">Tap to open</button>'}</div>`;
    if (wait) {
      const upd = () => { const s = Math.max(0, Math.round((o.u - Date.now()) / 1000)); if (!s) return open(o); document.getElementById('cd').textContent = 'Opens in ' + Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm ' + s % 60 + 's'; setTimeout(upd, 1000); };
      return upd();
    }
    document.getElementById('op').onclick = () => {
      if (!box.some(b => b.c === o.c && b.dir === 'in')) { box.push({dir: 'in', f: o.f, t: o.t, c: o.c}); LS.set('ka_envelopes', box); if (window.KA_TRACK) KA_TRACK.award('envelope', 8); }
      if (navigator.vibrate) { try { navigator.vibrate([20, 40, 20]); } catch (e) {} }
      document.getElementById('env').innerHTML = `<div style="font-size:54px">🔥</div><div class="kx-turn">From ${esc(o.f)}</div><div class="kx-big" style="font-size:24px">${esc(o.t)}</div>
        <input class="kx-input" id="nt" maxlength="120" placeholder="Add a reply (optional)" style="max-width:360px"><div class="kx-row" style="justify-content:center"><button class="kx-btn" id="dn">Done ✓ Send reply</button></div>`;
      document.getElementById('dn').onclick = () => { share(base() + '#m=' + enc({r: 1, f: KX.names()[0] === 'Partner 1' ? 'Your partner' : KX.names()[0], n: document.getElementById('nt').value.trim(), c: Date.now()}), 'Done ✓'); };
    };
  }
  if (msg) open(msg); else compose();
  addEventListener('hashchange', () => location.reload());
})();

</script>
<script src="../js/ka-config.js"></script><script src="../js/ka-features.js"></script><script src="../js/app-shell.js"></script><script src="../js/ka-gate.js"></script><script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
