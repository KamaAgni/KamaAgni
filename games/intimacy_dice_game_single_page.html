:root {

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {

  background:var(--bg); color:var(--text);

}
a { text-decoration:none; color:inherit; }

/* Ambient */
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%,  rgba(108,126,248,0.10) 0%,transparent 65%),
    radial-gradient(ellipse 700px 400px at 88% 108%, rgba(232,99,122,0.08) 0%,transparent 65%);
}
body::after {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.022;

  background-size:200px 200px;
}

/* Toast */
#toast-wrap {

  display:flex; flex-direction:column; align-items:center; gap:8px;
  z-index:9999; pointer-events:none;
}
.toast {
  background:var(--surface2); border:1px solid var(--border2);
  color:var(--text); padding:10px 22px; border-radius:999px;
  font-size:13px; font-weight:600; opacity:0; transform:translateY(8px);
  transition:opacity .26s ease, transform .26s ease;
  white-space:nowrap; box-shadow:0 8px 28px rgba(0,0,0,0.5);
}
.toast.show    { opacity:1; transform:translateY(0); }
.toast.success { border-color:rgba(232,99,122,0.4);   color:var(--rose2); }
.toast.info    { border-color:rgba(108,126,248,0.35); color:var(--indigo2); }

/* App shell */
.app {

}

/* Topbar */
.topbar { display:flex; align-items:center; margin-bottom:24px; }
.home-btn {

}
.home-btn:hover { color:var(--text); border-color:var(--border2); }

/* Header */

.eyebrow-dot {
  width:5px; height:5px; border-radius:50%;

}
@keyframes dotPulse {

}
header h1 {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(26px,4vw,44px); font-weight:700;
  letter-spacing:-0.02em; line-height:1.1; color:var(--text); margin-bottom:10px;
}

.lead { font-size:15px; color:var(--muted); line-height:1.6; max-width:520px; margin:0 auto; }

select:hover,select:focus { border-color:var(--border2); }

.btn-roll {

/* ═══════════════════════════════════════════
   DIE: single face, always visible.
   Roll = blur+scale spin keyframe.
   After roll lands: snap to new text cleanly.
═══════════════════════════════════════════ */
.die {
  width:var(--ds); height:var(--ds);
  position:relative; flex-shrink:0;
}

.die-face {
  width:100%; height:100%;
  border-radius:20px;
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding:14px;
  font-family:'DM Sans',sans-serif;
  font-weight:800; font-size:17px; line-height:1.25;
  box-shadow:0 8px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.07);
  transition:box-shadow 0.4s ease;
  position:relative; overflow:hidden;
  /* Idle state */
  background:var(--surface2);
  border:1px solid var(--border2);
  color:var(--muted);
}

/* Idle "?" label */
.die-face::before {
  content: attr(data-label);
  position:absolute; bottom:10px; left:0; right:0;
  font-size:10px; font-weight:700; letter-spacing:0.08em;
  text-transform:uppercase; opacity:0.5; text-align:center;
}

/* Die colour themes — applied via JS class */
.die-face.is-action {
  background:linear-gradient(145deg,#2a0d18,#1c0810);
  color:var(--rose2); border:1px solid rgba(232,99,122,0.3);
  box-shadow:0 8px 32px rgba(0,0,0,0.55), 0 0 0 1px rgba(232,99,122,0.1);
}
.die-face.is-body {
  background:linear-gradient(145deg,#0c1128,#06091a);
  color:var(--indigo2); border:1px solid rgba(108,126,248,0.3);
  box-shadow:0 8px 32px rgba(0,0,0,0.55), 0 0 0 1px rgba(108,126,248,0.1);
}
.die-face.is-manner {
  background:linear-gradient(145deg,#1c1506,#110e03);
  color:#f5d96e; border:1px solid rgba(245,200,66,0.25);
  box-shadow:0 8px 32px rgba(0,0,0,0.55), 0 0 0 1px rgba(245,200,66,0.1);
}

/* Roll spin animation */
@keyframes dieSpin {
  0%   { transform:scale(1)    rotateY(0deg);   filter:blur(0px);  opacity:1; }
  20%  { transform:scale(1.12) rotateY(120deg); filter:blur(3px);  opacity:0.7; }
  50%  { transform:scale(1.08) rotateY(280deg); filter:blur(5px);  opacity:0.5; }
  75%  { transform:scale(1.05) rotateY(400deg); filter:blur(2px);  opacity:0.8; }
  100% { transform:scale(1)    rotateY(540deg); filter:blur(0px);  opacity:1; }
}

/* Land animation — small bounce when result appears */
@keyframes dieLand {
  0%   { transform:scale(1.08); }
  60%  { transform:scale(0.96); }
  100% { transform:scale(1); }
}

.die-face.spinning {
  animation:dieSpin 0.75s cubic-bezier(0.4,0,0.2,1) forwards;
}
.die-face.landing {
  animation:dieLand 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

/* Shadow */
.die-shadow {
  position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
  width:70%; height:14px; border-radius:50%;
  filter:blur(10px); background:rgba(0,0,0,0.4);
  transition:width .5s, opacity .5s; pointer-events:none;
}
.die.rolling .die-shadow { width:90%; opacity:0.6; }

/* Result card */
.results { min-height:60px; text-align:center; }
@keyframes cardReveal {
  from { opacity:0; transform:translateY(16px) scale(0.98); }
  to   { opacity:1; transform:translateY(0) scale(1); }

.result-card {

.result-badge.body   { background:rgba(108,126,248,0.12); color:var(--indigo2); border:1px solid rgba(108,126,248,0.25); }
.result-badge.manner { background:rgba(245,200,66,0.10);  color:#f5d96e;        border:1px solid rgba(245,200,66,0.22); }

  if (a.includes('lick'))                 return `Lick ${bodyText} ${m}.`;
  if (a.includes('nibble'))               return `Gently nibble ${bodyText} ${m}.`;
  if (a.includes('bite'))                 return `Gently bite ${bodyText} ${m}.`;
  if (a.includes('tease'))                return `Playfully tease ${bodyText} ${m}.`;
  if (a.includes('spank'))                return `Give a playful spank on your partner's ${b} ${m}.`;
  if (a.includes('pull closer'))          return `Pull your partner closer ${m}.`;
  if (a.includes('scratch'))              return `Lightly scratch ${bodyText} ${m}.`;
  if (a.includes('eat whipped cream'))    return `Eat whipped cream off ${bodyText} ${m}.`;
  if (a.includes('give a hickey'))        return `Give a hickey to your partner's ${b} ${m}.`;
  return `${action} your partner's ${b} ${m}.`;
}

/* ─── ROLL ─── */
let isRolling = false;

function roll() {
  if (isRolling) return;
  isRolling = true;
  rollBtn.disabled = true;

  const level = levelSel.value;
  const chosen = [
    pick(pools[level].actions),
    pick(pools[level].bodies),
    pick(pools[level].manners)
  ];
  const types  = ['is-action','is-body','is-manner'];

  // Spin each die with a small stagger offset
  faceEls.forEach((face, i) => {
    dieEls[i].classList.add('rolling');
    // Reset animation by removing/re-adding class
    face.classList.remove('spinning','landing');
    void face.offsetWidth;

    setTimeout(() => {
      face.classList.add('spinning');
    }, i * 80); // stagger start: 0, 80, 160ms
  });

  // After spin finishes, snap text + landing bounce — staggered
  const spinDuration = 750;
  faceEls.forEach((face, i) => {
    setTimeout(() => {
      // Swap text & colour
      face.textContent = chosen[i];
      face.className = `die-face ${types[i]}`;
      face.setAttribute('data-label', ['What','Where','How'][i]);
      // Landing bounce
      void face.offsetWidth;
      face.classList.add('landing');
      dieEls[i].classList.remove('rolling');

      face.addEventListener('animationend', () => face.classList.remove('landing'), { once:true });
    }, i * 80 + spinDuration);
  });

  // Show result after all three land
  const totalWait = 2 * 80 + spinDuration + 320;
  setTimeout(() => {
    const [a, b, c] = chosen;
    const sentence  = formatSentence(a, b, c);
    const prompt    = microPrompt();
    const saved     = JSON.parse(localStorage.getItem('dice_favorites')||'[]');
    const isSaved   = saved.includes(sentence);

    resultsEl.innerHTML = `
      <div class="result-card show">
        <div class="result-header">
          <span class="result-emoji">💋</span>
          <p class="result-text">${sentence}</p>
          <button id="saveFav" class="save-btn${isSaved?' saved':''}" title="Save this move">${isSaved?'❤️':'🤍'}</button>
        </div>
        <div class="result-badges">
          <span class="result-badge action">${a}</span>
          <span class="result-badge body">${b}</span>
          <span class="result-badge manner">${c}</span>
        </div>
        <div class="result-divider"></div>
        <p class="result-prompt">✨ ${prompt}</p>
      </div>`;

    document.getElementById('saveFav').addEventListener('click', function() {
      const list = JSON.parse(localStorage.getItem('dice_favorites')||'[]');
      if (!list.includes(sentence)) {
        list.push(sentence);
        localStorage.setItem('dice_favorites', JSON.stringify(list));
        this.textContent = '❤️'; this.classList.add('saved');
        renderFavorites();
        showToast('Saved to favorites ❤️','success');
      } else { showToast('Already in favorites!','info'); }
    });

    const joined = (a+' '+b+' '+c).toLowerCase();
    const tips   = {
      touch:'Gentle physical touch releases oxytocin, the bonding hormone.',
      kiss:'Kissing and slow affection deepen emotional connection.',
      novelty:'Doing something new together reignites spark and curiosity.',
      laugh:'Shared laughter builds playfulness and trust.',
      gaze:'Eye contact and presence strengthen intimacy.'
    };
    let t = tips.touch;
    if (joined.includes('kiss'))                                 t = tips.kiss;
    else if (joined.includes('novel')||joined.includes('dance')) t = tips.novelty;
    else if (joined.includes('laugh')||joined.includes('humor')) t = tips.laugh;
    else if (joined.includes('eye')||joined.includes('gaze'))    t = tips.gaze;
    tipEl.textContent = t;

    rollBtn.disabled = false;
    isRolling = false;
  }, totalWait);
}

function renderFavorites() {
  const list = JSON.parse(localStorage.getItem('dice_favorites')||'[]');
  favListEl.innerHTML = list.length
    ? list.map(item=>`<div class="fav-item"><span class="fav-item-icon">💞</span><span>${item}</span></div>`).join('')
    : '<p class="fav-empty">No saved moves yet. Roll the dice and hit the heart!</p>';
}

clearFavsBtn.addEventListener('click',()=>{
  localStorage.removeItem('dice_favorites');
  renderFavorites();
  showToast('Favorites cleared.','info');
});

levelSel.addEventListener('change',()=>{
  // Reset dice faces to idle
  faceEls.forEach((f,i)=>{
    f.className = 'die-face';
    f.textContent = '?';
    f.setAttribute('data-label',['What','Where','How'][i]);
  });
  resultsEl.innerHTML = '';
  const names={soft:'🌙 Gentle',medium:'🔥 Passionate',wild:'💥 Wild'};
  showToast(`Switched to ${names[levelSel.value]} Joy mode.`,'info');
});

window.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ')&&!e.target.matches('button,select,input')){
    e.preventDefault(); roll();
  }
});

rollBtn.addEventListener('click', roll);
renderFavorites();
</script>

<!-- HEARTBEAT ANIMATION -->
<canvas id="hb-canvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.55"></canvas>
<script>
(function(){
  const cv=document.getElementById("hb-canvas");
  const ctx=cv.getContext("2d");
  let W,H,t=0,rolling=false;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize();window.addEventListener("resize",resize);
  setTimeout(()=>{
    const rb=document.getElementById("rollBtn");
    if(rb)rb.addEventListener("click",()=>{rolling=true;setTimeout(()=>{rolling=false;},2200);});
  },500);
  function ecg(x,phase,amp){
    const p=((x/W)+phase)%1;
    if(p<0.30)return 0;
    if(p<0.33)return -(p-0.30)/0.03*amp*0.4;
    if(p<0.37)return ((p-0.33)/0.04)*amp;
    if(p<0.40)return amp-((p-0.37)/0.03)*(amp*1.2);
    if(p<0.43)return -amp*0.2+((p-0.40)/0.03)*amp*0.35;
    if(p<0.46)return amp*0.15-((p-0.43)/0.03)*amp*0.15;
    return 0;
  }
  function frame(){
    requestAnimationFrame(frame);
    ctx.clearRect(0,0,W,H);
    t+=rolling?0.012:0.004;
    const amp=rolling?22:10;
    const y1=H*0.82,y2=H*0.90;
    ctx.beginPath();
    for(let x=0;x<=W;x+=2){const y=y1+ecg(x,t,amp)*2;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.strokeStyle="rgba(232,99,122,"+(rolling?0.55:0.22)+")";ctx.lineWidth=rolling?1.8:1.2;ctx.stroke();
    ctx.beginPath();
    for(let x=0;x<=W;x+=2){const y=y2+ecg(x,t+0.13,amp*0.75)*2;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.strokeStyle="rgba(255,107,53,"+(rolling?0.40:0.14)+")";ctx.lineWidth=rolling?1.4:0.9;ctx.stroke();
  }
  frame();
})();
</script>
