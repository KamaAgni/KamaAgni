<!doctype html>
<html lang="en"><head>
  <script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-custom.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#07060f"/>
<meta name="robots" content="noindex,nofollow"/>
<title>KamaAgni Snap Heat</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
<style>.sn-wrap{display:flex;flex-direction:column;gap:10px;max-width:460px;margin:10px auto}.sn-pad{border-radius:22px;padding:26px 10px;font:700 20px Cinzel,serif;color:#fff;border:0;width:100%;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.sn-pad.a{background:linear-gradient(135deg,#ff5d8f,#ff7a3d)}.sn-pad.b{background:linear-gradient(135deg,#8b6cff,#46d7c6);transform:rotate(180deg)}.sn-pad:active{filter:brightness(1.25)}
.sn-mid{min-height:170px;display:flex;align-items:center;justify-content:center;gap:18px;border-radius:24px;border:1px solid var(--kv-line2);background:var(--kv-glass);transition:box-shadow .15s}.sn-mid.hot{box-shadow:0 0 0 3px #ffb84d,0 0 40px rgba(255,140,60,.7)}.sn-mid .big{font-size:56px}</style>
</head><body>
<main class="kx app" id="app"></main>
<script src="../js/ka-data.js"></script>
<script src="../js/ka-common.js"></script>
<script src="../js/ka-ui.js"></script>
<script src="../js/ka-perform.js"></script>
<script src="../js/ka-cards.js"></script>
<script>
(() => {
'use strict';
const {esc, shuffle, LS, pick} = KX, U = KA_UI, C = KA_CARDS, app = document.getElementById('app');
const cp = LS.get('ka_couple', {}) || {}, NM = [cp.p1 || 'Partner 1', cp.p2 || 'Partner 2'];
let S = null;
const KEY = 'ka_snap_v1';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const clear = () => { S = null; try { localStorage.removeItem(KEY); } catch (e) {} };
const bar = chips => U.bar(chips, {guide: 1, quit: 1});
const bindBar = () => U.bindBar(app, {guide: GUIDE, guideTitle: 'How to play', quit: () => { KA_PERF.stop(); clear(); setup(); }});
const tiersOf = () => (S && S.tiers) || ['romantic'];
const actFor = (card, p) => C.act(C.tierAt(tiersOf(), p == null ? 0 : p), card.r);
const wishText = () => C.act(tiersOf()[tiersOf().length - 1], 12);
const tierExtras = [{id: 'x', label: 'Intensity', opts: [['one', 'Stay on the first tier'], ['up', 'Climb tier by tier']], def: 'up'}];
const tierList = sel => { const order = C.TIERS.map(t => t.id).filter(id => sel.includes(id)); return order.length ? order : ['romantic']; };
const GUIDE = `<h3>The idea</h3><p>A strip-and-tease version of Snap. Lay the phone flat between you. Two cards flip at once. When the ranks match, be first to smack your pad.</p><h3>Play</h3><ol><li>Your pad faces you: pink at the bottom, purple at the top.</li><li>Match smacked first: you win the card, and your partner performs that card's activity for you.</li><li>Smack when there is no match: you perform your partner's card activity for them.</li><li>First to the target wins a final wish.</li></ol><p>Activities come from the Card Menu, which you can edit.</p>`;
let tm = 0, live = false, hot = null;
function setup() { clearTimeout(tm); U.setup(app, {id: 'snap', title: 'Snap Heat', sub: 'Two cards flip. First to smack a match wins. The loser performs.', modes: ['one'], catsLabel: 'Intensity tiers', cats: C.cats(), guide: GUIDE, guideTitle: 'How to play', extras: tierExtras.concat([{id: 'goal', label: 'First to', opts: [[3, '3 snaps'], [5, '5 snaps'], [7, '7 snaps']], def: 3}]), startLabel: 'Get ready',
  start: o => { let t = tierList(o.cats); if (o.extras.x === 'one') t = [t[0]]; S = {tiers: t, heat: o.heat, goal: +o.extras.goal, score: [0, 0], phase: 'ready', msg: ''}; save(); render(); }}); }
const prog = () => Math.min(.99, (S.score[0] + S.score[1]) / (S.goal * 2));
function render() {
  clearTimeout(tm); live = false; hot = null; if (!S) return setup();
  const head = '<h1 class="kx-title"><span>Snap Heat</span></h1>' + bar([['👋 ' + esc(NM[0]) + ' ' + S.score[0], ''], ['👋 ' + esc(NM[1]) + ' ' + S.score[1], ''], ['first to ' + S.goal, '']]);
  if (S.phase === 'perform') { app.innerHTML = head + '<div id="pf"></div>'; bindBar(); KA_PERF.show(document.getElementById('pf'), {badge: S.badge, sub: S.sub, text: S.text, onDone: () => { if (S.final) { try { KA_TRACK.log('play', 'Snap Heat', ''); } catch (e) {} clear(); setup(); return; } if (S.score[0] >= S.goal || S.score[1] >= S.goal) { const w = S.score[0] >= S.goal ? 0 : 1; Object.assign(S, {phase: 'perform', final: 1, badge: NM[w] + ' wins the game', sub: NM[1 - w] + ' gives the winner this wish', text: wishText()}); } else S.phase = 'ready'; save(); render(); }}); return; }
  app.innerHTML = head + '<div class="sn-wrap"><button class="sn-pad b" id="pb">' + esc(NM[1]) + ': SNAP</button><div class="sn-mid" id="mid"><span class="big">👋</span></div><button class="sn-pad a" id="pa">' + esc(NM[0]) + ': SNAP</button></div><p class="kx-note" style="text-align:center" id="nt">' + esc(S.msg || 'Cards start in a moment. Smack only on a match. Keyboard: A (bottom) and L (top).') + '</p>';
  bindBar(); const mid = document.getElementById('mid'), nt = document.getElementById('nt'); let cur = null;
  const finish = (who, win) => { hot = null; live = false; clearTimeout(tm); try { navigator.vibrate && navigator.vibrate([30, 40, 60]); KA_FX.clack(3); } catch (e) {}
    if (win) { S.score[who]++; Object.assign(S, {phase: 'perform', badge: NM[who] + ' snapped it first', sub: NM[1 - who] + ' does this for ' + NM[who], text: actFor(hot0, prog())}); }
    else Object.assign(S, {phase: 'perform', badge: NM[who] + ' snapped with no match', sub: NM[who] + ' performs ' + NM[1 - who] + "'s card for them", text: actFor(cur[1 - who], prog())});
    save(); render(); };
  let hot0 = null;
  const tap = who => () => { if (!live || !cur) return; if (hot) { hot0 = hot; finish(who, true); } else finish(who, false); };
  document.getElementById('pa').onpointerdown = tap(0); document.getElementById('pb').onpointerdown = tap(1);
  window.__kaKeys = { a: tap(0), b: tap(1) }; if (!window.__kaKeyBound) { window.__kaKeyBound = 1; document.addEventListener('keydown', e => { if (e.repeat || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) return; const k = (e.key || '').toLowerCase(); if (k === 'a' || k === 'z') window.__kaKeys && window.__kaKeys.a(); else if (k === 'l' || k === 'm') window.__kaKeys && window.__kaKeys.b(); }); }
  let since = 0;
  const flip = () => { if (!live) return; hot = null; mid.classList.remove('hot'); since++;
    const m = since >= 2 && (Math.random() < .35 || since >= 6), a = C.deck()[Math.floor(Math.random() * 52)], r = m ? a.r : (a.r + 1 + Math.floor(Math.random() * 12)) % 13;
    const ss = shuffle(C.SU), b = {r, s: m ? (ss[0] === a.s ? ss[1] : ss[0]) : ss[0]}; cur = [a, b];
    mid.innerHTML = C.face(a, 'big in') + C.face(b, 'big in'); try { KA_FX.clack(1); } catch (e) {}
    if (m) { since = 0; hot = a; mid.classList.add('hot'); tm = setTimeout(() => { hot = null; mid.classList.remove('hot'); nt.textContent = 'Too slow, both of you.'; flip(); }, 1800); }
    else tm = setTimeout(flip, 1100 + Math.random() * 500); };
  if (S.phase === 'ready') { live = true; let c = 3; mid.innerHTML = '<span class="big">' + c + '</span>'; const cd = () => { c--; if (c > 0) { mid.innerHTML = '<span class="big">' + c + '</span>'; tm = setTimeout(cd, 800); } else { S.phase = 'run'; cur = [0, 0]; flip(); } }; tm = setTimeout(cd, 800); }
}
setup();
})();
</script>
<script src="../js/ka-features.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/ka-config.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
