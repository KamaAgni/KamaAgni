<style>

.sd-c{border:1px solid var(--border2);background:var(--surface2);color:var(--text);border-radius:14px;padding:11px 12px;text-align:left;font:inherit;cursor:pointer;min-height:84px;transition:transform .15s,border-color .15s}
.sd-c:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(232,99,122,.55)}
.sd-c:disabled{opacity:.4;cursor:not-allowed}.sd-c.sel{border-color:#ffb089;box-shadow:0 0 0 2px rgba(255,176,137,.3)}
.sd-c small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
.sd-c .v{float:right;font-weight:800;font-size:16px}.sd-c .v.neg{color:#ff8a8a}.sd-c .v.pos{color:#9fe3c2}

#sd-guide h2{font-family:'Cormorant Garamond',serif;font-size:26px;margin:0 28px 6px 0}#sd-guide h3{margin:16px 0 4px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose2)}

.sd-mode button{text-align:left;padding:14px;border-radius:16px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font:inherit;cursor:pointer}
.sd-mode button.on{border-color:var(--rose2);box-shadow:0 0 0 2px rgba(232,99,122,.3)}.sd-mode button:disabled{opacity:.5;cursor:not-allowed}

<script>
(() => {
'use strict';
const {esc, names, top, shuffle, LS, heat} = KX;
const app = document.getElementById('app');
const KEY = 'ka_showdown_v1';

/* ---------- ORIGINAL CARD CONTENT (written for KamaAgni) ---------- */
const CONTENDERS = [

  ['Rooftop Rebel',6],['The Whisperer',8],['Shower Singer',3],['Velvet Legend',9],['Sleepy Cuddler',4],
  ['Hot Tub Hero',7],['Gym Crush',6],['Library Flirt',5],['Neighbour with the Wink',4],['Masked Dancer',8],
  ['Tipsy Tango Teacher',7],['Pillow-Fight Champion',3],['Lighthouse Keeper',5]
];

  ['Silk Scarf','Accessory',2],['Red Heels','Accessory',3],['Ice Cube','Accessory',1],['Feather Tickler','Accessory',2],
  ['Blindfold','Accessory',3],['Whipped Cream','Accessory',2],['Scented Candle','Accessory',2],['Massage Oil','Accessory',3],
  ['Loosened Tie','Accessory',2],['Lace Garter','Accessory',2],['Satin Sheets','Accessory',3],['Playlist for Two','Accessory',1],
  ['Confident Swagger','Mood',3],['Playful Grin','Mood',2],['Dripping with Charm','Mood',4],['Cheeky Wink','Mood',1],
  ['Odd Socks','Accessory',-2],['Cold Feet','Mood',-2],['Phone Buzzing','Accessory',-3],['Sudden Hiccups','Mood',-2],
  ['Hangry','Mood',-3],['Nervous Giggles','Mood',-1],['Cramped Leg','Mood',-2],['Wrong Name Slip','Mood',-4]
];
const SPECIALS = [
  ['Sabotage','Twist','Discard the highest add-on on the other side.','sab'],
  ['Blackout','Twist','Discard the highest contender on the other side, with its add-ons.','blk'],
  ['Spotlight','Twist','Double the total of one of your contenders this round.','spot'],
  ['Swap Sides','Twist','Swap one of your contenders with one of theirs, add-ons included.','swap']
];
/* Reward cards: three options each. level 1 sweet, 2 spicy, 3 wild. Both partners agree before doing any of them. */
const SMALL = [
 [1,['A slow 3-minute kiss, no hands allowed','Give a 5-minute shoulder and neck massage','Whisper your three favourite things about their body']],
 [1,['Feed each other something sweet, blindfolded','Slow dance in the dark to one full song','Trace their back with your fingertips for 2 minutes']],
 [1,['Undress them slowly, one item only','Kiss from their ear down to their collarbone','Tell them exactly where you want to be kissed next']],
 [2,['Ice cube trail along the neck and shoulders','Massage with oil, thighs and lower back only','A strip tease with their song choice']],
 [2,['Take turns kissing anywhere for 20 seconds each','Give a 3-minute lap-sitting make-out','Say one thing you have always wanted to try']],
 [1,['Wear only their shirt for the rest of the round','Hold eye contact for 90 seconds, then kiss','Choose a body part and kiss it 10 times']],
 [2,['Tease over clothes only for 4 minutes','Blindfolded touch: guess where they kiss','Whisper a fantasy, then act the first line of it']],
 [1,['Run a bath or shower together for 10 minutes','Brush their hair or wash their back, slowly','Swap shirts and cuddle skin to skin']],
 [2,['Strip race: last one dressed loses an item','Mutual massage with oil, 3 minutes each','Mouth only: kiss every spot they point to']],
 [2,['Sit on their lap and take control for 3 minutes','Ask for one thing and receive it, no questions','Lick whipped cream off a spot of their choice']]
];
const HOT = [
 [2,['Oral for 5 minutes, then swap or choose to stop','Full body massage ending wherever it leads','Take control: they do only what you say for 10 minutes']],
 [2,['Blindfolded and tied lightly with a scarf for 10 minutes','Edge them or tease them twice without finishing','Lead a slow bedroom roleplay: strangers meeting']],
 [3,['Receive oral until you ask them to stop','Position of your choice from the Position Selector','Use a toy of your choice on yourselves or each other']],
 [2,['Show them how you touch yourself','Choose a place in the home and take them there','Whisper everything you want, and they do half of it']],
 [3,['Pick a fantasy from the Fantasy Builder and act it out','Dominant for 15 minutes: they follow every instruction','Give them a slow, teasing finish of your choice']],
 [2,['Mutual touch while holding eye contact for 5 minutes','Slow grind, clothes on, for 5 minutes, then clothes off','Shower together, and they wash every inch']],
 [3,['Pleasure one another at the same time','Try a new position from the list, your pick','Make them beg politely for 5 minutes']],
 [2,['Undress them with your teeth or mouth only','Take photos of each other that nobody else will ever see','Order them what to do, and enjoy the full 10 minutes']]
];
const FINAL = [
 ['Winner chooses a full session: pleasure to a finish for both of you','Winner plans a bedroom night, loser does exactly what is asked','Winner receives 15 minutes of undivided attention, then both finish'],
 ['Winner picks a position, a place and a pace, and both finish','Winner gets a long massage that ends with a slow finish for them','Winner chooses a fantasy to act out, and both finish'],
 ['Loser serves the winner, then the winner takes the loser as they please','Winner picks a favourite move, repeated until they finish','A slow, teasing finale for the loser, planned by the winner'],
 ['Winner leads the whole night and chooses how it ends','Winner and loser take turns until both have finished','Winner chooses toys, lighting, music and the ending']
];

/* ---------- state ---------- */
let S = LS.get(KEY, null);
let ui = {sel: null, mode: null, cover: null}; // cover = player who must tap to reveal
let myIdx = LS.get(KEY + '_me', 0);
const D = KA_DUO.init({g: 'sd', key: KEY, get: () => S,
  onState: (st, first) => { const before = S ? actor() : -1; myIdx = D.me; S = st; ui.cover = null; ui.sel = null; if (!first && actor() === myIdx && before !== myIdx) KX.toast('Your turn'); render(); },
  onQuit: () => { S = null; LS.del(KEY); ui = {sel: null, mode: null, cover: null}; render(); },
  onLink: () => { if (!S || S.phase === undefined) render(); }});
const linked = () => D.linked();
const two = () => !!(S && S.mode === 'two');
const N = () => { const me = names()[0], o = D.partner || 'Your partner'; return two() ? (myIdx === 0 ? [me, o] : [o, me]) : names(); };
/* who must act in this phase (-1 = nobody in particular) */
function actor() {
  if (!S) return -1;
  const p = S.phase;
  if (p === 'draft') return [S.start, 1 - S.start, S.start][S.draftPicks] ?? S.start;
  if (p === 'battle') return S.turn;
  if (p === 'score') return 0;
  if (p === 'pick') return S.rw ? S.rw.w : 0;
  if (p === 'resp') return S.rw ? 1 - S.rw.w : 0;
  if (p === 'doit') return S.rw ? S.rw.w : 0;
  if (p === 'final') return S.fw;
  if (p === 'end') return 0;
  return 0;
}
const save = () => D.save(S);
const clearSave = () => { LS.del(KEY); };
const uid = (() => { let n = 0; return () => ++n + '_' + Math.random().toString(36).slice(2, 6); })();

function buildDeck() {
  const d = [];
  CONTENDERS.forEach(c => d.push({id: uid(), t: 'con', n: c[0], v: c[1]}));
  ADDONS.forEach(a => d.push({id: uid(), t: 'add', n: a[0], k: a[1], v: a[2]}));
  SPECIALS.forEach(s => { d.push({id: uid(), t: 'sp', n: s[0], k: s[1], d: s[2], x: s[3]}); d.push({id: uid(), t: 'sp', n: s[0], k: s[1], d: s[2], x: s[3]}); });
  return shuffle(d);
}
function rewardPool(list, lvl) {
  const ok = c => c[0] <= lvl && c[1].every(t => !window.KA_FILTER || KA_FILTER.ok(t));
  let p = list.filter(ok); if (p.length < 3) p = list.filter(c => c[0] <= Math.max(lvl, 1)); // never run empty
  return shuffle(p).map(c => ({o: c[1], lv: c[0]}));
}
function draw(n) {
  const out = [];
  while (out.length < n) {
    if (!S.deck.length) { if (!S.discard.length) break; S.deck = shuffle(S.discard); S.discard = []; }
    out.push(S.deck.pop());
  }
  return out;
}

function newGame(rounds, mode) {
  const lvl = heat();
  const small = rewardPool(SMALL, lvl), hot = rewardPool(HOT, lvl);
  const half = Math.ceil(rounds / 2), q = [];
  q.push(...small.slice(0, half), ...hot.slice(0, rounds - half));
  S = {
    mode: mode || 'one', gid: Date.now(), seq: 0, rounds, round: 0, start: Math.random() < .5 ? 0 : 1, deck: buildDeck(), discard: [], hands: [[], []],
    q, pot: [], wins: [0, 0], bails: [2, 2], table: [[], []], turn: 0, passes: 0, phase: 'rps', draftPool: [], draftPicks: 0,
    finals: shuffle(FINAL).filter(f => f.every(t => !window.KA_FILTER || KA_FILTER.ok(t))), last: -1, log: [], rw: null
  };
  S.hands = [draw(8), draw(8)];
  if (!S.finals.length) S.finals = [FINAL[0]];
  startRound(true);
}
function startRound(first) {
  S.round++; S.table = [[], []]; S.passes = 0; S.turn = S.start;
  if (S.q.length) S.pot.push(S.q.shift());
  if (first) { beginBattle(); }
  else { S.phase = 'draft'; S.draftPool = draw(3); S.draftPicks = 0; ui.cover = S.start; }
  save();
}
function beginBattle() { S.phase = 'battle'; S.turn = S.start; S.passes = 0; ui.cover = S.turn; ui.sel = null; ui.mode = null; }

/* ---------- scoring ---------- */
const conTotal = t => Math.max(0, t.card.v + t.att.reduce((s, a) => s + a.v, 0)) * (t.dbl ? 2 : 1);
const sideTotal = i => S.table[i].reduce((s, t) => s + conTotal(t), 0);
const allAddons = i => S.table[i].flatMap(t => t.att.map(a => ({a, t})));
const sign = v => (v > 0 ? '+' : '') + v;

/* ---------- views ---------- */
function head(sub) { return top('Seduction Showdown', sub || 'Build the most irresistible line-up. Winner of each round claims the reward.'); }
function status() {
  const n = N();
  return `<div class="sd-bar"><span class="kx-chip">Round ${S.round}/${S.rounds}</span><span class="kx-chip h2">${esc(n[0])} ${S.wins[0]} · ${S.wins[1]} ${esc(n[1])}</span><span class="kx-chip">🛡 Bails ${S.bails[0]} / ${S.bails[1]}</span><span class="kx-chip h3">Prize pot: ${S.pot.length} reward${S.pot.length === 1 ? '' : 's'}</span><button class="kx-chip" data-guide="1" style="cursor:pointer;background:none;font:inherit">📖 Guide</button><button class="kx-chip" data-quit="1" style="cursor:pointer;background:none;font:inherit">✕ End game</button>${two() ? '<span class="kx-chip h1">📱📱 Two phones</span>' : ''}</div>`;
}
function bindGuide() {}
const GUIDE = `
<h3>The goal</h3><p>Win more rounds than your partner. Each round you build a line-up of seductive characters, and the winner earns reward challenges that you both act out. The overall winner picks the grand finale.</p>
<h3>The cards</h3><ul>
<li><b>Contender</b> – the main scoring card. It has a base appeal from 3 to 9.</li>
<li><b>Add-on</b> – an accessory or mood that goes on top of any contender on the table, yours or theirs. Plus numbers boost, minus numbers drag down. Put minus cards on your partner's contenders.</li>
<li><b>Twist</b> – a special card: <b>Sabotage</b> removes their best add-on, <b>Blackout</b> removes their best contender, <b>Spotlight</b> doubles one of your contenders, <b>Swap Sides</b> trades one of your contenders for one of theirs.</li></ul>
<h3>Setting up</h3><ol><li>Choose the length: 4, 6 or 8 rounds. Each round has one reward card.</li><li>Each of you is dealt 8 cards. Hands are private.</li><li>Decide who starts (rock-paper-scissors, or it is random on two phones). The starter has the ⭐.</li></ol>
<h3>Every round</h3><ol>
<li><b>Draft</b> (from round 2): three cards are shown to both of you. The ⭐ player picks first, the other picks second, the ⭐ player takes the last one.</li>
<li><b>Battle</b>: take turns. On your turn play one card, or pass. Tap a Contender to play it. For an add-on or twist, tap the card, then tap the target. The round ends when both of you pass one after the other.</li>
<li><b>Score</b>: a contender is worth its base appeal plus its add-ons (never below 0). Add up your contenders. The higher total wins the round. A tie is a draw.</li>
<li><b>Reward</b>: the winner takes the prize pot and chooses one of three challenges on each reward card. The other player can accept, or <b>bail</b> (2 bails each per whole game). After a bail the winner picks another option on that card. Then you do it together and tap Done.</li>
<li>After a draw, no one wins: the next round's reward is added to the pot and the same player keeps the ⭐. After a win, the ⭐ goes to the loser so the game stays close.</li></ol>
<h3>Winning</h3><p>When all reward cards are claimed, whoever won more rounds picks the <b>final reward</b>. A tie goes to the player who won the last round. Final rewards cannot be bailed, so agree on the heat level first.</p>
<h3>Playing on one phone</h3><p>Pass the phone when the screen asks. It hides each hand until the right person taps "show me". Do not peek.</p>
<h3>Playing on two phones</h3><ol><li>Both of you sign in and link in <b>Together</b> first.</li><li>One of you picks "Two phones" and starts the game. The other phone joins by itself the moment it is open on this page.</li><li>Each phone only shows its own hand. The other phone shows "waiting" until it is your turn.</li><li>Either of you can tap ✕ End game to stop for both.</li></ol>
<h3>Ground rules</h3><ul><li>Everything is optional. "Pass" or a bail is always okay, no explanation needed.</li><li>Stop at any time. Heat level and topic filters in Settings control which challenges can appear.</li><li>Agree on safe words and boundaries before the first round.</li></ul>`;
function openGuide() {
  let g = document.getElementById('sd-guide'); if (g) g.remove();
  g = document.createElement('div'); g.id = 'sd-guide'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-label', 'How to play');
  g.innerHTML = '<div class="sd-gin"><button class="sd-gx" aria-label="Close">✕</button><h2>How to play Seduction Showdown</h2>' + GUIDE + '<button class="kx-btn gold" style="margin-top:14px" id="sd-gc">Got it</button></div>';
  document.body.appendChild(g); document.body.style.overflow = 'hidden';
  const close = () => { g.remove(); document.body.style.overflow = ''; };
  g.querySelector('.sd-gx').onclick = close; g.querySelector('#sd-gc').onclick = close; g.onclick = e => { if (e.target === g) close(); };
}
function quitGame() {
  if (!confirm('End this game for both players?')) return;
  D.quit(S); S = null; LS.del(KEY); ui = {sel: null, mode: null, cover: null};
  render();
}
app.addEventListener('click', e => { if (e.target.closest('[data-guide]')) openGuide(); else if (e.target.closest('[data-quit]')) quitGame(); else if (e.target.closest('[data-guide-setup]')) openGuide(); });
function cover(p, text, btn) {
  app.innerHTML = head() + status() + `<div class="kx-card sd-cover" data-nofx="1"><div class="kx-turn">Pass the phone</div><div class="kx-big" style="margin:10px auto">${esc(N()[p])}</div><p class="kx-muted">${esc(text)}</p><button class="kx-btn gold" id="rv" style="margin-top:14px">${esc(btn || 'I am ' + N()[p] + ', show me')}</button></div>`;
  document.getElementById('rv').onclick = () => { ui.cover = null; render(); };
}
function tableHTML() {
  const n = N();
  return '<div class="sd-row">' + [0, 1].map(i => `<div class="sd-side"><div class="sd-h"><b>${esc(n[i])}${S.start === i ? ' ⭐' : ''}</b><span class="sd-tot">${sideTotal(i)}</span></div>` +
    (S.table[i].length ? S.table[i].map(t => `<div class="sd-t"><span class="sd-pts">${conTotal(t)}${t.dbl ? ' ×2' : ''}</span><b>${esc(t.card.n)} <span class="kx-muted">(${t.card.v})</span></b>${t.att.length ? `<div class="sd-a">${t.att.map(a => esc(a.n) + ' ' + sign(a.v)).join(' · ')}</div>` : ''}</div>`).join('') : '<div class="sd-t kx-muted">No contenders yet</div>') + '</div>').join('') + '</div>';
}
function handHTML(p) {
  return '<div class="sd-hand">' + S.hands[p].map(c => {
    const dis = !playable(p, c);
    const v = c.t === 'sp' ? '' : `<span class="v ${c.t === 'add' ? (c.v < 0 ? 'neg' : 'pos') : ''}">${c.t === 'add' ? sign(c.v) : c.v}</span>`;
    return `<button class="sd-c ${ui.sel === c.id ? 'sel' : ''}" data-c="${c.id}" ${dis ? 'disabled' : ''}><small>${c.t === 'con' ? 'Contender' : c.k}</small>${v}<b>${esc(c.n)}</b>${c.d ? `<div class="sd-a">${esc(c.d)}</div>` : ''}</button>`;
  }).join('') + '</div>';
}
function playable(p, c) {
  const o = 1 - p, mine = S.table[p].length, theirs = S.table[o].length;
  if (c.t === 'con') return true;
  if (c.t === 'add') return mine + theirs > 0;
  if (c.x === 'sab') return allAddons(o).length > 0;
  if (c.x === 'blk') return theirs > 0;
  if (c.x === 'spot') return mine > 0;
  if (c.x === 'swap') return mine > 0 && theirs > 0;
  return false;
}

function waitView() {
  const a = actor(), n = N(), why = {draft: 'drafting a card', battle: 'playing their turn', score: 'starting the next round', pick: 'choosing a reward', resp: 'deciding whether to accept or bail', doit: 'with the challenge', final: 'choosing the final reward', end: ''}[S.phase] || '';
  let body = '';
  if (['battle', 'draft'].includes(S.phase)) body = `<div class="kx-card" data-nofx="1">${tableHTML()}</div>`;
  if (['resp', 'doit', 'pick'].includes(S.phase) && S.rw) { const c = S.rw.pot[S.rw.i]; if (S.phase === 'resp' || S.phase === 'doit') body = `<div class="kx-card" data-nofx="1" style="text-align:center"><div class="kx-turn">The challenge</div><div class="kx-big" style="margin:10px auto">${esc(c.o[S.rw.cur])}</div></div>`; }
  app.innerHTML = head(S.phase === 'battle' ? 'Battle' : '') + status() + body + `<div class="kx-card" data-nofx="1" style="text-align:center;margin-top:12px"><div class="kx-turn">Waiting</div><div class="kx-big" style="font-size:20px;margin:8px auto">${esc(n[a])} is ${esc(why)}…</div><p class="kx-muted">Your screen updates by itself.</p></div>`;
  bindGuide();
}
function render() {
  if (!S) return setup();
  if (two() && actor() !== myIdx) return S.phase === 'score' ? scoreView() : S.phase === 'end' ? endView() : waitView();
  if (two()) ui.cover = null;
  if (ui.cover !== null && ui.cover !== undefined && !['end'].includes(S.phase)) {
    const why = {draft: 'Time to draft: pick your new cards.', battle: 'Your turn in the battle. Keep your hand hidden.', pick: 'You won the round. Choose your reward.', resp: 'Your partner chose a reward for you. Read it, then accept or bail.', final: 'The final reward is yours to choose.', rps: ''}[S.phase] || '';
    return cover(ui.cover, why);
  }
  ({rps: rpsView, draft: draftView, battle: battleView, score: scoreView, pick: pickView, resp: respView, doit: doitView, final: finalView, end: endView})[S.phase]();
}

function setup() {
  app.innerHTML = head() + `<div class="kx-card" data-nofx="1"><div class="kx-sec" style="margin-top:0">How it works</div>
  <ol class="kx-muted" style="line-height:1.7;padding-left:18px;margin:6px 0 12px">
   <li>Each round, both of you build a line-up of <b>Contenders</b> and boost them with <b>Add-ons</b> (+ or −). Twists shake things up.</li>
   <li>Play one card or pass, taking turns. When both of you pass in a row, the higher total wins the round.</li>
   <li>The winner takes the <b>prize pot</b> and picks one challenge per reward. Your partner can <b>bail</b> twice per game.</li>
   <li>Most rounds won earns the final reward. A tie grows the pot.</li></ol>
  <p class="kx-muted">Play on one shared phone, or each on your own phone when you are linked in Together. Heat level and topic filters from Settings apply to every reward.</p>
  <div class="kx-sec">How do you want to play?</div><div class="sd-mode" id="mode"><button type="button" data-m="one" class="on"><b>📱 One phone</b><span>Share this phone. The screen asks you to hand it over before each secret hand.</span></button><button type="button" data-m="two" ${linked() ? '' : 'disabled'}><b>📱📱 Two phones</b><span>${linked() ? 'Each of you plays on your own phone, live. Your partner joins automatically.' : 'Needs a linked partner. Sign in and link in Together first.'}</span></button></div>${linked() ? '' : '<p class="kx-note"><a href="kamaagni-together.html" style="color:var(--rose2)">Open Together to link</a></p>'}
  <div class="kx-sec">Length</div><div class="kx-row" id="len">${[[4,'Quick · 4 rounds'],[6,'Classic · 6'],[8,'Long · 8']].map(l => `<button class="kx-btn ghost sm ${l[0] === 6 ? 'on' : ''}" data-r="${l[0]}">${l[1]}</button>`).join('')}</div>
  <div id="heat" style="margin-top:12px"></div>
  <div class="kx-row" style="margin-top:16px"><button class="kx-btn gold" id="go">Start the Showdown</button><button class="kx-btn ghost" data-guide-setup="1">📖 How to play</button></div></div>
  <p class="kx-note">Original game inspired by classic card-battle party games. All cards and challenges are written for KamaAgni. Both partners must agree to every challenge; "pass" is always allowed.</p>`;
  let rounds = 6;
  document.querySelectorAll('[data-r]').forEach(b => { if (+b.dataset.r === 6) b.classList.remove('ghost'); b.onclick = () => { rounds = +b.dataset.r; document.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('ghost', x !== b)); }; });
  KX.heatBar(document.getElementById('heat'), () => {});
  let mode = 'one';
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { if (b.disabled) return; mode = b.dataset.m; document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); });
  document.getElementById('go').onclick = () => {
    if (mode === 'two' && !linked()) return KX.toast('Link with your partner in Together first');
    myIdx = 0; D.setMe(0); newGame(rounds, mode);
    if (mode === 'two') { startRoundFirst(); return; }
    S.phase = 'rps'; ui.cover = null; save(); render();
  };
}

function rpsView() {
  const n = N();
  app.innerHTML = head() + `<div class="kx-card" data-nofx="1" style="text-align:center"><div class="kx-turn">Who starts?</div><div class="kx-big" style="margin:10px auto">✊ ✋ ✌️</div><p class="kx-muted">Play rock-paper-scissors out loud, then tell the game who won. The starting player (⭐) drafts first and plays first, and the star passes to the other player after each round win.</p>
  <div class="kx-row" style="justify-content:center;margin-top:12px"><button class="kx-btn" data-s="0">${esc(n[0])} won</button><button class="kx-btn" data-s="1">${esc(n[1])} won</button></div></div>`;
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.start = +b.dataset.s; startRoundFirst(); });
}
function startRoundFirst() { S.round = 1; S.table = [[], []]; S.passes = 0; S.turn = S.start; if (!S.pot.length && S.q.length) S.pot.push(S.q.shift()); beginBattle(); save(); render(); }

function draftView() {
  const order = [S.start, 1 - S.start, S.start]; // first and last pick for the starter
  const p = order[S.draftPicks];
  app.innerHTML = head('Draft') + status() + `<div class="kx-card" data-nofx="1"><div class="kx-turn">${esc(N()[p])}: pick a card (${S.draftPicks + 1}/3)</div>
   <div class="sd-hand" style="margin-top:10px">${S.draftPool.map(c => `<button class="sd-c" data-d="${c.id}"><small>${c.t === 'con' ? 'Contender' : c.k}</small>${c.t === 'sp' ? '' : `<span class="v ${c.t === 'add' ? (c.v < 0 ? 'neg' : 'pos') : ''}">${c.t === 'add' ? sign(c.v) : c.v}</span>`}<b>${esc(c.n)}</b>${c.d ? `<div class="sd-a">${esc(c.d)}</div>` : ''}</button>`).join('')}</div>
   <p class="kx-note">The three cards are public. The starter picks first and last.</p></div>`;
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const i = S.draftPool.findIndex(c => c.id === b.dataset.d); S.hands[p].push(S.draftPool.splice(i, 1)[0]); S.draftPicks++;
    if (S.draftPicks >= 3 || !S.draftPool.length) { S.discard.push(...S.draftPool); S.draftPool = []; beginBattle(); }
    save(); render();
  });
}

function battleView() {
  const p = S.turn, n = N();
  const sel = S.hands[p].find(c => c.id === ui.sel);
  let panel = '';
  if (sel) panel = targetPanel(p, sel);
  app.innerHTML = head('Battle') + status() + `<div class="kx-card" data-nofx="1">${tableHTML()}</div>
   <div class="kx-card" data-nofx="1" style="margin-top:12px"><div class="kx-turn">${esc(n[p])}'s hand · ${S.hands[p].length} cards</div>${S.hands[p].length ? handHTML(p) : '<p class="kx-muted">Your hand is empty. Pass.</p>'}
   ${panel}<div class="kx-row" style="margin-top:12px"><button class="kx-btn ghost" id="pass">Pass${S.passes ? ' (ends the round)' : ''}</button></div></div>`;
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    const c = S.hands[p].find(x => x.id === b.dataset.c); if (!c) return;
    if (c.t === 'con') return playCard(p, c);
    ui.sel = ui.sel === c.id ? null : c.id; swapMine = null; battleView();
  });
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => playCard(p, sel, b.dataset.t));
  document.getElementById('pass').onclick = () => { ui.sel = null; S.passes++; if (S.passes >= 2) return endBattle(); next(); };
}
function targets(p, c) {
  const o = 1 - p, list = [];
  const con = (side, t) => ({k: side + ':' + S.table[side].indexOf(t), label: `${esc(N()[side])}: ${esc(t.card.n)} (${conTotal(t)})`});
  if (c.t === 'add') { S.table[p].forEach(t => list.push(con(p, t))); S.table[o].forEach(t => list.push(con(o, t))); }
  else if (c.x === 'spot') S.table[p].forEach(t => list.push(con(p, t)));
  else if (c.x === 'blk') S.table[o].forEach(t => list.push(con(o, t)));
  return list;
}
function targetPanel(p, c) {
  if (c.t === 'con') return '';
  if (c.t === 'sp' && (c.x === 'sab')) return `<div class="kx-sec">${esc(c.n)}</div><p class="kx-muted">${esc(c.d)}</p><button class="kx-btn sm" data-t="go">Play ${esc(c.n)}</button>`;
  if (c.x === 'swap') {
    const mk = (side, pre) => S.table[side].map((t, i) => `<button class="kx-btn ghost sm" data-t="${pre}${i}" style="margin:3px">${esc(t.card.n)}</button>`).join('');
    return `<div class="kx-sec">Swap: tap your contender, then theirs</div><p class="kx-muted">${esc(c.d)}</p><div>${swapPick(p)}</div>`;
  }
  return `<div class="kx-sec">${esc(c.n)}: choose a target</div>${targets(p, c).map(t => `<button class="kx-btn ghost sm sd-opt" data-t="${t.k}">${t.label}</button>`).join('')}`;
}
let swapMine = null;
function swapPick(p) {
  const o = 1 - p;
  if (swapMine === null) return S.table[p].map((t, i) => `<button class="kx-btn ghost sm sd-opt" data-t="m${i}">Yours: ${esc(t.card.n)} (${conTotal(t)})</button>`).join('');
  return S.table[o].map((t, i) => `<button class="kx-btn ghost sm sd-opt" data-t="o${i}">Theirs: ${esc(t.card.n)} (${conTotal(t)})</button>`).join('');
}

function playCard(p, c, tgt) {
  const o = 1 - p;
  const take = () => { S.hands[p] = S.hands[p].filter(x => x.id !== c.id); };
  const flash = txt => { S.log.unshift(txt); };
  if (c.t === 'con') { take(); S.table[p].push({card: c, att: []}); }
  else if (c.t === 'add') {
    if (!tgt) return; const [side, idx] = tgt.split(':').map(Number); take(); S.table[side][idx].att.push(c);
  } else if (c.x === 'sab') {
    const all = allAddons(o).sort((a, b) => b.a.v - a.a.v)[0]; take(); all.t.att = all.t.att.filter(x => x !== all.a); S.discard.push(all.a, c); flash('sab');
  } else if (c.x === 'blk') {
    if (!tgt) return; const idx = +tgt.split(':')[1]; const t = S.table[o][idx]; take(); S.table[o].splice(idx, 1); S.discard.push(t.card, ...t.att, c);
  } else if (c.x === 'spot') {
    if (!tgt) return; const idx = +tgt.split(':')[1]; take(); S.table[p][idx].dbl = true; S.discard.push(c);
  } else if (c.x === 'swap') {
    if (typeof tgt !== 'string') return;
    if (tgt[0] === 'm') { swapMine = +tgt.slice(1); return battleView(); }
    const a = swapMine, b = +tgt.slice(1); take(); const t = S.table[p][a]; S.table[p][a] = S.table[o][b]; S.table[o][b] = t; swapMine = null; S.discard.push(c);
  }
  S.passes = 0; ui.sel = null; try { KA_FX && KA_FX.clack && KA_FX.clack(); } catch (e) {}
  next();
}
function next() { S.turn = 1 - S.turn; ui.cover = S.turn; save(); render(); }

function endBattle() {
  const a = sideTotal(0), b = sideTotal(1);
  S.result = {a, b, w: a > b ? 0 : b > a ? 1 : -1};
  S.table.forEach(side => side.forEach(t => S.discard.push(t.card, ...t.att)));
  S.phase = 'score'; ui.cover = null; save(); render();
}
function scoreView() {
  const r = S.result, n = N();
  const snapshot = r;
  app.innerHTML = head('Round result') + status() + `<div class="kx-card" data-nofx="1" style="text-align:center"><div class="kx-turn">Round ${S.round}</div>
   <div class="kx-big" style="margin:8px auto">${esc(n[0])} ${r.a} : ${r.b} ${esc(n[1])}</div>
   <div class="kx-big" style="font-size:22px">${r.w < 0 ? '🤝 A draw. The pot grows and the star stays.' : '🏆 ' + esc(n[r.w]) + ' wins the pot of ' + S.pot.length + ' reward' + (S.pot.length === 1 ? '' : 's')}</div>
   ${two() && myIdx !== 0 ? `<p class="kx-muted" style="margin-top:12px">Waiting for ${esc(N()[0])} to continue…</p>` : '<div class="kx-row" style="justify-content:center;margin-top:14px"><button class="kx-btn gold" id="nx">Continue</button></div>'}</div>`;
  if (!document.getElementById('nx')) return;
  document.getElementById('nx').onclick = () => {
    if (r.w < 0) { return afterRound(); }
    S.wins[r.w]++; S.last = r.w; S.rw = {w: r.w, i: 0, picks: [], pot: S.pot.slice()}; S.pot = [];
    S.phase = 'pick'; ui.cover = r.w; save(); render();
  };
}
function afterRound() {
  const more = S.q.length > 0;
  if (!more && S.pot.length === 0) return toFinal();
  if (!more && S.pot.length > 0 && S.round >= S.rounds) { /* sudden-death: replay until someone wins */ }
  S.start = S.result.w >= 0 ? 1 - S.result.w : S.start; startRound(false); render();
}
function toFinal() {
  let w = S.wins[0] > S.wins[1] ? 0 : S.wins[1] > S.wins[0] ? 1 : S.last;
  if (w < 0) w = S.start;
  S.fw = w; S.phase = 'final'; ui.cover = w; save(); render();
}

function pickView() {
  const R = S.rw, card = R.pot[R.i], n = N();
  app.innerHTML = head('Claim your reward') + status() + `<div class="kx-card" data-nofx="1"><div class="kx-turn">${esc(n[R.w])}: reward ${R.i + 1} of ${R.pot.length}</div><div class="kx-big" style="font-size:22px;margin:8px 0">Choose one challenge</div>
   ${card.o.map((t, i) => `<button class="kx-opt sd-opt" data-o="${i}">${esc(t)}</button>`).join('')}</div>`;
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { R.cur = +b.dataset.o; R.tried = [R.cur]; S.phase = 'resp'; ui.cover = 1 - R.w; save(); render(); });
}
function respView() {
  const R = S.rw, card = R.pot[R.i], n = N(), r = 1 - R.w, text = card.o[R.cur];
  const can = S.bails[r] > 0 && !card.orig;
  app.innerHTML = head('Your partner chose') + status() + `<div class="kx-card" data-nofx="1" style="text-align:center"><div class="kx-turn">${esc(n[R.w])} picked this for ${esc(n[r])}</div><div class="kx-big" style="margin:12px auto">${esc(text)}</div>
   <div class="kx-row" style="justify-content:center"><button class="kx-btn gold" id="ac">Accept</button>${can ? `<button class="kx-btn ghost" id="bl">🛡 Bail (${S.bails[r]} left)</button>` : ''}</div>
   <p class="kx-note">Bailing is always okay. ${esc(n[R.w])} picks another option on the same card.</p></div>`;
  document.getElementById('ac').onclick = () => { S.phase = 'doit'; ui.cover = null; save(); render(); };
  if (can) document.getElementById('bl').onclick = () => { S.bails[r]--; S.phase = 'pick'; R.pot[R.i] = {o: card.o.filter((_, i) => !R.tried.includes(i)), lv: card.lv, orig: card.orig || card.o}; R.tried = []; ui.cover = R.w; save(); render(); };
}
function doitView() {
  const R = S.rw, card = R.pot[R.i], n = N();
  const text = card.o[R.cur];
  app.innerHTML = head('Enjoy it') + status() + `<div class="kx-card" data-nofx="1" style="text-align:center"><div class="kx-turn">Do it together</div><div class="kx-big" style="margin:12px auto">${esc(text)}</div>
   <div class="kx-row" style="justify-content:center"><button class="kx-btn gold" id="dn">Done · next</button><button class="kx-btn ghost" id="sv">♡ Save</button></div></div>`;
  document.getElementById('sv').onclick = e => { KX.fav('cards', text); e.target.textContent = '♥ Saved'; };
  document.getElementById('dn').onclick = () => {
    window.KA_TRACK && KA_TRACK.log('play', 'Seduction Showdown', text.slice(0, 70));
    R.i++; if (R.i < R.pot.length) { S.phase = 'pick'; ui.cover = R.w; } else { S.rw = null; return afterRoundReward(); }
    save(); render();
  };
}
function afterRoundReward() {
  if (S.q.length === 0 && S.pot.length === 0) return toFinal();
  S.start = 1 - S.result.w; startRound(false); render();
}
function finalView() {
  const n = N(), w = S.fw, f = S.finals[0];
  app.innerHTML = head('The final reward') + `<div class="kx-card" data-nofx="1"><div class="kx-turn">🏆 ${esc(n[w])} wins ${S.wins[w]} : ${S.wins[1 - w]}</div><div class="kx-big" style="font-size:22px;margin:8px 0">Choose the closing challenge</div>
   ${f.map((t, i) => `<button class="kx-opt sd-opt" data-f="${i}">${esc(t)}</button>`).join('')}<p class="kx-note">Final rewards cannot be bailed, so agree together first. Either of you can still say "pass".</p></div>`;
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.finalText = f[+b.dataset.f]; S.phase = 'end'; ui.cover = null; save(); window.KA_TRACK && KA_TRACK.log('play', 'Seduction Showdown final', S.finalText.slice(0, 70)); window.KA_TRACK && KA_TRACK.award && KA_TRACK.award('play'); render(); });
}
function endView() {
  const n = N(), w = S.fw;
  app.innerHTML = head('Game over') + `<div class="kx-card" data-nofx="1" style="text-align:center"><div class="kx-turn">Winner</div><div class="kx-big" style="margin:8px auto">🏆 ${esc(n[w])}</div><p class="kx-muted">${S.wins[0]} : ${S.wins[1]}</p><div class="kx-big" style="font-size:22px;margin:12px auto">${esc(S.finalText)}</div>
   <div class="kx-row" style="justify-content:center;margin-top:14px"><button class="kx-btn gold" id="ag">Play again</button><button class="kx-btn ghost" id="sv">♡ Save</button></div></div>`;
  document.getElementById('ag').onclick = () => { clearSave(); S = null; render(); };
  document.getElementById('sv').onclick = e => { KX.fav('cards', S.finalText); e.target.textContent = '♥ Saved'; };
}

/* resume */
if (S && S.phase && S.phase !== 'end') { ui.cover = ['battle', 'draft'].includes(S.phase) ? S.turn : (S.phase === 'pick' ? S.rw && S.rw.w : null); if (S.phase === 'draft') ui.cover = S.start; if (S.phase === 'resp') ui.cover = 1 - S.rw.w; if (S.phase === 'final') ui.cover = S.fw; }
render();
})();
</script>
