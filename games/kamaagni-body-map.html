    app.innerHTML = '<h1 class="kx-title"><span>Body Map</span></h1>' + U.bar([[esc(n[w]) + ' is rating', 'h2']], {guide: true}) + `<div class="kd-tabs"><button class="${st.side === 'f' ? 'on' : ''}" data-s="f">Front</button><button class="${st.side === 'b' ? 'on' : ''}" data-s="b">Back</button></div><div class="kx-card" data-nofx="1" style="text-align:center">${figure(st.side, col)}<div id="zp" class="kx-muted">Tap a zone, then choose a rating.</div></div><div class="kd-pass"><button class="kx-btn gold" id="dn">${w === 0 ? 'Done, pass the phone' : 'Done, show our map'}</button></div>`;
