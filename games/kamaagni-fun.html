<!doctype html>
<html lang="en"><head>
<script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060f"/>
<title>KamaAgni — Free-time Fun</title>
<link rel="stylesheet" href="../css/fonts.css"/>
<link rel="stylesheet" href="../css/premium.css"/>
<link rel="stylesheet" href="../css/ka-shared.css"/>
</head><body>
<style>@keyframes tgpop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}@keyframes tgroll{0%{transform:rotate(0) scale(.5);opacity:.2}30%{transform:rotate(200deg) scale(1.15)}60%{transform:rotate(340deg) scale(.95)}100%{transform:rotate(360deg) scale(1);opacity:1}}.tg-pop{animation:tgpop .5s ease both}.tg-roll{animation:tgroll .8s ease both}</style>
<main class="kx app" id="app"></main>
<script src="../js/ka-common.js"></script>
<script src="../js/ka-data.js"></script>
<script>
(async () => {
  const {LS, esc, top, pick, shuffle} = KX; const app = document.getElementById('app'); const F = window.KA_FILTER;
  let D; try { D = await (await fetch('../data/fun.json')).json(); } catch { app.innerHTML = top('Free-time Fun', '') + '<div class="kx-card">Could not load. Open from your hosted site.</div>'; return; }
  const C = () => window.KA_CLOUD, S = () => (C() ? C().state() : {}); const linked = () => { const s = S(); return !!(s.user && s.vault === 'ready' && s.couple && s.couple.partnerJoined && s.couple.hasKey); };
  const me = () => KX.names()[0]; let pname = '', liveOn = false, started = false;
  const ACT = [['wheel', '🎡', 'Date wheel'], ['deep', '💭', 'Deep questions'], ['fant', '🧩', 'Fantasy builder'], ['story', '✍️', 'Story builder'], ['quiz', '🎯', 'Know-me quiz'], ['ttl', '🕵️', 'Two truths & a lie']];
  let act = LS.get('ka_fun_tab', 'wheel') || 'wheel';
  const st = {story: [], quiz: {}, ttl: {}, inbox: [], tomb: {}};
  let wheel = null, dq = null, dqLvl = 'Warm', fant = null, spinning = false, local = {story: [], q: null, ttl: null};

  const send = (o) => C().couple.send('fun', {...o, n: me()}).catch(x => KX.toast(x.message));
  function apply(e) {
    const b = e.body; if (!b) return;
    if (e.kind === 'tomb') { st.tomb[b.x] = 1; draw(true); return; }
    if (e.kind !== 'fun') return;
    const who = e.mine ? 'me' : 'them'; if (b.n && !e.mine) pname = b.n;
    if (b.g === 'story') st.story.push({id: e.id, who, t: b.t, at: e.at});
    else if (b.g === 'quiz') { const r = (st.quiz[b.r] = st.quiz[b.r] || {r: b.r}); if (b.k === 'q') { r.q = b.q; r.o = b.o; r.ans = b.ans; r.asker = who; r.id = e.id; } else if (b.k === 'g') { r.guess = b.gi; r.guesser = who; } st.quizLast = b.r; }
    else if (b.g === 'ttl') { const r = (st.ttl[b.r] = st.ttl[b.r] || {r: b.r}); if (b.k === 's') { r.s = b.s; r.lie = b.lie; r.who = who; r.id = e.id; } else if (b.k === 'g') { r.guess = b.gi; } st.ttlLast = b.r; }
    else if (b.g === 'share') st.inbox.push({id: e.id, who, ti: b.ti, t: b.t, at: e.at});
    if (liveOn && !e.mine && window.KA_CHROME && Date.now() - new Date(e.at).getTime() < 40000) { const dsc = KA_CHROME.describe(e); if (dsc && !(b.g === 'story' && act === 'story')) KA_CHROME.notify(dsc); }
    draw(true);
  }
  const f = a => (F ? F.keep(a) : a);
  const fill = t => String(t);
  function shareBtn(ti, t) { return linked() ? `<button class="kx-btn ghost sm" data-share="${esc(ti)}|${esc(t)}">💞 Send to ${esc(pname || 'my partner')}</button>` : ''; }
  function view() {
    if (act === 'wheel') {
      const cats = Object.keys(D.wheel);
      return `<div class="kx-card kx-play"><div class="kx-muted">Free evening and no idea what to do? Spin.</div>
        <div class="kx-big ${spinning ? 'tg-roll' : 'tg-pop'}" id="wo" style="font-size:clamp(19px,4.2vw,24px);min-height:84px">${wheel ? esc(wheel.c) + '<br><span style="font-size:.8em">' + esc(wheel.t) + '</span>' : '🎡'}</div>
        <div class="kx-row" style="justify-content:center"><button class="kx-btn gold" id="sp">Spin the wheel</button>${wheel ? shareBtn('Date idea', wheel.t) + '<button class="kx-btn ghost sm" id="sv">♡ Save</button>' : ''}</div></div>`;
    }
    if (act === 'deep') {
      return `<div class="kx-card"><div class="kx-row">${Object.keys(D.deep).map(k => `<button class="kx-btn sm ${dqLvl === k ? '' : 'ghost'}" data-lv="${k}">${k}</button>`).join('')}</div>
        <div class="kx-card kx-play" style="margin-top:10px"><div class="kx-big ${dq ? 'tg-pop' : ''}" style="font-size:clamp(19px,4.2vw,24px);min-height:84px">${dq ? esc(dq) : '💭<br><span style="font-size:.7em">Take turns answering. No judging, no fixing, just listening.</span>'}</div>
        <div class="kx-row" style="justify-content:center"><button class="kx-btn gold" id="dn">Next question</button>${dq ? shareBtn('Question', dq) : ''}</div></div></div>`;
    }
    if (act === 'fant') {
      const parts = fant ? [['Setting', fant.setting], ['Roles', fant.role], ['Twist', fant.twist], ['Sensation', fant.sense]] : [];
      return `<div class="kx-card kx-play"><div class="kx-muted">Build a scene together. Agree your limits and stop word first, and skip anything that isn't a yes for both.</div>
        ${fant ? `<div class="kx-list" style="margin-top:10px">${parts.map(p => `<div class="kx-item tg-pop"><span class="kx-it"><span class="kx-muted">${p[0]}</span><br><b>${esc(p[1])}</b></span><button class="kx-btn ghost sm" data-re="${p[0]}" aria-label="Reroll">🎲</button></div>`).join('')}</div>` : '<div class="kx-big">🧩</div>'}
        <div class="kx-row" style="justify-content:center;margin-top:10px"><button class="kx-btn gold" id="fb">${fant ? 'Reroll all' : 'Build a scene'}</button>${fant ? shareBtn('Scene', parts.map(p => p[1]).join(' · ')) : ''}</div></div>`;
    }
    if (act === 'story') {
      const lines = linked() ? st.story.filter(l => !st.tomb[l.id]) : local.story;
      const mineLast = linked() && lines.length && lines[lines.length - 1].who === 'me';
      return `<div class="kx-card"><b>Write a story together</b><p class="kx-muted">Take turns adding one or two sentences. Start anywhere: a place, a look, a touch. Let it get as steamy or as sweet as you both like.${linked() ? '' : ' (Not linked, so pass the phone back and forth.)'}</p>
        <div class="kx-list" id="sl" style="max-height:44vh;overflow:auto">${lines.map((l, i) => `<div class="kx-item" style="${l.who === 'me' ? 'border-color:var(--rose)' : ''}"><span class="kx-it">${esc(l.t)}<br><span class="kx-muted" style="font-size:12px">${linked() ? (l.who === 'me' ? 'You' : esc(pname || 'Partner')) : 'Line ' + (i + 1)}</span></span>${linked() && l.who === 'me' ? `<button class="kx-btn ghost sm" data-sdel="${l.id}" aria-label="Delete">🗑</button>` : ''}</div>`).join('') || '<p class="kx-muted kx-center">Your story starts with the first line…</p>'}</div>
        <div class="kx-row" style="margin-top:10px"><input class="kx-input" id="si" maxlength="300" placeholder="${mineLast ? 'Waiting for your partner…' : 'Your next line…'}" style="flex:1" ${mineLast ? 'disabled' : ''}><button class="kx-btn" id="ss" ${mineLast ? 'disabled' : ''}>Add</button></div>
        <div class="kx-row" style="margin-top:8px">${lines.length > 3 ? '<button class="kx-btn ghost sm" id="sj">📓 Save to journal</button>' : ''}${!linked() && lines.length ? '<button class="kx-btn ghost sm" id="sc">Clear</button>' : ''}</div></div>`;
    }
    if (act === 'quiz') {
      if (!linked()) { const q = local.q; return `<div class="kx-card kx-play"><div class="kx-muted">Face-to-face: one person secretly picks their answer, the other guesses out loud.</div><div class="kx-big tg-pop" style="font-size:20px;margin-top:8px">${q ? esc(q.q) : '🎯'}</div>${q ? '<div class="kx-list">' + q.o.map(o => `<div class="kx-item"><span class="kx-it">${esc(o)}</span></div>`).join('') + '</div>' : ''}<div class="kx-row" style="justify-content:center;margin-top:8px"><button class="kx-btn gold" id="qn">${q ? 'Next question' : 'Start'}</button></div><p class="kx-note">Link with your partner in Together to play it on two phones, with the reveal.</p></div>`; }
      const r = st.quiz[st.quizLast || ''] || null, iAsk = r && r.asker === 'me', guessed = r && r.guess != null;
      let body = '<div class="kx-muted">One of you answers a question about themselves; the other guesses. Then you swap.</div>';
      if (r && r.q) {
        if (guessed) { const ok = r.guess === r.ans; body += `<div class="kx-big tg-pop" style="font-size:20px;margin-top:8px">${esc(r.q)}</div><div class="kx-list">${r.o.map((o, i) => `<div class="kx-item" style="${i === r.ans ? 'border-color:#4ade80' : ''}"><span class="kx-it">${i === r.ans ? '✅ ' : ''}${i === r.guess ? '👉 ' : ''}${esc(o)}</span></div>`).join('')}</div><div class="kx-big tg-pop" style="font-size:22px;margin-top:8px">${ok ? '🎉 Spot on!' : '😅 Close, but not quite'}</div><p class="kx-muted">${iAsk ? esc(pname || 'Your partner') + ' guessed' : 'You guessed'} ${ok ? 'right' : 'wrong'}.</p>`; }
        else if (iAsk) body += `<div class="kx-big" style="font-size:20px;margin-top:8px">${esc(r.q)}</div><p class="kx-muted">Your answer is hidden. Waiting for ${esc(pname || 'your partner')} to guess…</p>`;
        else body += `<div class="kx-big tg-pop" style="font-size:20px;margin-top:8px">${esc(r.q)}</div><p class="kx-muted">What did ${esc(pname || 'your partner')} pick?</p><div class="kx-list">${r.o.map((o, i) => `<button class="kx-item" data-qg="${i}" style="cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%"><span class="kx-it">${esc(o)}</span></button>`).join('')}</div>`;
      }
      const opts = (!r || guessed) ? `<div class="kx-row" style="justify-content:center;margin-top:10px"><button class="kx-btn gold" id="qa">${r ? 'Ask a new question' : 'Ask a question'}</button></div>` : '';
      return `<div class="kx-card kx-play">${body}${opts}</div>` + (st.pickQ ? `<div class="kx-card"><b>Pick your honest answer</b><div class="kx-big" style="font-size:18px;margin:6px 0">${esc(st.pickQ.q)}</div><div class="kx-list">${st.pickQ.o.map((o, i) => `<button class="kx-item" data-qs="${i}" style="cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%"><span class="kx-it">${esc(o)}</span></button>`).join('')}</div></div>` : '');
    }
    if (act === 'ttl') {
      if (!linked()) return `<div class="kx-card"><b>Two truths and a lie</b><p class="kx-muted">Each person says three statements about themselves, two true and one false. The other guesses the lie. Winner picks the next activity. Spice it up with intimate truths if you like.</p><p class="kx-note">Link with your partner in Together to play it on two phones.</p></div>`;
      const r = st.ttl[st.ttlLast || ''] || null, iMade = r && r.who === 'me', done = r && r.guess != null;
      let body = '<div class="kx-muted">Write two true things and one lie about yourself. Your partner guesses which is the lie.</div>';
      if (r && r.s) {
        if (done) body += `<div class="kx-list" style="margin-top:8px">${r.s.map((s, i) => `<div class="kx-item" style="${i === r.lie ? 'border-color:#ef4444' : ''}"><span class="kx-it">${i === r.lie ? '🤥 The lie: ' : '✅ '}${esc(s)}${i === r.guess ? ' 👈 guess' : ''}</span></div>`).join('')}</div><div class="kx-big tg-pop" style="font-size:22px;margin-top:8px">${r.guess === r.lie ? '🎯 Caught the lie!' : '😏 Fooled you!'}</div>`;
        else if (iMade) body += `<p class="kx-muted" style="margin-top:8px">Sent. Waiting for ${esc(pname || 'your partner')} to guess…</p>`;
        else body += `<p class="kx-muted" style="margin-top:8px">Which one is the lie?</p><div class="kx-list">${r.s.map((s, i) => `<button class="kx-item" data-tg="${i}" style="cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%"><span class="kx-it">${esc(s)}</span></button>`).join('')}</div>`;
      }
      const form = (!r || done) ? `<div style="margin-top:10px"><input class="kx-input" id="t1" maxlength="120" placeholder="Statement 1"><input class="kx-input" id="t2" maxlength="120" placeholder="Statement 2" style="margin-top:6px"><input class="kx-input" id="t3" maxlength="120" placeholder="Statement 3" style="margin-top:6px"><div class="kx-muted" style="margin:6px 0 4px">Which one is the lie?</div><div class="kx-row">${[1, 2, 3].map(n => `<button class="kx-btn sm ghost" data-lie="${n - 1}" id="lie${n}">${n}</button>`).join('')}</div><button class="kx-btn gold" id="ts" style="margin-top:8px">Send to ${esc(pname || 'my partner')}</button></div>` : '';
      return `<div class="kx-card kx-play">${body}${form}</div>`;
    }
  }
  let lieSel = -1;
  function bind() {
    const q = (s, fn) => app.querySelectorAll(s).forEach(fn), g = id => document.getElementById(id);
    q('[data-act]', b => b.onclick = () => { act = b.dataset.act; LS.set('ka_fun_tab', act); draw(); });
    q('[data-share]', b => b.onclick = () => { const [ti, t] = b.dataset.share.split('|'); send({g: 'share', ti, t, say: 'sent you: ' + t.slice(0, 60), ic: '💞'}); KX.toast('Sent'); window.KA_TRACK && KA_TRACK.log('together', 'Shared an idea', t.slice(0, 60)); });
    if (g('sp')) g('sp').onclick = () => { const cats = Object.keys(D.wheel); const all = cats.flatMap(c => f(D.wheel[c]).map(t => ({c, t}))); if (!all.length) return KX.toast('Nothing to show with your settings'); spinning = true; let n = 0; const iv = setInterval(() => { wheel = pick(all); draw(); if (++n > 9) { clearInterval(iv); spinning = false; draw(); window.KA_TRACK && KA_TRACK.log('play', 'Date wheel', wheel.t.slice(0, 70)); } }, 90); };
    if (g('sv')) g('sv').onclick = () => { KX.fav('cards', wheel.t); KX.toast('Saved'); };
    q('[data-lv]', b => b.onclick = () => { dqLvl = b.dataset.lv; dq = null; draw(); });
    if (g('dn')) g('dn').onclick = () => { const l = f(D.deep[dqLvl]); dq = l.length ? pick(l) : 'Nothing to show with your settings'; draw(); };
    const build = (key) => { const L = f(D.fantasy[key]); return L.length ? pick(L) : '—'; };
    if (g('fb')) g('fb').onclick = () => { fant = {setting: build('setting'), role: build('role'), twist: build('twist'), sense: build('sense')}; draw(); window.KA_TRACK && KA_TRACK.log('play', 'Fantasy builder', ''); };
    q('[data-re]', b => b.onclick = () => { const k = {Setting: 'setting', Roles: 'role', Twist: 'twist', Sensation: 'sense'}[b.dataset.re]; fant[k] = build(k); draw(); });
    const addLine = () => { const i = g('si'), t = i.value.trim(); if (!t) return; i.value = ''; if (linked()) send({g: 'story', t, say: 'added a line to your story', ic: '✍️'}); else { local.story.push({who: 'me', t}); draw(); } };
    if (g('ss')) { g('ss').onclick = addLine; g('si').onkeydown = e => { if (e.key === 'Enter') addLine(); }; }
    q('[data-sdel]', b => b.onclick = async () => { const id = +b.dataset.sdel; await C().couple.send('tomb', {x: id, n: me()}); st.tomb[id] = 1; C().couple.del(id).catch(() => {}); draw(); });
    if (g('sj')) g('sj').onclick = () => { const lines = linked() ? st.story.filter(l => !st.tomb[l.id]) : local.story; const j = LS.get('ka_journal', []); j.push({id: Date.now(), d: window.KA_TRACK ? KA_TRACK.today() : new Date().toISOString().slice(0, 10), r: 5, g: ['Story'], n: lines.map(l => l.t).join(' ').slice(0, 600)}); LS.set('ka_journal', j); KX.toast('Saved to journal'); };
    if (g('sc')) g('sc').onclick = () => { local.story = []; draw(); };
    if (g('qn')) g('qn').onclick = () => { local.q = pick(f(D.quiz)); draw(); };
    if (g('qa')) g('qa').onclick = () => { st.pickQ = pick(f(D.quiz)); draw(); };
    q('[data-qs]', b => b.onclick = () => { const p = st.pickQ; st.pickQ = null; send({g: 'quiz', k: 'q', r: Date.now(), q: p.q, o: p.o, ans: +b.dataset.qs, say: 'asked you a "know me" question', ic: '🎯'}); });
    q('[data-qg]', b => b.onclick = () => { const r = st.quiz[st.quizLast]; send({g: 'quiz', k: 'g', r: r.r, gi: +b.dataset.qg, say: 'guessed your answer. See the result!', ic: '🎯'}); window.KA_TRACK && KA_TRACK.log('play', 'Know-me quiz', ''); });
    q('[data-lie]', b => b.onclick = () => { lieSel = +b.dataset.lie; q('[data-lie]', x => x.classList.toggle('ghost', +x.dataset.lie !== lieSel)); });
    if (g('ts')) g('ts').onclick = () => { const s = [g('t1').value.trim(), g('t2').value.trim(), g('t3').value.trim()]; if (s.some(x => !x) || lieSel < 0) return KX.toast('Fill all three and pick the lie'); send({g: 'ttl', k: 's', r: Date.now(), s, lie: lieSel, say: 'sent you two truths and a lie', ic: '🕵️'}); lieSel = -1; };
    q('[data-tg]', b => b.onclick = () => { const r = st.ttl[st.ttlLast]; send({g: 'ttl', k: 'g', r: r.r, gi: +b.dataset.tg, say: 'guessed your lie. See the result!', ic: '🕵️'}); window.KA_TRACK && KA_TRACK.log('play', 'Two truths and a lie', ''); });
    if (g('sl')) g('sl').scrollTop = g('sl').scrollHeight;
  }
  function draw(soft) {
    if (soft) { const a = document.activeElement; if (a && a.tagName === 'INPUT' && a.value) return; }
    const inbox = st.inbox.filter(i => !st.tomb[i.id] && i.who === 'them').slice(-3).reverse();
    app.innerHTML = top('Free-time Fun', 'Things to do together when you have an hour and no plan.') +
      `<div class="kx-row" style="margin-bottom:8px">${ACT.map(a => `<button class="kx-btn sm ${act === a[0] ? '' : 'ghost'}" data-act="${a[0]}">${a[1]} ${a[2]}</button>`).join('')}</div>` + view() +
      (inbox.length ? `<div class="kx-card"><b>💞 From ${esc(pname || 'your partner')}</b><div class="kx-list" style="margin-top:8px">${inbox.map(i => `<div class="kx-item"><span class="kx-it"><span class="kx-chip">${esc(i.ti)}</span> ${esc(i.t)}</span></div>`).join('')}</div></div>` : '') +
      `<p class="kx-note">${linked() ? '🟢 Linked: play live with ' + esc(pname || 'your partner') : 'Not linked: everything works face to face. Link in Together to play on two phones.'}</p>`;
    bind();
  }
  function start() { if (started || !linked()) return; started = true; liveOn = false; setTimeout(() => { liveOn = true; }, 3500); C().couple.live(apply, () => {}, me()); }
  window.addEventListener('ka:cloud', () => { if (linked()) start(); else started = false; draw(true); });
  draw(); start();
})();
</script>
<script src="../js/ka-config.js"></script><script src="../js/ka-features.js"></script><script src="../js/app-shell.js"></script><script src="../js/ka-gate.js"></script><script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
