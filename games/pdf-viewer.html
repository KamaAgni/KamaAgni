<style>

.bar{position:sticky;top:var(--hdr,56px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:rgba(5,6,15,.94);border-bottom:1px solid var(--border2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.bar .t{flex:1;min-width:120px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.bar .pg{font-size:12px;color:var(--muted);min-width:70px;text-align:center}
@media (max-width:560px){.bar .lbl{display:none}.bar .pg{min-width:40px}.bar{gap:4px;padding:8px 8px}.bar .t{flex-basis:100%;order:-1}.bar .kx-btn,.bar .kx-back{min-width:40px;min-height:40px;padding:0 8px;justify-content:center}}

.pgbox canvas{display:block;max-width:100%;height:auto!important}
.pgbox.ld{background:linear-gradient(100deg,#f4f4f6 30%,#fff 50%,#f4f4f6 70%);background-size:200% 100%;animation:sh 1.4s linear infinite;color:#777;font-size:13px}
.pgbox.er{cursor:pointer;color:#b33;font-weight:700}
@keyframes sh{to{background-position:-200% 0}}
#msg{text-align:center;padding:40px 20px;color:var(--text2);line-height:1.7}
#msg .kx-prog{max-width:320px;margin:14px auto 6px}

#tv{display:none;padding:12px 8px 70px;overflow-x:auto}
.kp,.kcover,.pgbox{scroll-margin-top:calc(var(--hdr,56px) + var(--barh,60px) + 8px)}

  background:radial-gradient(120% 70% at 50% 108%,rgba(232,99,122,.55),transparent 60%),radial-gradient(90% 60% at 50% -10%,rgba(240,190,60,.28),transparent 60%),linear-gradient(160deg,#1b0d1c,#2c0f22 55%,#12070f);color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.45)}

.kcover .kl{width:34%;height:2px;margin:6% auto 0;background:linear-gradient(90deg,transparent,#f0be3c,transparent)}

#prdlg.on{display:block}
#prdlg label{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
#prdlg input{width:24px;height:24px;margin:0}
#pv{display:none}

#prdlg input[type=text]{width:9.5em}
#prdlg input[type=radio]{width:22px;height:22px}
#prsum{margin:6px 0 2px;font-size:14px;color:#ffe2a8}
#prerr{color:#ffb3b3;font-size:14px;min-height:0}
@media print{
  html,body,html.ka-chrome,html.ka-chrome body{background:#fff!important;background-image:none!important;padding:0!important;margin:0!important}
  html::before,html::after,body::before,body::after{display:none!important;content:none!important}
  body>*:not(#pv){display:none!important}
  #pv{display:block!important}
  .sh{width:100vw;height:100vh;display:grid;gap:0;break-after:page;page-break-after:always;overflow:hidden;background:#fff}
  .sh:last-child{break-after:auto;page-break-after:auto}
  .sh>div{display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;min-height:0}
  .sh img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
  .sh .kcover{width:100%!important;height:100%!important;margin:0!important;border-radius:0!important;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<script>
(function(){

    }).catch(function(){ rendered[i]=0; var b=boxes[i-1]; if(b){ b.className='pgbox er'; b.textContent='Page '+i+' did not load. Tap to try again.'; b.onclick=function(){ b.onclick=null; b.className='pgbox ld'; b.textContent='Page '+i+' · loading…'; render(i); }; } });
  }
  /* ---- KamaAgni view (v88): the original pages drawn as pictures, in their own colours, size and layout, on a web page.

     A KamaAgni front page comes first; printing gives the pages at their original size, with the front page optional. ---- */
  var TV=false, tvBuilt=false, tvDone={}, tvTz=1, title=name||fname.replace(/\.pdf$/i,''), ratio=0.7071;

    .then(function(){ title=title.replace(/etsy/ig,'').replace(/[_\s]+/g,' ').trim(); });

    var R=[],G=[],B=[],k=4; [[x0-k,y0-k,x1-x0+2*k,k],[x0-k,y1,x1-x0+2*k,k],[x0-k,y0,k,y1-y0],[x1,y0,k,y1-y0]].forEach(function(r){ var x=Math.max(0,r[0]),y=Math.max(0,r[1]),w=Math.min(W,r[0]+r[2])-x,h=Math.min(H,r[1]+r[3])-y; if(w<=0||h<=0) return; var d=ctx.getImageData(x,y,w,h).data; for(var j=0;j<d.length;j+=4){ R.push(d[j]); G.push(d[j+1]); B.push(d[j+2]); } });
    var med=function(a){ if(!a.length) return 255; a.sort(function(p,q){return p-q;}); return a[a.length>>1]; };
    ctx.fillStyle='rgb('+med(R)+','+med(G)+','+med(B)+')'; ctx.fillRect(x0,y0,x1-x0,y1-y0); }
  function tvPage(i){
    if(tvDone[i]) return tvDone[i];
    var sec=document.getElementById('kp'+i);
    tvDone[i]=pdf.getPage(i).then(function(pg){
      var v0=pg.getViewport({scale:1}), target=Math.min(1700,Math.max(1200,Math.round(Math.min(innerWidth,900)*(window.devicePixelRatio||1)))), v=pg.getViewport({scale:target/v0.width});
      var c=document.createElement('canvas'); c.width=Math.round(v.width); c.height=Math.round(v.height);

        var ctx=c.getContext('2d'); (CLEAN.m[String(i)]||[]).forEach(function(b){ cover(ctx,c.width,c.height,b); });
        return new Promise(function(res){ c.toBlob(function(bl){ var im=new Image(); im.alt='Page '+(kept().indexOf(i)+1)+' of '+title; im.width=c.width; im.height=c.height;

    Promise.all([cleanReady,pdf.getPage(kept()[0]||1)]).then(function(r){
      var v1=r[1].getViewport({scale:1}); ratio=v1.width/v1.height;

  /* zoom KamaAgni view and stay on the same page */
  function tvZoom(z){ var el=document.getElementById('kp'+curPg), off=el?el.getBoundingClientRect().top:0, h0=el?el.getBoundingClientRect().height:1;

  /* which pages: "3-10, 15" in the page numbers shown at the top (the original's numbers); left-out pages are ignored */
  function prPages(){
