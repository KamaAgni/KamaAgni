<!doctype html>
<html lang="en"><head>
<script src="../js/ka-boot.js"></script><script src="../js/ka-filter.js"></script><script src="../js/ka-fx.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060f"/><meta name="robots" content="noindex,nofollow"/>
<title>KamaAgni — Reader</title>
<link rel="stylesheet" href="../css/fonts.css"/><link rel="stylesheet" href="../css/ka-shared.css"/>
<style>
body{padding-bottom:0}
.bar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:rgba(5,6,15,.94);border-bottom:1px solid var(--border2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.bar .t{flex:1;min-width:120px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.bar .pg{font-size:12px;color:var(--muted);min-width:70px;text-align:center}
#pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 8px 60px}
.pgbox{background:#fff;max-width:100%;box-shadow:0 6px 24px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
.pgbox canvas{display:block;max-width:100%;height:auto!important}
#msg{text-align:center;padding:40px 20px;color:var(--text2);line-height:1.7}
#msg .kx-prog{max-width:320px;margin:14px auto 6px}
</style>
</head><body>
<div class="bar">
  <a class="kx-back" href="kamaagni-library.html">← Library</a>
  <span class="t" id="ttl">Loading…</span>
  <button class="kx-btn sm ghost" id="zo" aria-label="Zoom out">−</button>
  <span class="pg" id="pg"></span>
  <button class="kx-btn sm ghost" id="zi" aria-label="Zoom in">+</button>
  <button class="kx-btn sm gold" id="dl">⬇ Download</button>
</div>
<div id="msg"><div id="mt">Opening the PDF…</div><div class="kx-prog"><i id="pb" style="width:3%"></i></div><div class="kx-muted" id="ps"></div></div>
<div id="pages"></div>
<script src="../js/vendor/pdf.min.js"></script>
<script>
(function(){
  var REPO='KamaAgni/KamaAgniPDF',BR='main';
  var q=new URLSearchParams(location.search), p=q.get('p'), u=q.get('u'), name=q.get('n')||'';
  var url;
  function bad(m){document.getElementById('mt').textContent=m;document.getElementById('pb').parentNode.style.display='none'}
  if(p){ if(p.indexOf('..')>-1||!/\.pdf$/i.test(p)){return bad('Invalid file.')}
    url='https://raw.githubusercontent.com/'+REPO+'/'+BR+'/'+p.split('/').map(encodeURIComponent).join('/'); }
  else if(u){ try{ var uu=new URL(u,location.href); if(uu.origin!==location.origin) return bad('Invalid file.'); url=uu.href; }catch(e){return bad('Invalid file.')} }
  else return bad('No file selected.');
  var fname=decodeURIComponent((p||u).split('/').pop());
  document.getElementById('ttl').textContent=name||fname.replace(/\.pdf$/i,'');
  document.title='KamaAgni — '+(name||fname);
  var scale=1, pdf=null, boxes=[], rendered={}, token=0;
  document.getElementById('dl').onclick=function(){
    var b=this; b.textContent='Downloading…'; b.disabled=true;
    fetch(url).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(bl){
      var a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download=fname; document.body.appendChild(a); a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000); b.textContent='✓ Saved'; b.disabled=false;
    }).catch(function(){ window.open(url,'_blank','noopener'); b.textContent='⬇ Download'; b.disabled=false; });
  };
  pdfjsLib.GlobalWorkerOptions.workerSrc='../js/vendor/pdf.worker.min.js';
  var task=pdfjsLib.getDocument({url:url,withCredentials:false});
  task.onProgress=function(o){ if(o.total){ var pc=Math.min(99,Math.round(o.loaded/o.total*100)); document.getElementById('pb').style.width=pc+'%'; document.getElementById('ps').textContent=(o.loaded/1048576).toFixed(1)+' / '+(o.total/1048576).toFixed(1)+' MB'; } else document.getElementById('ps').textContent=(o.loaded/1048576).toFixed(1)+' MB'; };
  task.promise.then(function(d){
    pdf=d; document.getElementById('msg').style.display='none'; build();
  }).catch(function(e){
    bad('Could not open this PDF in the reader (it may be very large or you may be offline).');
    var m=document.getElementById('msg'); var a=document.createElement('a'); a.className='kx-btn sm gold'; a.style.marginTop='14px'; a.href=url; a.target='_blank'; a.rel='noopener'; a.textContent='Open file directly'; m.appendChild(document.createElement('br')); m.appendChild(a);
  });
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting) render(+e.target.dataset.i); }); },{rootMargin:'600px 0px'});
  function build(){
    var host=document.getElementById('pages'); host.innerHTML=''; boxes=[]; rendered={}; token++;
    var w=Math.min(innerWidth-16,900)*scale;
    pdf.getPage(1).then(function(pg){
      var v=pg.getViewport({scale:1}), h=w*v.height/v.width;
      for(var i=1;i<=pdf.numPages;i++){ var b=document.createElement('div'); b.className='pgbox'; b.dataset.i=i; b.style.width=w+'px'; b.style.height=h+'px'; b.textContent='Page '+i; host.appendChild(b); boxes.push(b); io.observe(b); }
      upd(1);
    });
  }
  function render(i){
    if(rendered[i]) return; rendered[i]=1; var tk=token;
    pdf.getPage(i).then(function(pg){
      if(tk!==token) return;
      var w=Math.min(innerWidth-16,900)*scale, v0=pg.getViewport({scale:1}), s=w/v0.width, dpr=Math.min(devicePixelRatio||1,2);
      var v=pg.getViewport({scale:s*dpr}), c=document.createElement('canvas'); c.width=v.width; c.height=v.height; c.style.width=w+'px';
      return pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise.then(function(){ if(tk!==token) return; var b=boxes[i-1]; b.style.height='auto'; b.textContent=''; b.appendChild(c); });
    }).catch(function(){ rendered[i]=0; });
  }
  function upd(n){ document.getElementById('pg').textContent=n+' / '+(pdf?pdf.numPages:'?'); }
  addEventListener('scroll',function(){ var mid=innerHeight/2,cur=1; for(var i=0;i<boxes.length;i++){ var r=boxes[i].getBoundingClientRect(); if(r.top<=mid) cur=i+1; else break; } upd(cur); },{passive:true});
  document.getElementById('zi').onclick=function(){ scale=Math.min(2.5,scale+.25); if(pdf) build(); };
  document.getElementById('zo').onclick=function(){ scale=Math.max(.5,scale-.25); if(pdf) build(); };
})();
</script>
<script src="../js/ka-config.js"></script><script src="../js/ka-features.js"></script><script src="../js/app-shell.js"></script><script src="../js/ka-gate.js"></script>
<script src="../js/ka-track.js"></script>
<script src="../js/ka-chrome.js"></script>
</body></html>
